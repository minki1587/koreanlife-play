name: Publish Korean Life
on:
  push:
    branches: [main]
    paths: ['site/**', 'deploy/runtime-update/**', '.github/workflows/pages.yml', '.github/workflows/update-runtime.yml']
  workflow_dispatch:
    inputs:
      birth_timing_only:
        description: 'Validate changed birth animation and export integrity only'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check game modules
        run: |
          if [ "${{ inputs.birth_timing_only }}" = 'true' ]; then
            node --check site/birth-reel.mjs
          else
            for module in site/*.mjs; do node --check "$module"; done
          fi
      - name: Test public updater and verify managed runtime
        run: |
          if [ "${{ inputs.birth_timing_only }}" != 'true' ]; then
            python -m unittest discover -s deploy/runtime-update -p 'test_*.py' -v
          fi
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'deploy/runtime-update'); import update_runtime; update_runtime.verify_export_marker(Path('site').resolve(),Path('.koreanlife-pages-export.json').resolve())"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
