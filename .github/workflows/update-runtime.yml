name: Refresh approved public game data
on:
  schedule:
    # Tuesday 00:00 UTC = Tuesday 09:00 Asia/Seoul.
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate official sources without committing or deploying
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Test allowlist, rights gates, field preservation and rollback
        run: python -m unittest discover -s deploy/runtime-update -p 'test_*.py' -v
      - name: Refresh only approved observations
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python deploy/runtime-update/update_runtime.py --dry-run
          else
            python deploy/runtime-update/update_runtime.py
          fi
      - name: Check runtime modules and occupation compatibility
        run: |
          for module in site/*.mjs; do node --check "$module"; done
          node --input-type=module -e "import fs from 'node:fs'; import {validateCareerCatalog} from './site/career-browser.mjs'; import {occupationModelIndex} from './site/career-economy.mjs'; const c=JSON.parse(fs.readFileSync('site/occupations.json','utf8')); validateCareerCatalog(c); occupationModelIndex(c); const r=JSON.parse(fs.readFileSync('site/occupations-runtime.json','utf8')); validateCareerCatalog(r); occupationModelIndex(r); if(r.sourceCatalog.sha256!== (await import('node:crypto')).createHash('sha256').update(fs.readFileSync('site/occupations.json')).digest('hex')) throw new Error('Runtime catalog is out of date');"
      - name: Commit only public runtime observations and status
        if: inputs.dry_run != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/occupations.json site/occupations-runtime.json site/runtime-update-status.json .koreanlife-pages-export.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh approved observations'
            git push origin HEAD:main
          fi
      # A GITHUB_TOKEN push does not start another push workflow. Deploy here.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: inputs.dry_run != true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: inputs.dry_run != true
        with:
          path: site
      - id: deployment
        if: inputs.dry_run != true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
