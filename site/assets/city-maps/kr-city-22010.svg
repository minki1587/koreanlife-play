<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 중구 2025 통계지역과 주변 경계"><title>대구광역시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22020" d="M237.917,44.341L239.866,40.056L256.776,28.815L267.340,16.647L270.208,6.656L273.909,0.000L320.000,0.000L320.000,114.452L288.000,111.135L270.390,68.218L259.748,59.791L237.354,46.941Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22030" d="M77.960,0.000L70.695,29.745L56.717,26.691L59.790,51.700L65.594,58.645L60.341,58.478L50.241,51.884L48.931,53.234L42.487,68.764L42.753,76.093L50.268,84.689L57.254,84.011L63.388,81.355L67.263,78.273L66.466,96.014L68.592,97.184L67.898,99.229L63.131,106.713L61.348,108.652L56.675,113.383L39.303,128.171L32.000,135.715L34.738,156.218L0.000,167.185L0.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22040" d="M37.335,176.385L89.451,204.495L120.251,200.943L163.382,201.749L170.985,202.556L178.429,204.153L187.673,209.773L249.871,213.309L250.230,217.872L246.224,240.000L32.415,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22050" d="M70.695,29.745L77.960,0.000L273.909,0.000L270.20