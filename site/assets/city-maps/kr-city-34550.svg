<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 청양군 2025 통계지역과 주변 경계"><title>충청남도 청양군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-34020" d="M303.153,214.544L300.610,215.240L300.330,218.606L296.454,230.512L293.105,231.379L291.956,231.014L291.162,229.763L290.538,230.257L290.079,231.952L290.419,235.584L288.932,238.369L289.519,240.000L265.297,240.000L262.545,236.153L259.353,234.135L258.807,232.817L259.211,232.037L257.944,230.105L257.496,230.037L256.776,230.967L255.509,230.817L254.191,229.485L253.345,229.186L248.967,229.716L246.862,229.220L244.305,226.689L243.751,224.417L241.808,223.003L241.475,222.227L241.511,218.989L242.070,216.405L245.240,213.222L246.023,209.844L247.543,206.789L246.590,206.009L243.616,205.128L242.777,203.446L243.582,201.230L240.809,199.763L239.760,199.821L238.224,200.816L236.320,201.325L234.998,200.980L239.762,197.464L241.675,194.744L242.593,190.151L242.262,181.237L243.215,176.096L244.326,173.734L246.585,171.111L259.643,161.050L263.701,156.061L266.340,151.936L266.664,149.717L264.551,146.122L259.172,139.319L262.378,136.351L264.010,135.496L264.330,134.878L264.477,133.209L262.459,131.376L260.847,127.545L262.191,124.470L261.589,123.835L260.847,123.766L259.668,124.502L257.720,124.978L254.235,123.968L253.806,122.517L255.061,119.815L254.645,114.670L253.858,114.158L251.484,115.021L251.370,113.410L252.284,112.476L252.638,111.463L250.557,111.179L248.483,108.009L246.972,107.126L244.455,107.445L239.931,105.913L238.102,105.234L235.676,103.363L232.985,102.681L229.031,102.452L226.189,103.552L224.012,101.634L223.244,102.868L221.