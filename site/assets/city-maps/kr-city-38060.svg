<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상남도 사천시 2025 통계지역 경계 실루엣"><title>경상남도 사천시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M168.063,199.288L167.847,198.404L168.281,198.161L169.880,199.107L169.128,199.612ZM158.035,194.304L158.703,193.356L160.228,194.113L160.396,195.151L159.123,195.866L158.374,195.689ZM157.828,187.189L158.633,186.128L159.743,186.267L161.688,188.230L161.770,189.517L160.169,189.998L158.794,189.369L157.998,188.744ZM186.565,195.180L185.641,195.199L185.739,196.056L184.746,196.332L182.273,196.000L180.844,195.439L180.509,194.708L175.664,194.150L174.577,193.287L170.796,196.181L168.173,197.335L166.869,198.481L166.661,199.720L166.110,200.438L163.794,201.983L162.046,199.610L161.192,197.300L162.500,195.197L163.827,195.406L164.968,198.319L166.520,198.266L167.741,197.213L167.167,196.720L167.374,195.712L168.790,195.114L169.871,196.193L171.131,195.741L173.986,192.414L172.731,190.862L169.622,188.546L165.524,183.831L164.415,183.323L164.781,179.871L164.449,179.025L163.138,177.513L161.759,176.721L159.044,172.192L158.938,171.249L159.333,170.017L161.005,170.552L165.742,166.479L167.009,164.694L169.590,163.387L171.931,159.742L172.022,157.937L173.662,155.402L173.224,154.872L171.312,154.574L169.169,153.209L167.887,150.547L168.435,149.049L167.238,146.443L166.862,146.147L166.476,146.398L165.582,145.410L164.739,143.390L164.955,142.172L164.553,140.957L164.802,136.532L165.280,135.234L167.630,131.795L170.673,129.474L171.349,128.474L171.860,124.802L168.449,118.358L167.674,118.133L164.921,120.728L163.985,123.301L163.338,122.803L161.908,119.278L163.935,115.609L166.859,112.413L165.648,111.170L164.371,107.979L165.027,102.912L166.352,100.