<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 강서구 2025 통계지역과 주변 경계"><title>서울특별시 강서구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11120" d="M317.312,93.411L316.717,92.782L314.393,95.777L307.723,89.993L307.168,87.764L303.921,83.615L302.103,82.111L296.049,78.454L291.671,74.743L276.799,58.728L280.116,55.693L281.873,52.744L285.309,51.678L284.572,55.369L283.044,58.397L283.744,60.879L286.553,64.532L294.617,64.924L305.470,64.590L311.106,61.572L309.488,54.718L310.171,53.291L312.569,50.723L314.167,46.126L314.469,38.309L312.054,31.776L312.132,29.012L315.698,27.402L315.007,22.716L315.989,19.386L315.589,13.750L314.120,6.538L313.780,6.223L315.177,0.000L320.000,0.000L320.000,90.014Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11130" d="M314.325,96.896L317.312,93.411L320.000,90.014L320.000,101.609Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11140" d="M314.953,173.846L314.133,171.235L308.809,164.374L292.527,156.284L256.379,134.319L238.971,122.031L223.662,109.743L220.539,105.237L221.665,100.220L231.445,97.813L236.536,95.418L242.837,95.509L246.145,94.018L248.786,91.735L259.253,88.242L266.532,88.153L267.629,86.087L267.322,84.714L265.713,81.637L265.828,75.358L267.734,70.269L272.967,61.878L276.799,58.728L291.671,74.743L296.