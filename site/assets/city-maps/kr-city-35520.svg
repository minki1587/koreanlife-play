<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 진안군 2025 통계지역 경계 실루엣"><title>전북특별자치도 진안군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M172.642,175.478L172.439,177.317L173.237,179.562L173.606,182.024L173.369,183.400L171.330,186.561L168.432,187.811L167.775,188.667L168.533,190.802L168.228,194.163L167.472,196.472L166.137,197.650L165.662,199.244L167.631,201.927L171.396,205.097L173.036,205.749L173.417,206.717L172.634,207.474L171.986,209.137L171.655,213.050L170.030,214.605L168.540,217.919L169.998,223.812L169.369,226.590L168.326,227.002L167.413,226.761L162.925,228.000L158.280,227.741L156.308,226.401L155.323,226.394L154.893,224.037L153.458,222.973L152.965,222.096L153.003,220.888L153.859,219.698L153.664,218.593L152.135,216.304L148.743,216.455L147.020,215.892L146.042,214.574L141.324,212.545L139.469,210.610L136.661,210.544L134.698,208.615L130.321,209.328L130.647,205.794L129.965,203.985L125.865,204.795L125.389,205.877L124.603,206.008L123.731,204.728L123.425,202.564L122.292,201.632L121.083,201.355L120.162,202.237L116.730,203.340L112.188,203.497L108.536,205.757L106.788,204.355L106.216,200.810L103.506,196.269L99.218,192.915L97.767,192.967L95.152,194.323L92.774,192.334L92.536,190.746L93.396,189.363L92.762,187.212L93.638,186.037L93.640,184.493L92.334,180.805L92.378,178.521L94.013,175.885L91.142,169.213L91.694,168.151L91.356,167.314L90.730,166.639L89.602,166.664L88.653,165.344L88.928,164.457L88.553,162.772L86.612,159.115L86.525,157.018L85.553,155.724L83.371,154.208L82.003,152.017L81.858,149.431L82.251,148.212L85.239,145.329L84.272,143.829L85.890,141.497L85.485,138.097L85.724,137.764L86.750,137.829L87.233,137.051L88.691,136.165L91.273,135.6