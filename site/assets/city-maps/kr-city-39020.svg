<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="제주특별자치도 서귀포시 2025 통계지역과 주변 경계"><title>제주특별자치도 서귀포시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-39010" d="M30.412,113.216L30.333,113.601L29.262,113.701L29.349,113.064ZM24.184,113.338L26.608,112.424L27.471,113.360L26.102,114.114L24.878,114.115ZM76.232,109.744L70.218,113.545L69.580,114.726L65.870,117.874L65.654,119.163L65.081,119.700L60.569,120.834L58.032,122.349L56.667,124.029L56.543,124.783L57.084,128.671L52.401,124.427L43.826,119.950L39.917,118.597L39.785,120.090L36.553,120.799L35.678,120.639L35.667,120.213L35.260,120.385L33.087,122.310L32.850,122.922L33.342,123.518L32.045,125.035L29.614,123.613L29.827,122.124L29.230,120.218L29.695,119.257L31.371,118.230L30.215,114.471L30.928,113.406L31.575,110.680L31.204,109.231L29.971,108.526L30.361,105.465L29.564,104.916L29.341,103.542L29.671,102.891L31.016,102.670L31.205,101.092L32.068,99.773L34.464,99.061L35.337,99.705L36.045,96.868L35.700,95.596L36.290,94.617L38.615,92.999L41.123,92.554L41.835,91.972L42.880,92.169L44.178,90.811L44.616,89.499L47.077,88.152L47.461,86.949L46.912,86.700L46.817,86.208L49.800,83.964L49.815,83.008L50.257,82.489L51.625,82.600L51.759,81.873L52.459,81.503L53.496,82.651L54.945,80.655L56.410,80.804L56.130,79.114L56.449,78.578L57.554,78.152L58.508,78.607L59.296,78.389L59.055,76.908L59.589,75.641L60.679,74.312L61.353,74.211L62.275,73.245L63.675,72.874L62.686,70.355L62.177,71.023L62.455,71.273L62.057,72.575L60.200,72.627L61.635,72.400L61.557,70.683L62.092,68.946L63.289,69.175L63.546,68.857L62.827,65.703L63.375,64.604L66.035,63.