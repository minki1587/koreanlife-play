<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 남원시 2025 통계지역 경계 실루엣"><title>전북특별자치도 남원시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M156.787,181.036L155.222,184.177L152.808,187.174L152.482,189.880L149.078,192.864L148.087,194.291L148.269,195.620L147.561,196.456L144.037,198.861L143.160,200.981L143.761,202.677L142.683,207.865L142.176,208.721L140.932,209.625L139.484,209.642L137.306,211.566L135.311,214.111L133.677,214.960L131.159,214.029L129.304,209.402L127.711,208.138L125.630,206.626L123.186,206.651L120.310,204.714L118.408,202.241L116.700,201.665L113.366,202.219L111.571,203.475L103.090,205.996L101.294,206.203L100.719,207.257L101.012,208.412L100.389,209.176L99.223,209.952L96.895,210.683L97.172,212.555L87.757,214.998L86.167,215.037L85.590,214.750L85.206,213.187L83.605,211.134L77.903,207.617L75.588,206.820L65.138,207.652L61.529,207.126L58.799,208.661L56.474,207.973L53.684,206.031L52.580,203.532L43.320,195.259L42.729,192.965L41.319,191.148L35.996,190.094L33.990,191.048L31.832,195.522L32.565,200.443L32.551,203.210L31.488,205.079L28.751,205.752L22.631,205.483L20.045,203.072L14.316,200.613L12.716,198.062L12.000,195.835L12.098,193.224L13.737,190.403L18.190,189.184L19.543,188.337L18.468,186.667L15.229,185.510L14.494,184.944L14.420,184.153L15.736,179.592L17.660,176.621L20.596,169.630L21.654,169.729L23.513,171.674L25.253,172.408L26.186,171.955L26.556,170.316L28.474,167.666L31.032,166.122L31.453,165.118L30.354,162.301L30.336,160.962L33.966,154.543L35.218,151.627L35.940,148.452L37.934,144.205L38.448,144.050L41.277,144.898L46.134,143.932L49.303,144.525L50.010,144.269L52.854,137.057L53.579,130.815L55.305,129.487L58.508,123.554L60.159,123