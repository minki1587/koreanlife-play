<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 용인시 2025 통계지역 경계 실루엣"><title>경기도 용인시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M116.762,127.316L115.094,127.047L112.593,127.362L110.025,128.205L107.715,129.593L96.463,126.308L95.137,126.916L88.827,126.358L83.389,127.506L79.415,128.939L75.204,126.075L71.427,121.752L70.821,120.075L69.651,119.299L68.516,119.481L67.355,118.577L66.909,115.149L67.215,113.176L66.956,112.095L66.139,111.048L66.264,110.244L65.722,110.368L65.871,108.248L67.920,106.526L71.441,105.618L74.167,105.543L74.910,104.830L75.644,103.638L75.313,103.061L75.708,102.501L75.250,101.695L75.630,100.370L76.184,100.153L76.991,98.758L76.446,97.359L74.810,97.334L74.923,95.763L75.897,94.601L76.682,94.377L77.920,92.643L77.534,88.342L72.718,90.963L72.773,91.928L71.805,91.901L72.808,94.046L72.335,95.152L71.736,95.062L71.156,93.878L71.139,92.813L70.373,91.604L68.187,91.134L67.313,89.668L65.260,88.482L65.034,87.838L67.008,85.327L67.983,82.127L71.513,79.523L75.277,77.745L76.751,76.488L78.178,76.672L79.568,76.014L79.015,73.530L79.275,71.360L80.646,68.391L80.233,67.437L79.866,68.019L77.664,67.637L74.184,69.704L73.905,71.261L62.685,68.730L62.396,66.576L62.930,63.361L62.688,62.951L61.271,62.490L62.752,57.967L61.261,56.143L61.021,54.504L58.776,54.088L56.085,54.293L50.779,51.024L48.823,46.340L48.782,45.653L49.434,44.742L48.594,44.036L47.417,40.392L45.437,38.349L45.776,34.317L46.606,32.581L43.827,30.416L42.354,29.630L41.620,29.681L37.876,27.398L36.725,25.756L36.294,23.582L37.538,20.848L40.850,18.295L41.996,15.317L42.996,14.251L43.419,12.000L45.010,12.136L54.260,14.850L54.883,16.163L58.307,18.473L58.338,20.330L59.048,21.062L63.253,20.656