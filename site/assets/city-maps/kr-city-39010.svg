<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="제주특별자치도 제주시 2025 통계지역과 주변 경계"><title>제주특별자치도 제주시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-36020" d="M319.972,22.980L319.204,19.938L318.562,19.567L318.131,20.015L317.759,19.651L317.420,17.634L317.979,15.550L317.545,15.109L316.325,15.305L317.216,14.612L317.175,13.734L317.640,13.168L318.025,13.345L318.255,14.657L318.921,14.374L318.622,13.923L318.936,13.573L319.996,14.383Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-36660" d="M169.450,2.204L168.307,1.929L167.778,1.964L167.616,2.134L167.411,2.296L167.193,2.162L167.178,1.950L167.186,1.881L167.200,1.852L167.404,1.534L167.679,1.322L168.328,1.083L168.512,0.892L168.660,0.688L168.773,0.000L169.658,0.000L169.664,0.010L170.180,0.478L170.282,0.569L170.481,0.728L171.159,0.898L171.601,1.464L171.820,1.844L171.933,2.155L171.898,2.444L171.673,2.745L171.108,2.910L170.698,2.564L170.085,2.359ZM242.952,36.580L242.580,36.651L242.024,36.308L241.224,36.180L240.639,36.608L239.068,36.680L238.640,36.323L238.326,35.737L238.340,35.338L238.240,34.824L237.798,34.324L237.484,33.824L237.441,33.139L237.712,32.682L238.454,31.840L239.197,31.455L239.468,31.426L239.711,31.554L239.868,31.783L239.925,31.954L240.125,31.983L240.310,31.697L240.510,31.426L240.967,31.426L242.024,31.897L242.566,32.711L242.909,33.353L243.351,33.924L243.023,34.610L243.023,35.338L243.208,35.937Z" fill="#e5e7e2" fill-rule="evenodd" stroke=