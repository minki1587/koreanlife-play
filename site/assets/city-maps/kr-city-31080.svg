<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 동두천시 2025 통계지역과 주변 경계"><title>경기도 동두천시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31200" d="M0.000,11.947L4.276,6.985L8.979,0.000L59.651,0.000L65.400,2.919L71.358,4.965L74.171,4.533L75.503,4.820L77.568,6.453L79.724,14.954L79.320,15.999L78.283,16.765L74.152,18.653L72.452,31.976L71.480,33.094L68.980,35.555L66.364,36.474L64.143,36.481L59.307,35.357L54.975,35.768L53.770,36.481L47.298,46.325L45.156,51.318L43.877,57.106L42.016,58.655L35.392,62.585L32.078,66.531L29.905,75.147L29.904,79.042L28.353,81.929L26.327,84.318L24.765,85.495L20.977,85.473L16.666,89.697L14.071,90.195L13.582,91.302L13.110,99.778L14.266,107.201L11.751,109.021L10.226,111.859L9.848,113.421L10.405,115.586L7.899,119.908L4.357,116.560L3.304,116.441L0.000,118.509ZM1.219,132.010L0.000,135.628L0.000,130.169Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31260" d="M1.219,132.010L0.000,130.169L0.000,118.509L3.304,116.441L4.357,116.560L7.899,119.908L10.405,115.586L9.848,113.421L10.226,111.859L11.751,109.021L14.266,107.201L13.110,99.778L13.582,91.302L14.071,90.195L16.666,89.697L20.977,85.473L24.765,85.495L27.228,88.211L34.294,92.772L39.851,90.536L44.779,94.687L47.985,92.657L49.372,94.143L49.496,97.501L57.514,99.792L57.624,95.790L59.501,95.817L59.624,99.892L61.221,99.561L70.086,106.058L70.612,107.806L69.214,112.536L71.674,118.613L73.634,119.499L74.008,120.923L73.842,122.8