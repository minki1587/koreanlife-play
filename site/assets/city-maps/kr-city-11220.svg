<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 서초구 2025 통계지역과 주변 경계"><title>서울특별시 서초구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11030" d="M61.093,63.443L48.456,57.206L35.150,47.629L23.386,42.908L23.629,25.574L22.089,22.090L16.014,11.965L16.663,9.676L18.168,8.405L18.700,8.123L20.884,8.367L26.294,7.096L28.645,5.192L28.933,4.102L33.045,0.000L115.521,0.000L116.115,1.229L119.292,2.400L121.390,1.767L124.318,2.581L133.752,9.962L113.649,30.273L108.132,38.634L101.869,43.084L86.730,52.548L79.035,64.901L70.469,65.124Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11040" d="M133.752,9.962L124.318,2.581L121.390,1.767L119.292,2.400L116.115,1.229L115.521,0.000L198.694,0.000L188.721,21.899L177.161,15.154L173.485,12.329L163.684,8.603L134.744,9.169Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11050" d="M202.119,28.742L188.721,21.899L198.694,0.000L267.405,0.000L260.768,11.434L254.160,24.417L252.860,25.177L243.795,26.636L240.990,28.143L231.476,31.169L221.116,32.761L213.821,32.462Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11140" d="M33.045,0.000L28.933,4.102L28