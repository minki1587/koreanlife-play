<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 부안군 2025 통계지역 경계 실루엣"><title>전북특별자치도 부안군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M70.541,170.582L71.596,170.850L71.462,172.513L68.473,172.966L69.323,170.765L69.812,170.553L70.200,171.373ZM91.031,166.961L90.738,165.437L91.616,164.631L91.708,166.639L91.388,167.136ZM94.900,149.893L98.307,154.870L97.105,157.080L93.951,159.854L93.890,161.475L93.093,162.489L92.380,162.715L91.582,162.226L87.538,164.013L87.515,165.153L83.934,168.938L83.803,169.625L82.007,170.796L78.401,171.556L76.892,173.622L76.885,174.023L78.518,175.226L78.770,175.872L78.001,175.981L75.700,174.188L74.560,172.293L73.508,168.286L72.544,167.456L71.982,167.695L71.508,167.327L71.301,166.238L71.629,165.567L73.617,164.783L77.847,165.525L80.222,164.923L80.277,163.538L79.691,163.098L79.035,163.439L75.917,163.466L74.688,162.890L75.157,161.157L75.750,160.887L76.213,161.830L77.761,162.182L79.430,161.725L81.227,160.406L80.949,159.405L79.791,158.688L79.141,157.511L80.414,155.711L82.214,157.903L83.239,156.879L84.357,157.128L84.162,157.779L83.564,158.101L83.869,158.572L85.453,157.913L86.049,156.697L82.470,153.704L82.268,151.488L85.737,153.072L86.807,155.078L86.658,155.528L87.255,155.841L88.771,155.235L87.206,152.799L89.038,150.968L89.892,151.029L88.886,153.133L88.817,155.254L88.291,157.089L89.688,157.950L90.149,157.516L91.142,154.343L93.416,153.924L92.324,151.070L94.079,151.572L94.247,150.987L93.676,149.662L92.570,149.963L93.713,149.437ZM221.941,164.882L221.089,166.643L218.724,168.778L216.728,167.652L214.505,168.386L212.501,167.663L213.203,165.840L211.192,164.135L210.497,164.524L210.248,165.812L209.061,167.115L206.025,167.34