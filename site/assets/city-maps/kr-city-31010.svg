<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 수원시 2025 통계지역과 주변 경계"><title>경기도 수원시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31020" d="M309.257,28.333L311.245,31.190L315.705,35.449L315.938,38.718L315.698,41.534L315.295,42.255L306.772,45.629L298.125,46.521L295.008,50.426L290.616,51.927L288.911,50.596L287.731,49.079L286.204,48.495L285.423,48.456L282.486,50.026L280.862,47.950L274.867,44.003L273.352,41.964L272.826,38.266L271.513,37.211L267.879,37.379L266.501,37.022L261.068,31.105L255.921,28.534L254.884,27.335L254.532,25.342L253.725,24.530L251.688,23.686L250.385,23.665L249.042,24.304L246.141,26.815L243.214,28.087L240.333,24.522L238.273,18.536L234.735,14.755L231.042,12.877L223.493,10.438L219.667,10.326L216.637,11.518L215.035,11.255L213.605,9.782L213.458,8.439L213.891,7.261L213.544,6.046L206.970,1.664L206.043,0.000L320.000,0.000L320.000,12.625L317.749,11.985L311.076,14.196L308.375,25.157L309.718,26.164Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31040" d="M42.204,1.464L41.980,1.778L41.835,1.916L39.546,5.412L39.150,8.053L39.058,8.443L38.850,9.304L38.654,10.015L38.461,10.373L38.236,10.658L37.898,10.969L36.170,12.384L35.829,13.248L35.564,13.703L34.712,14.875L34.390,15.033L30.913,15.252L30.648,15.188L26.170,13.353L24.758,11.370L24.322,10.456L24.226,10.212L24.172,9.742L22.196,0.832L21.998,0.000L42.950,0.000ZM107.807,1.321L107.323,2.349L106.996,3.161L107.018,3.290L107.086,3.6