<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 금천구 2025 통계지역과 주변 경계"><title>서울특별시 금천구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11170" d="M142.389,0.000L149.555,19.637L152.537,22.805L157.875,26.701L164.554,29.132L165.897,29.219L154.909,46.013L153.384,51.056L144.426,52.808L141.373,52.583L127.851,49.607L123.768,47.794L120.978,45.313L114.433,36.677L105.231,28.670L100.585,25.228L93.191,24.000L88.077,26.464L83.443,27.246L84.655,23.247L85.093,15.809L77.845,14.778L70.007,3.411L68.883,1.225L68.846,0.000ZM60.663,0.000L45.554,9.551L35.503,23.582L34.130,25.036L30.665,25.785L21.123,37.643L19.152,39.313L17.196,40.426L13.547,40.529L11.756,40.295L6.639,38.609L6.727,37.716L1.541,40.050L0.188,47.340L0.000,50.760L0.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11190" d="M157.875,26.701L152.537,22.805L149.144,19.039L142.389,0.000L185.327,0.000L174.972,14.962L165.897,29.219L164.554,29.132Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11200" d="M194.932,21.339L179.050,27.710L173.820,29.260L165.897,29.219L174.972,14.962L185.327,0.000L232.323,0.000L227.018,11.512L211.347,12.879L202.870,15.732ZM320.000,6.237L313.133,8.122L311.443,7.768L305.074,3.092L299.834,0.000L320.000,0.000ZM282.317,4.152L280.703,3.579L277.279,3.50