<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 도봉구 2025 통계지역과 주변 경계"><title>서울특별시 도봉구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M1.179,222.729L7.301,221.754L22.421,218.068L24.510,216.328L27.989,212.434L35.161,214.945L38.224,218.526L37.925,220.770L38.612,221.946L41.974,223.088L44.849,220.999L46.092,220.813L46.997,221.417L46.966,222.540L45.142,224.373L44.089,233.717L47.692,238.735L48.182,240.000L0.000,240.000L0.000,224.365Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11080" d="M47.692,238.735L44.089,233.717L45.142,224.373L46.966,222.540L46.997,221.417L46.092,220.813L44.849,220.999L41.974,223.088L38.612,221.946L37.925,220.770L38.224,218.526L35.161,214.945L42.759,208.219L53.853,201.124L56.106,200.833L58.227,203.922L59.211,204.613L71.772,212.614L74.760,213.400L76.711,219.204L77.688,219.457L87.229,227.613L93.336,230.857L95.865,231.795L99.354,234.383L103.579,234.667L106.720,235.875L106.597,237.493L105.610,240.000L48.182,240.000ZM194.220,238.204L198.742,234.903L202.504,240.000L192.964,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11090" d="M105.604,239.902L106.597,237.493L106.720,235.875L103.579,234.667L99.354,234.383L95.865,231.795L93.336,230.857L87.229,227.613L77.688,219.457L76.711,219.204L7