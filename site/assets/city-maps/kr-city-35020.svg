<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 군산시 2025 통계지역 경계 실루엣"><title>전북특별자치도 군산시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M164.241,198.070L164.441,197.101L165.237,197.011L164.742,198.094ZM162.099,189.964L162.849,190.878L164.040,193.963L164.034,194.724L163.301,194.929L163.059,196.703L162.375,197.310L161.211,196.900L160.835,196.038L161.763,194.236L161.644,193.464L160.500,192.701L158.397,192.221L158.191,191.566L160.739,189.392ZM165.322,193.117L165.945,192.315L166.644,192.426L166.243,193.184ZM167.491,190.213L165.642,189.686L165.447,189.109L166.822,187.989L167.671,189.899ZM149.403,170.245L149.188,169.429L149.996,168.611L149.709,170.127ZM158.507,167.445L157.740,167.638L157.799,168.841L157.410,169.232L155.149,170.570L154.650,171.568L153.775,172.197L151.884,171.959L150.133,170.106L151.382,167.667L151.349,166.843L152.374,165.571L152.817,165.771L152.347,166.202L152.612,166.913L155.902,168.700L156.253,168.478L156.221,166.171L156.736,166.016L156.456,167.259L157.728,167.259L157.203,166.498L157.448,165.475L158.686,166.461ZM155.327,166.477L155.296,165.860L155.825,164.926L155.924,165.864ZM137.584,161.256L138.250,162.525L137.161,161.977L136.839,162.366L136.976,163.242L137.834,163.967L138.582,163.893L139.544,166.171L139.549,167.313L140.656,168.174L140.247,168.407L138.606,167.709L138.326,169.428L137.805,169.414L137.167,167.078L135.666,165.444L135.998,161.124ZM159.705,164.720L159.846,164.081L160.585,164.585L160.457,164.796ZM145.189,164.526L145.796,164.809L146.096,164.433L146.051,165.271L145.235,166.615L144.118,165.979L144.121,165.222L144.592,165.702L144.855,165.464L144.918,163.871L142.745,162.375L142.027,162.395L142.639,160.984L