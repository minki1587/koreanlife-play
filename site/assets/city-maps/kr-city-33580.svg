<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청북도 단양군 2025 통계지역 경계 실루엣"><title>충청북도 단양군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M165.031,153.703L164.855,155.409L165.971,156.810L165.735,159.228L163.599,166.607L161.571,169.425L159.072,172.071L158.283,172.452L157.199,174.106L157.751,176.192L157.543,178.201L157.328,179.091L156.313,180.171L156.039,181.866L158.052,182.729L159.960,182.499L163.011,183.748L165.069,186.708L167.544,188.930L168.005,189.648L167.453,190.832L167.193,194.970L168.123,198.890L167.114,201.577L164.510,205.213L161.108,207.408L160.675,211.303L159.906,213.346L157.009,216.575L156.784,218.857L154.594,221.151L153.268,220.956L150.919,221.351L147.180,220.918L144.660,220.448L141.667,218.872L137.361,219.707L136.781,219.478L135.737,219.782L134.534,221.506L131.749,223.674L130.845,225.425L128.590,228.000L127.498,227.467L126.503,227.995L123.450,225.855L122.610,223.001L121.369,221.986L117.583,220.810L112.864,218.251L107.416,219.169L104.055,218.457L103.580,216.571L103.969,215.768L103.785,214.817L102.307,213.567L101.211,211.315L100.377,211.072L98.596,211.342L97.733,209.540L94.239,207.761L90.909,202.462L89.458,201.602L88.337,196.587L87.086,194.461L84.385,194.108L80.640,192.330L80.282,191.582L78.336,189.945L72.452,188.155L71.140,187.248L70.187,187.206L67.563,184.857L67.807,181.429L70.439,178.603L72.172,177.656L70.512,175.679L69.357,175.575L68.408,173.829L68.442,171.516L69.474,165.344L67.400,161.232L64.982,159.779L64.521,149.191L67.081,146.066L68.487,146.326L69.643,145.719L68.622,143.052L69.025,141.830L70.148,141.707L71.670,142.800L72.653,142.572L74.961,140.952L76.008,139.027L77.854,138.364L78.026,136.396L76.535,134.253L78.933