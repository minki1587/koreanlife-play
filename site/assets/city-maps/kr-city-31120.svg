<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 구리시 2025 통계지역과 주변 경계"><title>경기도 구리시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11040" d="M9.065,190.560L24.875,205.618L27.095,207.176L38.320,209.777L38.394,209.343L47.378,211.052L52.576,213.579L40.679,240.000L0.000,240.000L0.000,184.952Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11050" d="M40.679,240.000L52.576,213.579L49.801,212.240L59.786,190.330L61.195,186.437L74.403,188.772L77.877,188.792L78.281,190.419L79.483,190.194L81.070,191.254L83.108,191.570L85.100,190.897L85.661,189.719L86.847,189.938L89.043,189.312L100.144,182.890L101.366,185.086L103.871,185.594L105.429,186.918L105.799,188.402L104.308,191.464L100.310,210.571L100.395,212.511L114.005,213.006L115.842,216.000L118.359,215.069L122.373,215.093L122.593,215.721L122.533,227.250L119.981,235.605L119.273,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11060" d="M0.000,184.952L0.000,131.547L0.401,131.348L7.585,132.736L8.487,129.965L12.207,122.216L13.493,121.207L14.048,121.085L15.254,124.753L29.231,120.121L30.513,116.911L33.248,113.178L37.848,111.901L40.064,112.029L44.406,109.750L44.176,104.385L45.511,104.372L49.599,109.904L51.301,119.472L50.842,122.383L50.000,124.102L46.221,129.721L45.838,135.991L49.250