<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상북도 안동시 2025 통계지역 경계 실루엣"><title>경상북도 안동시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M158.520,154.695L158.617,156.170L156.946,163.761L157.619,165.299L157.782,166.369L157.492,166.662L156.729,166.997L155.434,166.687L152.204,168.188L150.700,168.017L149.881,167.244L148.920,168.499L148.336,170.461L147.508,171.217L146.868,171.272L145.257,170.317L143.498,170.788L140.831,173.123L140.445,174.161L138.954,173.925L136.469,175.130L133.596,175.885L132.564,175.739L131.869,176.621L132.041,178.064L130.319,178.616L127.580,178.476L126.467,178.836L125.514,179.964L125.571,180.637L124.693,182.614L122.639,182.778L121.455,181.620L120.929,177.520L121.430,176.218L120.770,175.116L120.675,172.016L117.922,170.120L116.854,170.003L115.504,170.492L114.923,170.233L112.543,165.691L111.359,165.283L111.124,162.442L109.100,160.089L108.546,158.077L108.817,156.992L106.570,155.622L106.633,152.527L105.994,150.052L104.551,149.522L103.681,149.687L102.056,147.635L100.636,147.743L99.563,146.522L93.764,146.784L91.322,146.215L90.113,145.280L88.268,139.829L87.575,139.039L86.001,138.547L83.345,140.252L82.899,139.944L81.087,140.201L80.727,140.906L81.233,141.855L80.639,146.532L78.421,146.389L76.768,146.803L76.282,147.726L77.295,149.260L77.183,149.782L76.618,150.482L75.427,150.716L71.031,148.056L70.248,146.924L66.976,144.913L66.578,141.552L68.042,139.318L67.144,138.154L65.460,137.061L66.730,136.570L69.010,134.524L70.951,133.716L73.692,130.277L77.091,129.578L77.131,129.041L75.706,126.903L74.248,125.792L74.614,124.148L73.972,123.627L75.932,122.666L76.607,121.212L78.530,120.524L82.584,118.010L84.918,117.838L86.234,117.221L87.077,112