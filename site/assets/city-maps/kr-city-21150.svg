<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 사상구 2025 통계지역과 주변 경계"><title>부산광역시 사상구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M223.723,240.000L225.479,233.269L232.270,228.109L233.479,229.516L234.916,228.001L236.185,223.897L235.504,217.145L233.052,216.533L231.459,214.575L234.737,213.173L235.531,213.184L244.245,216.263L255.263,225.584L264.173,228.502L260.648,234.779L267.707,240.000L263.256,240.000L259.682,237.369L258.731,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21020" d="M200.098,240.000L192.599,232.398L187.785,229.795L186.888,227.094L187.922,223.853L186.605,221.813L184.831,221.286L182.669,221.397L180.527,211.520L181.177,207.181L176.116,201.664L176.956,196.584L179.209,193.748L183.084,192.141L184.316,189.910L185.424,172.018L188.325,161.051L192.356,161.273L201.690,164.004L204.608,165.844L213.054,168.998L215.560,168.895L220.313,166.913L226.890,173.549L230.024,181.253L230.802,185.165L229.789,202.249L228.373,210.025L229.857,212.630L233.052,216.533L235.504,217.145L236.198,223.537L234.916,228.001L233.479,229.516L232.270,228.109L225.479,233.269L223.723,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21030" d="M255.263,225.584L244.245,216.263L235.531,213.184L234.737,213.173L231.459,21