<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 연제구 2025 통계지역과 주변 경계"><title>부산광역시 연제구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21050" d="M3.862,28.123L11.321,29.769L20.093,32.944L20.977,34.977L28.475,43.745L34.680,51.790L33.706,53.472L32.440,57.682L32.000,61.048L32.178,62.532L37.043,72.820L47.548,89.929L51.632,94.522L58.889,96.469L68.885,95.674L82.734,97.258L86.001,98.015L87.960,114.581L89.358,115.513L92.082,121.610L92.652,126.390L93.057,127.103L96.208,128.116L109.479,129.529L111.137,131.033L120.510,134.224L126.630,124.540L126.378,117.013L140.132,127.202L149.327,135.736L164.442,152.172L164.727,154.445L162.718,163.535L160.563,170.489L157.523,173.631L154.964,175.475L153.385,179.764L152.371,194.903L161.424,207.099L165.740,208.089L169.190,213.690L166.739,217.109L158.567,236.218L158.142,239.137L156.232,240.000L0.000,240.000L0.000,29.424Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M80.537,64.308L65.052,59.663L54.939,61.166L34.680,51.790L28.475,43.745L20.977,34.977L19.036,30.332L18.770,28.847L18.403,19.936L18.747,15.752L24.463,16.529L38.316,0.000L271.029,0.000L272.354,3.951L281.460,13.384L286.259,13.301L291.246,16.293L289.407,19.391L287.029,26.304L284.734,36.704L283.737,47.902L283.683,52.925L288.026,68.469L289.004,76.814L288.000,98.022L284.226,94.173L277.477,84.137L276.499,80.113L270.155,68.848L262.107,65.471L251.803,64.154L239.570,63.227L228.450,59.937L211.