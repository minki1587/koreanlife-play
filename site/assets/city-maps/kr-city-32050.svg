<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 태백시 2025 통계지역과 주변 경계"><title>강원특별자치도 태백시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32070" d="M215.156,148.484L210.753,148.574L209.323,147.469L209.413,144.256L208.500,142.257L207.979,141.942L200.841,141.246L196.809,141.960L194.470,139.452L191.093,138.940L186.486,138.734L185.259,139.233L183.939,138.908L182.975,137.173L178.320,134.775L175.727,132.105L173.666,126.928L173.306,125.354L173.492,123.259L172.777,122.179L170.310,120.980L168.759,121.328L166.641,116.797L166.747,115.210L167.681,113.266L167.866,110.601L171.294,108.968L174.499,108.104L174.562,107.670L172.075,104.874L172.246,103.610L173.117,102.456L172.797,101.764L169.474,100.992L168.316,101.199L166.179,100.036L163.925,96.753L162.886,93.910L163.902,92.554L165.142,92.006L165.897,92.113L166.872,93.099L168.613,93.210L169.649,92.011L169.038,91.314L169.173,87.229L169.931,87.653L171.379,87.603L172.380,85.649L173.783,85.979L173.254,84.244L170.935,81.154L170.731,79.860L172.376,74.815L174.303,73.934L175.683,72.604L175.697,71.562L174.829,68.683L172.630,66.424L171.635,66.189L170.057,62.742L170.914,60.081L173.845,57.284L174.678,55.723L177.797,52.577L177.518,51.422L176.247,50.856L173.353,47.048L172.143,46.709L170.219,45.079L169.053,42.917L167.799,42.096L166.505,41.822L166.731,37.603L168.181,36.498L171.888,32.089L173.645,31.591L175.311,29.162L175.126,28.742L172.936,27.933L172.647,26.840L173.094,25.988L172.676,25.062L171.365,24.045L169.478,24.628L167.568,27.755L163.121,25.932L160.240,26.669L157.883,28.148L154.572,31.123L151.862,34.326L150.5