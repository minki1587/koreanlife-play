<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 태백시 2025 통계지역 경계 실루엣"><title>강원특별자치도 태백시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M229.457,197.090L226.926,199.232L224.171,199.686L221.214,202.145L218.249,202.917L215.697,204.588L214.233,206.447L213.957,207.390L214.566,209.684L212.238,212.355L211.472,214.034L212.724,215.781L212.760,217.214L211.233,221.202L209.181,223.883L208.221,224.491L206.542,224.539L206.344,223.176L206.735,222.475L204.813,220.909L203.660,221.022L203.052,221.864L202.221,221.839L196.440,219.126L195.030,217.588L192.426,216.431L185.442,215.486L184.750,216.115L183.533,216.254L180.362,214.099L179.620,214.854L177.181,214.888L176.660,214.475L168.614,212.668L167.291,210.162L161.475,210.288L160.293,211.408L157.630,212.248L155.394,211.955L153.019,212.222L151.225,213.722L151.000,214.344L147.135,215.821L144.499,214.471L143.349,213.234L143.001,212.362L143.111,210.300L141.712,208.981L140.281,205.682L137.729,202.657L137.221,202.521L135.004,202.624L132.771,204.125L130.119,204.903L127.851,205.260L125.353,204.824L123.726,205.561L122.613,207.062L120.784,211.024L121.288,214.374L121.006,215.294L118.296,219.790L116.942,220.949L116.856,224.344L110.604,223.606L108.060,226.509L105.859,227.651L104.109,228.000L102.500,225.904L102.593,224.765L100.225,223.139L96.297,219.416L95.716,217.465L95.755,215.288L99.459,213.776L101.683,210.976L101.994,207.174L103.959,205.195L103.710,203.542L102.305,201.060L102.769,197.991L102.461,197.279L101.777,196.968L97.195,195.717L96.491,194.145L95.033,192.922L91.350,193.831L90.673,193.420L90.543,192.772L92.245,189.040L93.046,188.700L94.887,188.760L96.099,187.962L97.809,185.963L101.834,182.880L103.499,