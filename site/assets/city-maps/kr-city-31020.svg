<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 성남시 2025 통계지역과 주변 경계"><title>경기도 성남시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11200" d="M21.057,1.450L20.401,8.922L20.383,9.711L20.067,15.436L19.827,20.100L19.944,21.171L17.419,20.810L15.131,20.853L14.746,20.861L12.832,21.212L12.604,21.254L12.484,21.278L10.986,21.606L10.175,21.783L9.815,21.863L9.377,21.990L8.894,22.131L8.274,22.312L7.780,22.456L7.461,20.748L7.006,20.733L6.819,20.728L5.963,20.700L5.330,19.814L4.906,19.146L3.833,18.070L2.834,17.193L2.218,16.727L1.272,15.838L0.000,14.133L0.000,0.000L21.098,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11210" d="M1.272,15.838L4.906,19.146L5.963,20.700L7.461,20.748L7.780,22.456L14.746,20.861L19.944,21.171L20.080,23.435L21.544,27.690L22.930,30.177L25.443,32.764L26.834,35.929L26.898,38.172L26.042,42.871L26.221,44.240L27.274,45.966L20.470,49.971L11.350,60.185L7.916,60.353L1.135,62.720L0.328,64.711L0.623,67.087L0.000,69.597L0.000,14.133Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11220" d="M36.192,40.515L27.274,45.966L26.221,44.240L26.042,42.871L26.898,38.172L26.834,35.929L25.443,32.764L22.930,30.177L21.544,27.690L20.080,23.435L19.827,20.100L21.098,0.000L72.712,0.000L76.541,10.016L84.529,9.005L88.461,20.273L94