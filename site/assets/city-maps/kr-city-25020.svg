<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대전광역시 중구 2025 통계지역과 주변 경계"><title>대전광역시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-25010" d="M186.676,66.614L177.148,51.222L171.302,45.286L168.484,41.212L162.779,38.170L160.456,35.567L159.241,32.596L164.507,31.282L167.861,31.580L165.280,29.215L166.651,26.414L169.054,26.061L171.330,26.251L172.481,25.669L174.989,20.748L175.716,20.663L175.334,17.384L178.724,11.983L180.749,11.974L183.893,9.709L187.093,10.762L188.053,12.624L188.478,17.347L190.448,19.365L190.361,20.964L194.447,23.091L195.427,20.970L194.825,21.171L195.248,19.293L196.439,18.777L204.602,18.140L203.852,19.727L206.286,20.213L208.989,20.138L214.815,23.138L216.143,22.081L215.680,20.001L215.760,17.252L217.169,13.349L217.259,11.632L216.989,10.076L214.626,8.968L210.842,0.000L282.729,0.000L277.197,19.862L274.108,19.462L271.286,20.132L269.462,22.119L264.654,23.569L263.345,26.695L262.644,29.897L262.906,32.310L264.158,33.440L261.460,36.742L256.365,37.921L255.400,39.341L255.362,46.602L256.264,52.141L257.861,55.465L257.937,56.726L254.234,63.749L252.171,65.876L253.271,70.128L253.238,71.279L250.156,74.688L248.345,75.638L253.445,84.241L252.615,85.908L246.760,91.303L245.363,91.542L242.079,90.212L243.322,91.037L244.586,93.433L244.260,95.448L250.457,108.684L251.099,109.231L252.148,114.344L251.936,116.517L250.404,118.913L241.616,127.279L242.468,131.604L239.083,143.132L239.010,146.093L240.466,147.316L241.915,147.252L242.958,147.901L243.328,153.954L243.081,154.554L241.718,154.833L240.505,156.486L240.642,157.675L241.552,162.057L242.657,164.523L24