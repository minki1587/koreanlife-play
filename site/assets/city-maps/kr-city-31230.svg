<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 김포시 2025 통계지역과 주변 경계"><title>경기도 김포시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11120" d="M318.089,207.302L317.373,206.517L318.188,205.826L318.583,205.410L318.718,205.206L318.862,204.980L319.224,204.335L320.000,204.094L320.000,205.704L319.651,206.396L319.906,207.301L320.000,207.454L320.000,209.393Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11140" d="M320.000,240.000L309.926,234.085L303.578,229.603L297.995,225.122L296.856,223.479L297.267,221.649L300.833,220.771L302.690,219.898L304.988,219.931L307.157,218.554L310.975,217.281L313.629,217.248L314.029,216.495L313.330,214.872L313.372,212.582L314.067,210.726L315.976,207.666L317.373,206.517L320.000,209.393Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11160" d="M235.696,239.613L234.589,238.823L234.694,238.106L233.522,237.703L234.887,236.548L237.536,236.105L238.789,236.286L239.524,235.848L238.754,234.676L241.352,232.014L242.971,233.538L242.341,230.074L240.941,228.254L240.801,226.889L241.396,226.329L242.325,227.965L244.879,226.209L246.297,224.520L245.883,223.073L246.462,221.544L247.806,220.561L249.936,219.749L251.720,218.000L252.070,215.550L252.945,214.815L253.820,216.075L255.145,212.893L255.920,213.037L256.722,212.12