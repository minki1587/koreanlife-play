<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="광주광역시 북구 2025 통계지역과 주변 경계"><title>광주광역시 북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-24010" d="M155.647,191.344L152.545,187.811L146.974,179.164L143.546,175.593L139.464,169.860L136.542,166.505L142.242,160.903L146.496,147.931L159.362,152.026L160.929,153.072L162.142,155.082L166.934,153.095L171.353,153.121L171.723,156.712L176.049,156.881L177.304,160.854L180.424,162.731L184.668,163.369L188.923,166.173L189.210,167.548L188.350,170.220L189.146,173.731L190.517,176.687L187.779,179.101L188.967,181.248L191.527,181.773L192.720,181.333L195.663,181.323L198.755,183.090L203.036,186.765L205.234,186.941L208.794,185.043L213.677,184.190L218.215,186.549L220.979,189.187L224.173,197.191L230.305,205.909L230.507,208.704L234.641,216.000L234.950,219.380L226.826,220.649L225.657,221.036L224.984,222.086L222.361,227.376L223.583,231.074L224.947,233.576L224.608,240.000L150.957,240.000L151.212,238.750L147.341,231.785L144.414,228.484L143.571,226.443L143.722,223.235L141.880,220.936L141.686,217.971L142.647,215.245L141.524,213.989L148.907,211.410L150.256,209.192L152.166,208.569L153.309,207.088L153.153,205.009L155.154,203.399L154.894,202.177L160.966,200.168L158.271,197.865L158.489,196.004L156.999,195.029Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-24020" d="M90.645,222.033L85.321,222.193L84.188,223.351L86.046,224.832L85.358,226.027L81.733,226.651L80.252,225.222