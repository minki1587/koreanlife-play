<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="광주광역시 동구 2025 통계지역과 주변 경계"><title>광주광역시 동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-24020" d="M12.124,139.224L3.846,139.473L2.086,141.274L4.974,143.576L3.904,145.435L0.000,146.106L0.000,8.522L4.393,9.638L30.354,11.564L30.132,13.279L34.192,12.350L39.504,13.057L44.877,15.118L44.695,17.622L45.846,18.471L50.775,31.236L51.563,32.044L53.638,33.221L59.066,33.650L64.035,36.700L68.338,38.538L70.469,40.265L74.973,45.466L83.491,52.881L88.035,58.099L80.468,59.498L78.600,58.579L76.339,56.721L72.719,50.895L69.019,51.208L66.575,50.804L61.596,53.061L62.007,53.978L59.955,54.758L59.834,55.656L57.935,57.040L54.538,57.755L46.447,62.817L51.269,70.612L50.558,72.270L47.404,73.698L46.745,73.446L45.917,75.224L45.998,76.719L44.523,77.850L42.705,78.597L42.463,79.486L43.204,81.327L44.518,81.676L46.846,83.997L48.840,88.199L49.877,92.662L48.563,94.332L48.502,96.210L48.523,99.806L51.191,114.193L49.971,123.837L48.009,123.789L44.806,124.751L43.311,126.690L41.493,126.731L31.919,122.570L28.566,120.348L27.597,117.641L26.344,117.480L25.334,121.035L19.234,126.125L21.295,130.043L16.865,131.881L20.774,136.612L18.200,137.281L16.227,136.696L13.033,136.860Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-24030" d="M56.812,203.922L44.978,196.894L38.183,202.588L22.339,211.620L11.558,209.659L6.516,206.417L5.661,204.250L3.546,202.414L0.000,202.629L0.000,146.106L3.904,145.