<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 강동구 2025 통계지역과 주변 경계"><title>서울특별시 강동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11050" d="M0.000,50.404L15.652,53.275L20.431,53.302L20.985,55.539L22.639,55.229L24.821,56.688L28.314,57.048L30.363,56.197L31.135,54.577L32.766,54.878L35.785,54.017L51.051,45.186L52.731,48.206L56.175,48.905L58.318,50.725L58.826,52.766L56.777,56.977L51.278,83.251L51.395,85.920L70.111,86.599L72.637,90.717L76.099,89.437L81.618,89.470L81.921,90.334L81.838,106.186L78.329,117.676L77.412,123.575L76.193,126.687L71.353,135.814L55.997,162.244L45.740,182.396L43.723,183.576L29.653,185.840L25.298,188.180L10.532,192.875L0.000,194.494Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11070" d="M51.051,45.186L34.864,54.427L32.766,54.878L31.135,54.577L30.579,55.943L29.794,56.529L28.314,57.048L26.548,57.062L24.821,56.688L22.639,55.229L20.985,55.539L20.431,53.302L15.652,53.275L0.000,50.404L0.000,0.000L74.753,0.000L73.289,3.584L72.543,7.945L71.303,11.856L63.408,12.124L55.341,13.473L48.347,16.613L50.069,18.057L55.558,20.522L55.282,30.929L51.848,40.914Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11240" d="M0.000,194.494L10.532,192.875L18.474,190.427L25.298,188.180L29.653,185.840L43.723,183.576L45.740,18