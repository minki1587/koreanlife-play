<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 동구 2025 통계지역과 주변 경계"><title>부산광역시 동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M61.068,234.733L63.564,226.832L78.997,215.107L81.745,218.303L85.011,214.860L87.894,205.533L86.347,190.187L80.774,188.798L77.154,184.348L84.604,181.161L86.408,181.187L106.214,188.183L108.639,190.789L131.255,209.368L139.370,212.383L151.504,216.000L149.833,218.077L143.492,230.265L156.654,240.000L146.524,240.000L141.296,236.152L139.906,240.000L60.003,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21020" d="M0.000,236.085L0.000,66.634L9.498,69.414L16.129,73.594L35.324,80.762L41.021,80.529L44.565,79.451L51.823,76.024L66.769,91.106L71.348,101.127L73.893,108.615L75.662,117.507L73.357,156.334L70.141,174.006L73.512,179.928L80.774,188.798L86.347,190.187L87.924,204.715L87.749,206.385L85.011,214.860L81.745,218.303L78.997,215.107L63.564,226.832L61.068,234.733L60.003,240.000L3.806,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21050" d="M16.129,73.594L9.498,69.414L13.802,68.730L15.983,67.789L17.351,66.441L22.365,60.102L30.633,47.151L30.894,41.030L28.862,38.597L28.151,21.808L30.338,14.608L31.376,0.000L287.552,0.000L277.145,6.395L275.570,7.943L255.314,13.639L239.955,8.960L2