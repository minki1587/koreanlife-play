<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 양구군 2025 통계지역과 주변 경계"><title>강원특별자치도 양구군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32010" d="M0.000,186.590L1.291,185.245L3.524,185.883L4.543,187.082L4.806,188.502L3.482,195.834L4.464,203.514L10.122,200.052L11.481,198.368L12.828,197.565L15.874,196.724L17.017,197.415L19.995,197.910L21.365,196.951L22.763,197.196L25.720,195.660L27.951,196.491L29.548,198.282L31.603,203.480L36.265,203.294L38.333,200.867L38.658,199.559L40.018,198.360L40.983,196.469L42.737,195.361L46.345,195.712L48.369,197.493L51.462,197.996L51.803,199.354L52.773,200.358L54.681,201.250L56.212,201.181L56.853,201.764L58.045,204.329L58.827,205.163L59.308,207.006L59.241,208.779L60.086,209.425L61.071,209.284L61.743,211.455L63.101,212.993L65.012,216.701L65.347,220.118L66.618,220.384L67.578,221.426L69.595,218.610L71.698,217.420L72.456,216.482L74.267,216.986L76.186,215.042L79.496,214.787L81.702,216.525L82.501,216.642L84.227,214.484L84.190,213.131L86.236,211.144L87.049,209.777L89.575,208.683L91.313,209.179L92.602,207.562L96.276,206.496L94.745,203.227L94.582,201.851L94.918,201.213L92.796,198.739L92.296,196.615L93.977,188.060L94.848,187.574L96.270,188.506L100.051,188.589L106.148,190.318L107.737,189.857L109.541,188.646L111.538,188.223L116.572,188.173L117.054,189.242L116.482,191.494L116.486,194.165L116.029,195.353L116.218,197.122L116.862,198.136L116.923,200.085L117.924,201.913L118.480,202.548L122.637,204.591L128.564,206.445L131.258,208.751L132.847,208.525L134.695,207.182L135.677,205.816L136.371,204.214L135.744,199.898L136.370,19