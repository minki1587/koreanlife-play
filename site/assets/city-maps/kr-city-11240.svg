<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 송파구 2025 통계지역과 주변 경계"><title>서울특별시 송파구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11040" d="M74.983,0.000L48.132,58.776L33.510,50.244L28.860,46.672L16.462,41.959L0.000,42.233L0.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11050" d="M65.080,67.432L48.132,58.776L74.983,0.000L160.276,0.000L157.464,9.219L156.717,14.026L155.724,16.562L139.265,45.539L130.906,61.962L129.262,62.923L117.796,64.769L114.247,66.675L102.214,70.502L89.109,72.516L79.881,72.137Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11220" d="M0.000,158.344L3.460,167.204L17.887,165.379L24.987,185.727L36.699,199.995L33.801,202.443L34.753,203.399L43.446,207.297L46.727,207.659L57.298,206.302L58.384,204.620L59.141,196.787L72.270,194.289L73.285,192.109L78.943,192.079L81.384,196.851L85.363,194.571L87.758,191.604L91.832,192.063L93.989,191.935L95.305,191.245L97.584,190.858L100.876,190.593L103.395,191.026L102.059,196.909L103.427,200.127L105.394,203.075L110.359,208.712L119.302,217.768L122.532,219.594L124.434,222.443L125.052,225.062L124.166,225.966L121.720,231.547L122.681,232.732L121.023,237.081L119.350,240.000L7.900,240.000L6.779,234.047L5.465,233.862L5.004,233.249L2.120,225.369L4.705,218.583L1.607,2