<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 관악구 2025 통계지역과 주변 경계"><title>서울특별시 관악구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11170" d="M29.848,0.000L30.261,14.596L34.967,33.047L40.088,46.911L43.111,50.266L47.867,53.737L53.817,55.902L55.014,55.980L45.225,70.941L43.866,75.434L35.886,76.994L33.166,76.794L21.119,74.143L17.482,72.528L14.997,70.317L9.166,62.623L0.000,54.773L0.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11180" d="M82.752,201.627L77.623,206.287L74.992,209.656L72.460,216.549L69.162,221.114L66.806,222.095L64.311,222.374L57.176,220.826L50.649,213.300L44.136,207.520L42.856,205.372L42.453,203.735L43.429,202.799L43.505,198.137L42.001,188.985L41.281,186.429L35.880,182.534L33.272,174.172L32.639,166.326L30.733,160.517L26.990,162.825L19.243,161.377L18.886,160.072L12.982,150.912L10.955,148.870L8.185,136.348L11.816,133.411L14.257,132.931L16.913,133.905L17.705,133.183L18.047,131.651L16.946,128.599L0.000,103.332L0.000,54.773L9.166,62.623L14.997,70.317L17.482,72.528L20.597,74.005L33.166,76.794L35.886,76.994L43.866,75.434L45.225,70.941L48.313,74.256L71.687,69.151L69.333,74.012L69.325,75.882L71.016,78.037L74.015,78.384L76.526,78.190L77.315,82.274L76.519,86.756L74.664,92.244L71.939,94.038L67.661,96.065L68.701,97.827L72.482,107.595L76.282,115.534L78.287,117.543L78.375,118.622L81.753,119.921L79.882,122.761L79.432,124.140L82.646,143.196L84.399,144.583L93.617,14