<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 중랑구 2025 통계지역과 주변 경계"><title>서울특별시 중랑구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11040" d="M4.956,202.351L24.221,214.269L51.239,240.000L0.000,240.000L0.000,202.443Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11050" d="M99.222,240.000L111.102,213.876L113.515,207.208L120.692,208.179L136.139,211.207L142.091,211.241L142.782,214.028L144.842,213.642L147.560,215.458L151.051,216.000L152.941,215.675L154.462,214.847L155.424,212.829L157.456,213.204L161.216,212.132L180.233,201.131L182.325,204.893L186.312,205.632L188.870,207.634L189.396,208.234L189.909,210.394L187.496,215.305L182.304,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11060" d="M4.956,202.351L0.000,202.443L0.000,120.643L1.117,116.949L9.379,112.844L21.685,115.222L23.231,110.475L29.603,97.202L31.805,95.473L32.756,95.264L34.821,101.547L50.429,96.750L58.763,93.612L60.959,88.114L65.645,81.720L73.523,79.533L77.319,79.752L82.862,77.202L84.757,75.849L84.363,66.659L86.650,66.635L93.652,76.112L95.401,84.199L96.568,92.502L95.781,97.488L94.338,100.433L87.866,110.057L87.210,120.796L93.054,146.818L109.651,173.001L112.829,188.753L113.732,204.315L113.515,207.208L111.102,213.876L99.222,240.000L51.239,240.000L24.221,2