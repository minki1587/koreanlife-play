<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 중구 2025 통계지역과 주변 경계"><title>인천광역시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23020" d="M274.232,105.642L269.397,102.307L265.266,97.262L262.584,94.612L259.536,92.852L258.140,92.809L256.494,93.326L253.673,90.375L255.347,88.509L249.597,90.450L248.182,86.521L253.253,84.181L261.317,81.512L262.173,82.598L261.788,83.438L265.865,86.381L262.255,80.812L265.932,80.541L272.869,78.290L282.833,84.952L290.912,91.038L296.759,96.562L296.336,97.494L287.183,91.590L284.084,90.169L282.431,92.531L282.322,94.354L283.513,95.760L281.060,99.713L282.096,100.974L281.912,103.690L280.210,104.673L276.438,104.206Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23040" d="M297.562,184.777L320.000,189.705L320.000,204.791L287.663,230.782L252.784,230.862L252.794,226.400L226.774,226.092L226.774,218.822L244.959,218.841L248.598,218.386L258.991,199.680L252.142,194.518L247.277,186.577L247.426,157.738L237.152,157.738L231.990,154.512L231.742,140.614L246.086,146.719L248.469,146.769L248.474,143.905L267.654,143.976L267.433,142.999L268.406,142.623L269.472,143.459L272.134,143.585L275.389,142.268L276.346,141.350L277.245,139.531L278.179,138.986L283.017,138.725L288.060,138.704L291.572,140.875L294.997,141.845L299.617,144.007L301.180,142.803L307.955,144.172L309.240,141.201L316.818,141.044L316.402,137.419L315.466,135.670L320.000,135.590L320.000,152.843L318.270,154.945L309