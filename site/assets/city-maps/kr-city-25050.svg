<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대전광역시 대덕구 2025 통계지역과 주변 경계"><title>대전광역시 대덕구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-25010" d="M142.152,240.000L139.445,235.839L133.218,229.517L130.217,225.176L124.140,221.937L121.666,219.164L120.371,216.000L125.981,214.601L129.554,214.917L126.804,212.398L128.264,209.415L130.824,209.039L133.248,209.241L134.474,208.621L137.145,203.379L137.919,203.289L137.513,199.797L141.124,194.044L143.281,194.035L146.629,191.622L150.400,193.081L151.552,197.507L151.513,199.758L153.611,201.907L153.519,203.610L157.870,205.876L158.915,203.616L158.273,203.830L158.724,201.830L159.993,201.280L168.688,200.602L167.889,202.292L170.481,202.810L173.360,202.731L179.565,205.925L180.980,204.800L180.487,202.584L180.572,199.657L182.072,195.499L181.881,192.013L179.364,190.833L174.653,179.795L166.662,167.049L165.011,162.779L167.122,158.965L169.543,151.624L168.074,149.682L168.378,141.388L169.620,136.707L172.050,131.213L176.378,128.865L178.672,125.984L182.549,123.442L189.911,112.954L195.685,103.609L199.745,95.648L199.600,93.556L200.305,91.835L202.885,87.561L205.473,88.358L208.871,88.684L218.699,108.363L224.310,123.745L226.111,125.375L231.857,128.053L232.963,131.021L238.151,110.344L239.488,103.597L241.650,104.350L243.883,106.609L247.924,102.865L249.267,102.288L254.639,106.022L255.271,107.806L260.659,108.593L262.351,108.280L267.318,105.825L270.378,105.783L272.644,107.195L271.223,111.332L271.634,116.500L272.958,119.601L281.571,127.905L283.651,131.359L285.138,136.941L286.092,138.405L287.573,139.405L286.572,141.326L284.028,