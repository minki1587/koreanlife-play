<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 남구 2025 통계지역과 주변 경계"><title>부산광역시 남구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M13.664,224.124L11.744,223.272L7.918,222.433L0.000,223.645L0.000,163.360L4.292,164.876L18.286,176.715L29.601,180.421L25.124,188.392L34.364,195.227L32.379,197.925L23.897,191.682L22.590,195.300L32.296,202.508L28.796,207.092L23.174,204.278L20.337,202.257L22.298,199.690L18.700,199.882L18.110,201.269L18.673,219.073L19.068,220.621L22.306,227.437L21.808,227.823L19.019,222.090L14.318,223.936L15.914,229.054L15.282,229.243Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21030" d="M18.286,176.715L4.292,164.876L0.000,163.360L0.000,100.142L1.440,99.811L4.495,101.091L8.377,100.377L16.556,92.477L18.446,89.808L19.398,86.816L19.753,84.142L18.954,81.007L19.746,78.399L23.380,73.551L25.188,73.132L34.145,73.577L36.869,74.725L48.246,81.375L50.499,84.506L52.494,85.139L58.270,85.565L64.266,85.131L68.423,86.688L82.232,86.770L86.448,100.066L84.820,122.352L83.248,124.459L83.860,129.503L62.348,157.925L54.047,151.580L53.500,149.869L60.158,142.985L60.237,135.768L58.269,134.308L53.703,134.796L47.083,141.380L43.672,150.639L54.360,159.176L54.399,164.365L41.967,155.096L39.230,162.405L49.690,170.065L47.150,173.321L37.248,166.111L35.258,165.322L29.601,180.421Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-lineca