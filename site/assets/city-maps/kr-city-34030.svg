<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 보령시 2025 통계지역 경계 실루엣"><title>충청남도 보령시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M50.068,188.333L49.518,189.341L47.771,189.189L47.393,187.489L45.805,185.929L48.560,186.205L48.087,187.032L48.316,187.571L49.041,188.530ZM41.780,181.150L41.593,182.741L40.814,183.165L39.337,179.846L38.103,178.636L37.420,177.057L37.721,176.433L38.500,176.054L39.463,176.709L39.135,177.572L40.287,178.829L40.145,180.506ZM64.361,176.188L60.539,177.178L59.433,175.990L58.226,175.946L57.562,178.197L54.915,178.129L54.229,177.152L56.387,175.367L57.105,175.330L58.113,171.981L59.250,172.576L60.125,174.411L60.991,174.308L61.779,173.715L62.541,171.484L63.142,170.947L64.012,171.309L64.056,173.399L64.902,175.442ZM15.286,172.503L14.528,173.853L13.713,173.696L12.000,172.468L12.114,171.702L12.857,170.897L13.468,171.809L14.186,170.962L15.075,168.639L15.443,169.031L16.356,169.072L16.362,169.922L15.097,171.993ZM50.087,172.334L46.576,171.447L46.795,170.155L49.247,171.019L49.250,170.475L48.320,169.446L48.622,169.268L50.196,170.882L49.624,171.367ZM137.682,164.395L138.131,164.690L137.913,165.174L136.302,165.203ZM127.847,157.763L128.149,153.841L129.371,152.811L131.527,152.000L131.697,152.884L129.933,156.770L129.952,158.183L129.210,158.864ZM105.379,150.706L105.784,150.879L106.472,151.529L105.721,151.662ZM104.433,148.636L105.202,149.560L105.074,149.941L103.981,149.366L103.990,148.611ZM126.598,147.276L125.423,144.480L126.851,145.104L127.635,144.895L128.148,142.807L127.129,141.571L128.157,140.435L130.198,139.955L129.739,140.563L130.247,141.086L130.091,142.367L128.786,145.447ZM127.305,138.697L128.185,139.588L127.499,139.786L126