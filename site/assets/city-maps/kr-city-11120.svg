<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 은평구 2025 통계지역과 주변 경계"><title>서울특별시 은평구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M236.950,234.648L232.561,240.000L208.516,209.731L212.020,209.532L212.562,208.762L212.670,205.459L214.908,203.493L218.182,203.431L221.669,205.352L216.585,198.339L214.760,194.600L216.714,186.793L216.002,177.800L213.849,172.045L213.808,170.857L215.379,164.551L214.637,163.904L213.936,163.909L213.530,164.376L209.772,164.139L208.701,162.818L207.318,159.825L207.447,154.522L208.187,153.791L208.778,150.890L208.542,148.337L203.715,141.463L203.046,142.482L202.344,138.245L203.561,135.334L204.138,132.104L203.193,123.364L203.104,118.187L204.841,107.928L205.738,104.374L206.583,103.233L208.444,102.447L215.036,102.024L220.218,94.831L225.383,94.008L238.138,90.898L242.836,86.146L248.885,88.264L251.469,91.285L251.217,93.178L251.797,94.170L254.632,95.133L257.058,93.371L258.106,93.214L258.870,93.723L258.844,94.671L257.305,96.217L256.417,104.100L259.456,108.333L260.372,110.698L261.659,114.902L261.127,116.330L262.947,122.393L263.749,123.265L267.607,125.080L270.095,127.090L270.765,129.717L270.527,136.616L269.251,138.083L268.531,144.574L271.850,158.314L269.316,160.932L266.604,162.403L262.575,162.497L260.438,163.053L260.413,167.638L261.216,170.706L265.359,175.970L269.414,178.484L273.615,179.440L274.930,180.163L274.297,181.291L291.639,178.604L293.186,178.936L295.795,178.769L297.215,179.996L297.856,181.552L297.374,184.208L298.616,186.411L302.026,189.218L302.209,191.221L305.219,191.647L306.306,193.464L307.755,200.250L