<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="울산광역시 북구 2025 통계지역과 주변 경계"><title>울산광역시 북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-26010" d="M102.002,176.955L93.929,174.711L91.783,174.518L90.781,175.107L89.552,178.007L89.785,181.396L88.957,182.600L84.449,184.189L79.445,183.098L76.400,179.735L74.108,177.891L68.511,175.432L66.251,174.645L62.809,174.241L59.270,174.605L56.579,173.584L52.716,169.936L48.709,163.907L48.396,160.340L49.359,156.217L49.015,152.526L46.598,148.099L44.366,145.069L44.541,143.867L47.386,142.148L49.307,141.842L50.486,142.423L52.569,142.082L52.415,139.581L53.969,135.574L54.654,134.858L56.997,134.368L58.473,134.761L59.968,135.804L68.562,138.256L70.225,138.137L72.168,138.783L74.874,137.838L76.701,136.222L77.038,135.269L77.091,130.465L75.993,125.259L79.250,128.023L80.416,128.051L86.551,126.443L88.112,126.668L89.596,127.846L91.009,130.284L92.581,131.734L94.462,131.788L95.783,131.470L99.243,127.475L102.208,125.285L104.536,125.873L106.045,124.985L107.200,122.401L107.181,120.887L108.296,120.056L110.440,120.900L115.271,119.512L116.141,120.688L115.238,123.144L115.627,123.953L117.022,125.059L119.167,125.966L119.916,125.766L122.263,123.475L125.257,122.490L132.102,123.687L132.323,127.425L131.972,134.727L133.234,140.881L135.510,145.710L136.317,150.837L136.038,155.076L137.517,159.880L137.976,163.168L134.571,168.118L134.397,170.164L135.346,173.700L137.253,178.201L138.547,179.269L132.918,177.470L126.486,178.159L116.298,177.400L107.477,176.238Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoi