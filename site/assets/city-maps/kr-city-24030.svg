<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="광주광역시 남구 2025 통계지역과 주변 경계"><title>광주광역시 남구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-24010" d="M280.964,67.300L276.861,62.628L269.490,51.188L264.955,46.464L259.555,38.880L255.690,34.441L263.230,27.031L268.858,9.870L285.879,15.288L287.951,16.671L289.000,17.910L289.556,19.330L295.895,16.702L301.741,16.736L302.231,21.487L307.954,21.710L309.613,26.966L313.741,29.449L319.356,30.293L320.000,30.718L320.000,171.731L319.122,172.439L312.038,173.207L307.786,171.687L297.469,170.184L291.128,169.822L291.332,166.527L289.966,163.241L287.809,162.055L284.228,159.270L279.346,149.300L279.866,146.892L279.044,145.325L274.699,140.214L272.297,139.721L272.981,136.188L274.305,133.887L275.097,130.014L269.976,120.800L266.104,116.434L264.989,113.732L265.188,109.489L262.751,106.447L262.494,102.526L263.766,98.919L262.280,97.258L270.166,94.835L272.047,93.846L273.832,90.911L276.358,90.087L277.871,88.128L277.664,85.379L280.311,83.248L279.967,81.632L288.000,78.974L284.435,75.927L284.723,73.465L282.752,72.176Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-24020" d="M194.972,107.899L187.929,108.111L186.431,109.643L188.889,111.602L187.978,113.183L183.184,114.008L181.225,112.118L164.008,117.110L159.847,122.704L155.429,120.111L153.334,126.526L151.887,127.345L145.721,127.412L143.040,132.086L129.381,139.791L128.803,139.847L123.951,135.142L123.005,134.935L121.076,135