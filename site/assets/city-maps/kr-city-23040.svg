<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 연수구 2025 통계지역과 주변 경계"><title>인천광역시 연수구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23010" d="M96.434,11.849L106.000,17.012L108.585,11.842L95.261,5.097L97.809,0.000L126.986,0.000L129.937,16.271L131.691,17.763L135.239,40.936L96.596,40.794L95.527,40.340L98.086,34.056L100.441,31.459L99.636,30.512L102.073,25.127L92.415,19.213ZM93.282,0.000L80.906,23.639L74.696,23.540L73.635,17.598L68.049,17.593L68.142,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23050" d="M297.092,112.208L292.558,118.442L281.886,130.967L272.273,140.456L257.003,140.508L254.580,139.435L255.216,136.246L195.496,123.141L193.656,122.182L187.194,117.278L203.783,99.084L207.070,96.554L212.326,94.277L214.100,92.781L215.616,90.240L218.511,80.695L219.403,79.486L228.594,70.556L237.218,63.035L245.749,52.603L247.509,49.730L248.081,47.349L249.562,33.657L247.520,28.710L247.118,24.186L243.475,24.103L244.373,16.277L234.039,12.458L229.283,8.355L230.353,7.318L228.442,5.142L228.045,0.503L228.760,0.000L320.000,0.000L320.000,88.005L314.559,96.067L312.616,99.655L312.563,100.494L307.094,103.163L301.581,108.964Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23090" d="M199.637,40.998L190.329,36.642L186.658,35.308L183.42