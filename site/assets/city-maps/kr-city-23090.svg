<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 미추홀구 2025 통계지역과 주변 경계"><title>인천광역시 미추홀구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23010" d="M3.061,163.974L19.942,173.086L24.504,163.962L0.992,152.059L9.864,134.312L3.484,131.396L0.000,138.189L0.000,102.216L8.156,99.711L41.263,116.228L42.334,115.894L44.290,111.968L28.807,104.228L29.783,101.740L13.905,93.854L13.707,84.080L13.992,80.779L19.912,73.242L17.803,72.086L9.090,47.953L2.379,50.195L5.510,58.908L0.944,60.333L0.000,57.665L0.000,32.642L8.277,29.735L12.176,40.943L12.854,41.317L14.280,40.707L10.384,28.943L21.830,24.730L31.862,35.223L37.713,33.386L42.675,33.537L47.036,35.484L53.367,40.506L53.514,39.795L63.049,49.216L77.735,67.154L84.815,72.531L94.924,79.013L92.913,82.206L92.999,91.234L84.403,96.743L80.631,105.433L79.911,109.231L73.994,118.640L69.672,124.640L58.305,133.624L57.046,134.177L55.876,136.256L62.183,171.779L65.278,174.410L70.753,211.830L71.539,215.303L3.348,215.052L1.461,214.252L5.977,203.162L8.893,199.560L10.133,198.580L8.711,196.908L13.013,187.406L0.000,179.437L0.000,169.583ZM2.004,75.773L0.000,78.274L0.000,69.958ZM2.231,26.860L0.000,27.703L0.000,20.542Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23020" d="M94.924,79.013L84.815,72.531L77.735,67.154L63.049,49.216L53.514,39.795L53.367,40.506L47.036,35.484L42.675,33.537L37.713,33.386L31.862,35.223L21.830,24.730L27.782,18.096L7.339,24.999L2.307,11.029L20.337