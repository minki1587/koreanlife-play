<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전라남도 영암군 2025 통계지역 경계 실루엣"><title>전라남도 영암군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M160.984,209.333L158.323,210.746L155.760,208.951L153.230,208.324L151.140,208.565L150.019,210.163L148.908,210.693L147.525,210.406L145.066,211.208L140.152,210.122L138.431,210.642L135.715,211.706L134.402,212.871L131.116,216.638L130.644,219.697L128.960,220.779L127.662,221.109L127.489,218.662L127.901,216.536L128.836,214.246L132.168,209.754L130.775,207.892L130.069,207.868L129.821,208.585L129.109,208.860L127.226,208.251L126.668,207.330L123.956,211.050L125.391,213.472L124.225,214.817L120.638,215.086L118.127,216.162L114.719,219.032L112.029,218.314L107.814,215.624L106.020,213.920L104.316,211.230L101.088,207.912L99.294,204.594L99.832,203.786L101.446,203.517L108.621,204.414L109.697,203.786L108.352,202.172L102.433,201.634L99.473,200.737L90.785,189.247L98.240,186.930L97.635,185.822L94.412,187.333L91.591,187.635L89.576,187.333L87.662,184.613L80.006,180.986L77.789,181.994L75.976,181.792L75.976,181.289L78.495,178.971L79.938,175.736L79.105,172.064L79.337,170.334L76.982,168.184L72.284,169.376L69.509,174.222L68.265,175.146L64.224,172.926L63.072,170.571L63.664,170.053L64.919,170.030L65.660,168.962L63.767,168.428L59.213,171.860L59.168,172.331L59.940,173.158L58.368,174.946L55.529,175.170L53.111,176.331L49.866,176.834L48.830,176.569L48.229,175.969L48.140,174.736L50.391,170.851L51.558,170.422L52.818,170.631L55.277,172.876L55.740,172.909L55.974,171.323L58.151,171.142L58.852,168.243L61.348,167.320L64.031,165.107L63.859,164.085L62.645,163.973L61.971,165.349L57.728,168.221L53.151,167.585L51.784,166.878L52.205,164.308L50.940