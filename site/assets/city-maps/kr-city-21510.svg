<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 기장군 2025 통계지역과 주변 경계"><title>부산광역시 기장군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21050" d="M16.323,239.874L13.636,237.594L13.891,235.214L15.230,232.466L14.337,230.906L14.320,229.584L13.074,228.166L13.092,225.163L14.003,224.680L18.846,219.787L20.100,219.277L21.623,220.675L22.382,219.931L23.209,218.249L23.305,216.284L21.739,215.868L21.219,211.960L23.823,208.575L24.445,206.679L25.984,206.566L29.308,204.884L31.108,202.358L35.022,200.883L38.314,201.860L41.272,205.682L40.764,207.860L44.709,214.347L51.679,215.055L52.076,218.415L53.109,220.954L56.440,221.446L58.676,222.398L59.918,220.434L59.866,218.908L62.655,220.974L67.585,226.037L66.798,229.752L65.663,230.763L65.343,231.633L65.137,234.702L66.973,237.175L67.848,237.376L68.548,238.512L67.711,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M50.571,208.220L47.431,207.278L45.380,207.583L41.272,205.682L38.493,202.272L38.045,201.029L37.992,198.606L39.200,198.532L42.847,194.143L43.563,192.481L43.992,187.572L47.429,182.581L48.528,179.194L49.619,177.965L50.303,175.933L51.830,175.350L54.779,175.261L55.120,176.713L56.859,176.883L58.915,175.753L63.423,175.607L65.886,177.898L66.803,177.256L69.245,179.602L70.899,179.829L69.197,183.310L70.434,184.094L71.768,183.491L74.865,184.533L76.107,185.937L76.376,185.497L77.358,186.307L82.119,188.074L82.620,188.384L82.485,189.179L85.56