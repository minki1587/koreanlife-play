<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 평택시 2025 통계지역과 주변 경계"><title>경기도 평택시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31140" d="M230.651,38.555L230.195,39.198L229.511,39.328L229.303,38.893L228.288,39.133L226.899,37.078L225.500,38.217L224.950,35.727L225.249,34.619L224.356,34.652L224.427,34.036L221.687,33.731L219.918,34.000L219.036,33.625L218.404,32.740L216.854,33.992L216.253,34.976L216.225,35.854L213.889,35.593L211.676,36.126L211.865,38.461L210.041,37.273L207.147,34.084L206.830,32.561L207.372,30.887L205.522,30.671L204.776,29.700L203.573,27.310L202.528,23.920L201.828,23.195L202.164,22.347L202.042,19.820L200.730,17.689L200.584,16.386L202.296,14.619L201.838,12.409L200.059,10.874L200.788,8.904L194.997,5.529L193.444,5.077L190.723,5.285L186.962,4.868L183.858,1.318L181.927,0.000L229.544,0.000L228.202,0.368L228.186,3.149L228.532,4.956L229.773,5.946L229.930,7.140L231.486,8.601L231.156,9.466L231.706,9.811L233.411,9.544L234.031,10.479L236.192,10.212L236.561,10.895L239.856,11.169L241.565,12.027L243.003,12.043L245.642,14.944L246.106,17.165L245.478,18.273L246.413,18.713L247.510,22.785L249.233,24.808L247.114,25.830L245.401,28.618L245.491,30.180L242.971,30.531L241.476,29.823L238.989,31.801L241.408,34.582L241.110,34.873L242.280,36.193L240.411,35.722L239.796,37.313L237.967,38.259L236.215,37.780L235.626,38.605L233.512,39.027L233.529,37.109Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="