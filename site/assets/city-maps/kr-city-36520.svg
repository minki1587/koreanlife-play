<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전라남도 곡성군 2025 통계지역과 주변 경계"><title>전라남도 곡성군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-24010" d="M2.310,165.965L4.864,167.236L6.542,168.959L8.072,172.965L11.374,177.659L11.482,179.164L13.708,183.092L13.874,184.912L8.871,185.804L7.096,189.217L8.489,192.556L8.247,196.857L7.836,197.443L3.458,199.043L0.000,199.279L0.000,166.387Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-24040" d="M0.663,131.700L2.789,132.569L3.602,133.297L5.028,133.524L5.727,133.242L6.483,131.989L5.871,131.042L6.525,130.374L11.608,130.645L13.913,130.357L16.440,130.776L19.630,132.866L22.568,135.932L25.106,136.876L25.920,139.991L27.933,141.118L28.070,142.814L27.546,145.517L23.202,147.237L22.677,148.651L23.336,149.711L21.915,151.140L19.947,154.321L21.210,158.057L19.940,159.613L19.648,162.384L20.993,164.113L21.748,165.892L20.495,176.104L17.486,177.744L16.917,180.061L15.139,181.229L13.708,183.092L11.482,179.164L11.374,177.659L8.072,172.965L6.353,168.656L4.864,167.236L2.421,165.965L0.000,166.387L0.000,132.079Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-35050" d="M263.159,16.316L261.677,19.288L259.341,22.187L259.027,24.804L255.733,27.691L254.774,29.071L254.951,30.357L254.266,31.166L250.857,33.492L250.008,