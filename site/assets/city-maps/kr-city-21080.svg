<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 북구 2025 통계지역과 주변 경계"><title>부산광역시 북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21050" d="M147.018,236.493L148.254,234.653L150.223,233.098L153.017,231.962L153.769,233.085L156.413,235.078L158.106,233.419L159.732,230.254L160.164,225.289L157.463,225.074L156.671,224.362L155.513,215.648L157.047,214.398L158.656,212.311L161.318,208.103L162.453,205.543L162.705,203.876L166.136,203.623L173.545,199.875L175.484,197.564L176.630,194.971L177.558,194.242L179.552,193.222L186.758,190.953L193.623,193.133L200.217,201.653L199.204,204.316L199.086,206.509L201.285,211.160L206.034,218.894L207.880,220.971L211.161,221.851L215.680,221.492L223.418,222.550L224.303,230.039L224.935,230.460L226.167,233.216L226.608,235.700L234.032,236.796L234.781,237.476L239.018,238.919L241.785,234.541L241.671,231.138L247.889,235.745L252.413,240.000L143.474,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M220.948,207.312L213.948,205.212L209.375,205.892L200.217,201.653L194.022,194.052L193.025,191.281L192.906,185.878L193.014,185.361L195.598,185.712L203.730,175.929L205.325,172.223L206.033,166.189L205.786,162.327L206.282,161.279L213.944,150.154L216.395,142.603L216.854,141.571L218.827,139.861L220.350,135.333L221.095,134.744L223.756,134.033L230.329,133.835L230.979,134.631L231.089,137.072L234.967,137.451L239.551,134.930L249.600,134.606L255.092,139.713L257.134,