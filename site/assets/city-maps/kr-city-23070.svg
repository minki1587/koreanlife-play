<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 계양구 2025 통계지역과 주변 경계"><title>인천광역시 계양구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11160" d="M318.087,168.390L311.438,162.823L301.641,164.220L296.232,167.990L297.174,170.251L293.111,171.892L292.599,174.126L293.669,174.592L294.187,178.513L293.245,179.482L291.738,179.132L290.635,180.773L286.679,181.581L282.998,184.016L282.141,181.191L282.588,177.382L280.704,173.292L282.857,172.269L283.880,168.394L277.959,167.533L277.367,162.204L267.840,156.337L261.865,155.099L252.414,155.380L246.418,154.184L244.749,149.663L241.574,147.294L235.599,148.263L233.661,149.340L230.055,141.966L224.565,139.221L225.064,135.675L221.658,133.246L221.981,131.039L218.375,129.801L222.573,126.249L230.721,124.887L234.576,125.442L236.837,124.096L234.469,120.490L242.460,112.302L247.440,116.991L245.503,106.334L241.197,100.736L240.766,96.538L242.596,94.815L245.453,99.849L253.308,94.445L257.672,89.251L256.398,84.799L258.178,80.096L262.313,77.075L268.863,74.577L274.353,69.195L275.429,61.659L278.120,59.399L280.812,63.274L282.351,58.165L284.886,53.488L287.271,53.931L289.738,51.137L290.495,47.287L292.685,41.229L293.764,40.052L297.805,40.978L298.048,40.690L298.115,37.930L294.359,29.375L290.188,15.127L290.024,11.797L291.043,7.671L295.623,0.000L311.025,0.000L320.000,10.098L320.000,169.497Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23060" d="M39.219,240.000L39.138,2