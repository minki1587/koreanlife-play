<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="울산광역시 중구 2025 통계지역과 주변 경계"><title>울산광역시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-26020" d="M2.167,238.824L0.000,238.667L0.000,217.737L0.728,216.379L8.533,212.750L14.245,207.629L21.634,194.511L23.057,188.754L26.879,182.808L31.652,177.682L35.811,180.261L43.055,185.931L46.234,179.467L52.833,173.626L54.705,169.152L61.720,176.677L65.204,179.066L68.642,180.831L72.519,181.842L82.140,180.852L91.495,181.950L97.637,184.090L112.851,190.775L119.081,195.787L127.358,204.928L140.958,207.891L144.232,207.137L153.212,203.575L155.461,200.302L154.828,191.090L158.168,183.206L160.891,181.607L163.758,181.432L166.725,182.130L169.170,183.078L188.668,188.229L203.551,186.280L227.526,189.438L255.217,191.503L263.435,190.269L272.700,189.630L285.311,193.249L288.000,194.520L298.450,202.017L303.772,205.199L315.934,209.575L310.814,216.765L317.338,219.149L320.000,222.344L320.000,240.000L3.536,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-26040" d="M315.934,209.575L303.772,205.199L301.264,203.858L288.000,194.520L284.483,191.617L279.300,179.383L276.722,169.772L277.193,164.211L286.450,150.756L285.202,141.820L281.183,128.760L281.941,117.240L279.745,103.303L276.529,94.900L273.559,90.179L270.129,73.450L271.082,53.604L270.483,43.442L251.877,40.190L246.065,41.758L243.740,42.868L241.232,45.971L237.361,49.095L235.325,49.637L229.495,47.172L225.701,44.165L22