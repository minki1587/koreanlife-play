<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 달서구 2025 통계지역과 주변 경계"><title>대구광역시 달서구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22010" d="M233.813,42.021L232.431,31.481L240.036,24.468L241.913,21.496L241.362,21.193L241.569,16.596L238.975,18.083L237.165,18.258L235.217,16.031L235.148,14.131L237.158,9.757L239.775,11.466L241.136,11.509L239.632,9.709L238.836,3.228L266.432,9.271L266.503,11.287L273.302,10.879L281.949,13.875L284.744,14.004L286.997,13.533L291.451,11.806L294.209,13.990L298.772,25.112L296.286,30.510L289.591,38.913L288.651,42.023L288.323,46.357L288.891,51.590L272.773,50.673L270.377,49.217L266.478,48.594L255.301,48.385L247.319,49.306Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22020" d="M285.647,8.476L286.298,6.692L290.681,3.779L293.598,0.000L320.000,0.000L320.000,27.119L298.772,25.112L294.209,13.990L291.451,11.806Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22030" d="M207.716,45.910L190.922,53.428L186.046,50.486L183.659,51.056L178.164,50.120L177.562,44.591L166.869,44.661L167.929,38.211L163.483,36.235L155.516,35.128L154.148,33.544L153.045,28.483L146.424,27.647L143.701,24.000L145.531,21.544L146.970,17.019L146.442,11.197L145.467,7.115L143.363,2.756L141.367,0.000L243.438,0.000L242.458,4.020L238.836,3