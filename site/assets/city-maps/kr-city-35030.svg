<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 익산시 2025 통계지역과 주변 경계"><title>전북특별자치도 익산시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-34060" d="M248.209,71.088L245.418,70.824L242.997,72.833L242.207,72.494L240.400,73.328L238.301,77.188L238.852,80.793L238.337,85.492L236.885,88.104L233.944,88.805L232.207,89.907L229.409,86.997L226.917,86.164L222.266,82.144L220.205,81.075L216.823,82.067L215.545,81.456L214.006,83.668L213.386,83.351L212.610,82.211L212.382,81.063L208.707,79.468L207.330,77.746L207.128,76.853L204.699,74.838L203.141,74.925L202.218,72.664L200.796,72.197L197.167,68.351L196.852,63.266L197.112,60.408L195.489,58.118L195.753,56.792L195.257,52.056L195.885,50.769L196.676,50.632L196.997,46.270L195.501,46.284L193.348,42.950L191.349,42.042L190.633,40.886L190.958,39.774L191.748,39.187L191.475,36.114L190.769,34.136L188.667,33.713L188.691,33.132L187.541,32.141L185.709,33.962L184.978,34.135L185.114,36.117L184.662,36.565L182.076,36.433L180.026,37.414L179.407,38.096L175.884,38.147L174.119,37.040L172.644,31.996L171.369,29.445L170.311,30.987L168.296,31.419L167.554,30.764L165.818,30.505L161.820,26.980L160.981,24.149L161.346,22.303L161.989,21.627L162.762,21.947L166.728,19.938L161.167,7.422L154.254,0.000L320.000,0.000L320.000,58.450L318.123,59.016L312.884,57.945L310.990,56.696L310.500,55.439L309.112,54.367L305.672,55.688L304.891,57.243L304.854,59.093L302.507,61.161L302.451,66.695L302.591,67.954L303.179,68.717L304.416,69.306L308.712,73.104L307.791,75.274L307.013,75.777L305.118,75.993L302.575,75.791L300.030,74.278L297.440,70.882L296.460,68.673