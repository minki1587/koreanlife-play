<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 양천구 2025 통계지역과 주변 경계"><title>서울특별시 양천구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11140" d="M298.159,52.256L296.903,48.253L288.740,37.736L263.781,25.334L222.501,0.000L320.000,0.000L320.000,62.568L306.479,62.627Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11160" d="M96.162,81.078L97.498,77.788L93.428,66.642L91.569,59.226L82.424,59.621L82.333,56.946L82.848,56.027L81.450,50.768L83.326,44.405L81.561,37.270L75.161,37.160L74.977,39.514L72.697,44.295L70.089,48.324L69.461,51.172L70.637,55.439L67.989,57.903L68.431,59.778L58.652,63.358L50.492,62.923L42.107,63.658L29.381,63.033L23.462,59.607L14.376,52.000L0.987,53.910L0.000,54.527L0.000,0.000L222.501,0.000L233.248,6.340L230.030,11.363L229.637,17.485L226.027,16.622L226.419,23.686L234.039,37.550L226.309,39.962L222.449,40.534L213.987,40.961L209.215,40.246L204.084,38.172L184.983,24.000L179.627,44.762L178.441,51.205L180.731,57.470L182.844,69.470L182.219,83.307L183.616,105.107L138.341,111.939L113.140,116.878Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11170" d="M33.901,236.181L30.002,229.929L33.091,226.545L34.195,222.352L36.622,223.382L38.868,224.919L40.610,224.280L45.743,220.293L47.950,221.028L50.377,219.042L49.274,214.2