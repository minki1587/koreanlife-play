<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="광주광역시 서구 2025 통계지역과 주변 경계"><title>광주광역시 서구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-24010" d="M285.856,125.290L282.588,122.012L280.726,119.448L277.551,114.053L271.509,105.144L265.839,99.237L259.088,89.754L254.254,84.204L263.682,74.939L270.720,53.481L276.805,55.404L276.812,55.136L292.002,60.255L294.592,61.986L295.905,63.535L296.600,65.309L304.525,62.024L311.835,62.067L312.448,68.007L319.603,68.285L320.000,69.542L320.000,240.000L289.790,240.000L283.833,227.819L284.484,224.809L283.455,222.849L280.224,218.613L278.023,216.459L275.020,215.843L275.875,211.425L277.531,208.548L278.520,203.705L272.117,192.184L267.276,186.725L265.882,183.347L266.130,178.042L263.083,174.238L262.762,169.335L264.353,164.825L262.495,162.748L266.145,161.309L272.356,159.719L274.707,158.482L276.939,154.812L280.098,153.782L281.989,151.333L281.731,147.895L285.040,145.230L284.610,143.211L294.654,139.886L290.197,136.077L290.556,132.999L288.092,131.387Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-24030" d="M213.284,237.402L210.227,240.000L41.319,240.000L54.067,220.957L57.288,219.713L59.997,217.297L63.658,214.954L70.849,205.113L72.394,206.674L72.812,207.990L80.000,214.467L81.725,214.744L84.007,213.204L85.939,211.121L88.350,209.858L89.533,210.117L93.936,214.025L95.600,216.000L96.322,215.929L113.402,206.296L116.754,200.452L124.463,200.367L126.273,199.344L128.892,1