<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청북도 진천군 2025 통계지역 경계 실루엣"><title>충청북도 진천군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M197.761,203.964L195.081,207.312L193.413,206.021L189.264,205.286L188.502,205.842L188.888,206.796L184.830,209.277L183.341,210.674L181.573,211.095L179.727,210.348L175.975,210.030L175.006,210.355L173.839,213.388L171.138,216.099L169.700,216.660L168.251,219.178L167.904,222.600L168.065,226.945L167.053,227.455L165.749,228.000L164.162,227.547L162.810,226.411L162.497,224.636L160.651,223.874L154.913,226.017L153.102,225.938L151.814,222.700L152.040,221.918L153.132,221.624L153.243,220.927L150.109,219.920L148.122,220.339L148.886,219.002L148.813,218.259L143.406,208.524L140.710,206.932L137.481,206.502L136.112,204.374L136.336,203.149L135.049,201.467L133.978,200.543L132.218,199.932L131.933,198.359L133.050,193.690L133.546,192.683L135.040,191.678L136.420,189.315L135.910,186.298L133.717,185.715L130.785,182.233L129.991,180.740L127.317,178.563L123.735,174.531L117.074,172.058L115.691,171.819L114.945,172.228L113.236,171.714L111.411,169.488L109.488,168.916L107.559,167.383L106.927,166.334L107.488,164.640L106.170,162.178L102.933,160.788L101.342,161.082L99.670,162.187L95.397,160.305L93.088,161.288L91.793,160.784L91.117,159.688L92.187,157.779L92.579,155.261L91.480,154.487L91.549,153.579L92.663,149.605L93.600,148.128L93.145,144.222L93.581,141.433L93.315,140.707L92.024,139.305L87.770,137.845L83.767,138.148L82.096,137.145L80.052,137.156L77.861,138.334L75.221,136.536L74.272,136.554L73.395,133.772L74.782,131.111L76.338,129.555L76.923,127.942L76.017,125.371L75.892,118.938L74.795,115.580L72.012,115.178L70.376,113.896L68.797,111.905