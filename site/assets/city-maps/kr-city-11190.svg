<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 영등포구 2025 통계지역과 주변 경계"><title>서울특별시 영등포구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11020" d="M318.793,37.998L313.715,31.905L311.651,33.648L310.095,33.793L305.256,31.375L303.882,31.363L301.710,32.725L295.511,28.272L294.763,28.788L294.548,33.441L294.902,34.591L285.718,30.009L278.659,31.300L277.430,27.289L271.475,30.681L264.289,37.661L262.855,33.715L262.882,27.316L263.627,27.365L265.890,24.425L266.153,22.468L265.785,19.687L262.466,17.860L263.725,16.771L267.350,16.553L274.117,11.323L279.896,9.451L274.359,0.000L320.000,0.000L320.000,38.472Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11030" d="M288.637,156.737L271.086,148.074L252.605,134.773L236.265,128.216L236.603,104.140L234.465,99.302L226.027,85.239L226.928,82.059L229.308,80.139L232.791,80.242L239.119,78.947L242.295,77.117L243.571,75.831L243.970,74.317L251.287,66.988L254.096,62.971L256.142,53.561L265.421,45.002L265.988,45.282L267.036,44.680L267.598,42.261L264.289,37.661L271.475,30.681L277.430,27.289L278.659,31.300L285.718,30.009L294.902,34.591L294.548,33.441L294.763,28.788L295.511,28.272L301.710,32.725L303.882,31.363L305.256,31.375L310.095,33.793L311.651,33.648L313.715,31.905L318.793,37.998L320.000,38.472L320.000,148.420L313.557,158.762L301.660,159.071Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round