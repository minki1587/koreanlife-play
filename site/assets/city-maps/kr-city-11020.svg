<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 중구 2025 통계지역과 주변 경계"><title>서울특별시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M54.591,76.705L52.930,79.485L1.498,14.775L8.943,14.354L10.095,12.717L10.325,5.699L12.938,2.986L15.079,1.522L20.047,0.989L22.037,1.390L29.445,5.472L25.479,0.000L214.663,0.000L218.194,8.207L222.593,9.433L224.613,8.817L231.207,3.092L233.734,4.029L237.767,2.126L240.598,0.000L242.029,0.000L246.546,1.522L247.811,1.516L249.356,3.031L252.516,12.146L254.046,20.183L256.957,22.814L271.695,20.085L274.276,20.368L274.904,51.402L257.054,55.030L251.921,58.419L246.000,60.689L220.835,60.755L209.459,61.366L189.621,61.538L176.572,64.672L170.292,65.776L139.711,68.572L130.703,68.006L115.408,64.589L96.254,62.714L93.242,62.969L89.092,62.248L82.651,62.579L61.914,67.718Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11030" d="M0.000,215.043L11.557,203.383L16.694,196.038L17.121,192.021L20.436,178.829L32.222,168.482L37.404,163.178L38.441,163.689L40.357,162.588L41.386,158.165L35.334,149.753L45.043,140.005L48.474,136.987L59.364,130.785L61.611,138.119L74.521,135.758L91.317,144.138L90.668,142.036L91.062,133.526L91.675,132.727L92.429,132.582L103.766,140.727L107.738,138.236L110.251,138.258L116.460,140.854L119.100,142.679L121.946,142.413L125.719,139.227L135.006,150.369L152.800,157.353L156.043,162.480L164.331,171.478L173.884,161.087L176.952,158.280L179.235,158.491L18