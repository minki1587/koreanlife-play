<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청북도 괴산군 2025 통계지역 경계 실루엣"><title>충청북도 괴산군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M202.653,162.391L202.220,167.052L202.555,167.788L202.427,170.611L200.485,172.855L198.073,171.572L195.905,171.312L194.272,170.247L193.646,171.017L190.280,171.110L186.736,170.836L184.500,170.137L183.833,170.980L180.172,171.990L179.255,174.190L178.520,174.369L177.438,175.484L176.823,176.834L175.132,177.681L174.967,178.744L175.006,179.310L176.118,180.061L178.563,179.579L180.384,179.758L182.555,177.609L184.701,177.493L188.450,178.798L189.946,178.890L191.905,180.206L193.087,180.417L195.907,186.502L199.511,185.731L201.033,186.247L202.886,188.247L202.334,193.920L202.510,195.459L204.723,196.007L205.989,197.030L206.611,199.631L204.707,201.852L204.258,204.165L204.135,205.957L204.813,207.949L202.924,213.617L203.673,216.134L203.414,217.079L202.676,217.767L199.294,219.316L198.984,221.870L199.411,223.933L198.795,225.723L197.069,226.724L194.591,225.108L195.031,222.005L194.088,218.710L192.882,217.123L191.613,212.943L188.642,211.712L187.118,212.335L184.827,212.490L183.789,211.445L182.436,211.365L181.367,210.654L180.651,207.191L181.588,206.024L181.204,203.890L178.842,201.972L177.765,200.187L176.444,193.104L174.707,193.621L173.573,194.476L172.773,198.919L171.711,199.591L171.827,201.639L170.855,202.120L169.782,203.896L168.771,204.191L168.462,206.219L167.576,207.645L165.138,208.224L160.493,208.294L160.664,211.817L160.245,213.593L162.075,217.316L164.924,217.910L166.109,220.852L165.046,221.496L163.860,221.504L163.185,221.007L161.349,221.166L160.355,222.305L156.789,223.952L155.478,223.508L152.580,221.488L151.451,221.397