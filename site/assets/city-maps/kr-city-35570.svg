<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 고창군 2025 통계지역과 주변 경계"><title>전북특별자치도 고창군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-35040" d="M285.365,87.302L283.141,88.340L282.242,89.541L281.687,93.763L282.873,95.867L282.016,99.220L276.566,100.087L275.390,99.594L270.122,100.303L267.288,99.985L264.003,98.045L260.204,99.453L258.465,99.379L258.461,97.032L257.567,93.467L257.053,89.174L255.282,87.190L254.561,82.821L253.830,82.040L255.843,80.977L256.335,80.141L256.323,75.208L257.650,72.997L257.600,72.021L256.649,71.036L252.953,70.520L252.040,69.826L251.515,69.389L251.310,67.166L251.278,66.337L252.361,65.137L255.261,63.162L257.535,62.275L259.450,60.703L258.776,59.399L255.573,56.452L254.248,56.273L252.312,54.119L252.949,45.814L254.531,44.314L255.209,42.623L254.363,39.843L252.275,38.083L253.566,36.420L254.468,35.868L255.766,32.530L254.503,30.498L254.142,27.735L250.233,25.553L248.113,25.679L247.513,26.523L245.910,27.260L243.467,27.689L242.286,29.147L239.921,29.775L235.008,27.380L232.556,27.412L229.794,25.676L228.347,22.620L228.098,20.397L228.864,18.057L231.033,15.202L232.140,11.330L230.011,10.606L229.175,7.872L229.789,4.399L230.312,3.641L229.422,0.000L320.000,0.000L320.000,88.210L318.063,89.591L316.386,91.876L315.242,91.481L309.791,91.367L308.728,92.010L309.026,96.005L310.879,99.213L311.120,102.234L313.597,104.660L309.509,104.448L307.950,103.952L307.087,102.615L303.250,101.374L298.466,102.807L298.044,103.620L296.933,104.032L296.084,102.314L297.492,101.047L297.435,99.113L297.910,97.003L299.006,94.329L298.534,91.447L297.393,89.471L296