<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 전주시 2025 통계지역과 주변 경계"><title>전북특별자치도 전주시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-35030" d="M127.747,1.626L124.651,2.506L122.893,1.543L114.696,7.896L107.113,3.087L106.504,2.184L104.666,1.100L100.778,0.000L129.533,0.000ZM91.067,0.000L89.508,2.643L87.390,4.807L83.643,4.052L81.791,4.691L81.026,6.059L81.111,8.183L83.687,13.468L86.707,14.373L86.908,14.968L86.798,15.390L85.075,15.697L84.704,16.102L84.168,17.122L83.990,18.789L85.225,20.810L86.183,21.460L86.862,20.995L87.252,21.327L88.435,32.572L87.009,33.419L85.553,33.657L84.601,33.138L82.607,29.191L80.296,27.680L76.766,29.507L75.791,30.809L73.773,31.575L72.018,31.659L69.947,30.395L68.283,29.949L56.186,32.516L55.099,33.156L55.996,35.136L56.272,36.844L52.500,42.230L52.832,43.225L52.400,43.843L50.151,43.601L49.409,42.787L48.458,39.129L48.839,37.897L50.728,37.375L51.018,34.341L50.253,33.783L48.105,33.829L45.839,33.125L43.849,29.382L37.945,27.051L34.602,26.715L29.675,27.360L18.854,21.299L16.150,17.570L12.886,14.896L6.450,13.413L0.000,10.921L0.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-35040" d="M2.632,222.984L3.169,223.445L4.130,223.449L6.991,222.250L9.397,219.408L18.669,221.180L24.983,223.624L28.207,226.317L33.488,228.583L37.102,231.328L36.821,233.426L39.509,235.787L42.881,240.000L0.000,240.000L0.000,223.076Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" 