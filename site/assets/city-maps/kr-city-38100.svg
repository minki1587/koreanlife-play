<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상남도 양산시 2025 통계지역과 주변 경계"><title>경상남도 양산시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21080" d="M134.205,240.000L140.212,224.360L141.189,218.700L141.112,215.870L143.432,214.483L145.675,214.029L149.171,212.327L151.543,211.957L153.971,213.115L157.120,213.822L158.831,211.420L160.026,210.498L163.951,210.628L161.785,215.316L159.235,219.153L159.016,222.585L158.701,223.092L156.380,224.024L155.402,225.817L158.173,226.382L162.539,228.117L163.016,229.141L162.087,229.777L161.146,231.341L161.270,235.128L161.627,235.675L162.957,235.835L163.773,236.487L164.565,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21090" d="M218.095,239.527L218.668,238.961L219.027,238.225L219.457,237.992L219.660,237.466L219.401,236.574L219.454,236.313L219.958,235.758L220.106,235.246L220.919,234.288L220.807,232.934L221.221,232.022L221.191,231.419L221.841,231.711L221.982,231.774L222.646,232.283L222.757,232.376L222.845,232.484L222.896,232.561L222.999,232.741L223.067,232.862L223.560,233.939L223.623,233.908L224.246,233.690L224.452,233.660L224.673,233.666L224.881,233.749L227.326,235.169L227.742,235.509L228.029,236.135L228.206,236.822L227.964,239.734L227.961,240.000L217.663,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="contex