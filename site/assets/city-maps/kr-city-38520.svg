<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상남도 함안군 2025 통계지역과 주변 경계"><title>경상남도 함안군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-38030" d="M0.022,133.398L1.286,134.168L1.702,136.380L1.523,138.969L0.435,141.260L0.574,141.975L4.235,144.339L5.300,144.358L5.965,143.256L6.661,140.185L8.280,136.729L10.691,135.239L12.297,134.992L13.469,135.380L14.484,136.814L16.444,135.197L17.663,135.265L19.824,136.551L21.890,138.542L24.134,142.247L27.020,143.640L29.227,144.046L36.679,143.953L44.695,140.953L52.684,141.916L53.352,141.852L54.198,140.849L56.466,141.404L62.149,145.407L64.033,145.075L65.011,144.066L67.087,143.883L70.432,146.677L70.789,148.078L70.196,149.363L67.838,152.220L67.642,153.912L71.039,156.457L73.935,156.906L76.397,161.676L76.789,163.293L75.467,167.849L76.534,169.725L81.536,169.531L82.369,168.859L83.840,169.626L86.100,172.543L86.677,176.372L88.755,177.972L90.031,180.904L91.626,181.793L96.981,180.186L98.401,181.002L100.248,180.988L105.102,179.136L106.976,179.501L109.776,181.629L110.937,183.228L111.916,186.127L114.794,188.632L116.943,191.809L117.399,194.337L116.500,196.922L116.554,200.779L115.028,204.898L115.479,210.013L114.205,212.983L113.007,217.754L113.121,222.841L113.670,225.976L113.378,227.181L111.780,228.889L111.325,230.300L111.559,231.048L112.221,231.261L112.771,232.031L113.687,234.330L113.125,235.461L111.917,235.647L110.286,237.123L110.374,238.791L111.057,239.507L110.876,239.970L0.000,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect=