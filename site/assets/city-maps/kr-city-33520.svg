<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청북도 보은군 2025 통계지역과 주변 경계"><title>충청북도 보은군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-25010" d="M0.000,228.794L3.360,230.524L4.136,229.907L3.912,227.088L4.788,223.807L4.630,222.898L3.250,222.251L0.000,215.069L0.000,189.161L1.613,188.286L2.871,186.706L4.996,185.313L6.196,183.782L12.196,174.442L14.422,170.079L14.728,167.988L16.142,165.646L19.424,166.261L24.811,177.048L27.886,185.479L28.873,186.373L32.023,187.841L32.629,189.467L36.205,174.436L37.391,174.848L38.614,176.087L41.566,173.718L44.510,175.765L44.857,176.743L47.810,177.174L51.459,175.657L53.137,175.634L54.379,176.408L53.600,178.676L53.825,181.508L54.551,183.208L59.272,187.759L60.412,189.653L61.227,192.712L62.562,194.063L62.013,195.116L60.619,196.037L58.896,195.628L56.775,194.448L53.915,194.963L53.598,194.250L51.090,194.109L47.884,196.867L47.221,198.548L42.570,201.862L42.246,202.741L42.302,210.564L43.121,212.807L43.296,215.992L39.781,228.611L37.977,228.378L36.330,228.770L35.265,229.929L32.457,230.776L31.284,234.470L31.437,235.879L32.168,236.539L30.593,238.466L27.618,239.155L27.054,240.000L0.000,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-25050" d="M0.000,150.694L3.426,147.538L3.474,141.878L4.364,138.678L6.202,135.519L8.342,133.345L13.084,131.155L15.596,130.836L16.210,131.036L16.457,132.870L13.137,144.740L13.172,146.545L15.058,148.008L18.134,149.036L21.656,149.1