<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 양양군 2025 통계지역과 주변 경계"><title>강원특별자치도 양양군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32030" d="M148.211,239.960L147.684,238.567L148.057,230.385L150.112,225.513L149.606,222.949L151.331,217.724L151.524,216.528L151.212,216.000L153.052,213.660L155.625,213.337L157.779,210.253L160.647,210.430L167.773,209.127L169.235,207.358L169.192,205.157L169.726,202.955L171.955,200.749L174.844,199.238L176.501,195.802L178.033,194.609L179.141,194.400L179.926,194.870L180.346,195.260L180.173,195.777L181.680,197.075L184.213,197.107L187.339,196.411L189.995,197.126L191.154,200.203L192.359,200.157L196.034,197.474L197.284,197.117L199.451,197.522L200.870,196.006L203.371,195.356L204.806,193.985L208.876,191.939L212.788,192.313L214.607,191.703L214.576,190.970L217.052,188.370L217.705,188.987L219.656,189.386L221.497,188.773L222.481,190.144L224.166,190.744L225.552,189.837L226.282,188.473L227.627,188.024L228.276,188.289L230.431,187.880L231.289,186.238L231.665,184.379L233.852,183.791L235.049,182.644L236.424,182.545L237.999,184.082L239.359,184.333L244.043,183.430L246.327,183.860L248.038,181.802L249.589,180.696L255.080,182.509L259.911,181.927L260.580,181.636L261.948,179.696L263.561,178.380L270.816,185.015L272.335,185.790L273.038,185.230L274.030,185.823L274.848,187.553L274.049,186.805L273.492,187.725L273.800,188.369L275.963,189.998L276.378,191.475L275.373,195.589L276.053,198.519L274.199,199.811L274.280,200.279L276.780,203.819L280.788,208.396L283.240,209.383L283.563,210.197L283.334,212.037L283.730,212.802L290.012,219.11