<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 사하구 2025 통계지역과 주변 경계"><title>부산광역시 사하구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M266.632,82.822L262.905,81.725L254.729,82.996L250.777,84.411L247.454,75.822L243.071,72.290L242.508,69.561L245.090,58.397L250.685,54.146L251.682,55.305L252.866,54.056L253.858,50.984L253.350,45.112L251.330,44.608L250.017,42.995L252.718,41.839L260.552,44.385L269.631,52.065L276.972,54.470L274.067,59.641L280.062,64.075L278.774,65.826L273.271,61.775L272.423,64.123L278.720,68.799L276.449,71.773L270.961,68.636L272.234,66.971L269.899,67.095L269.517,67.995L269.882,79.545L272.239,84.972L271.916,85.222L270.106,81.503L267.057,82.700L268.092,86.021L267.682,86.143Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21020" d="M232.507,178.936L231.975,177.985L232.168,175.659L232.297,174.478L233.065,173.684L234.273,174.093L235.265,175.618L235.582,177.713L234.872,178.874L235.643,179.181L235.824,180.047L235.448,180.567L234.822,180.421ZM248.754,122.916L244.840,125.260L244.350,124.797L244.630,123.664L243.724,120.814L242.897,119.884L241.970,119.911L240.546,120.191L237.837,121.775L235.634,124.559L234.888,126.135L236.894,130.844L243.046,137.077L245.431,149.952L244.572,152.997L239.778,156.343L235.299,160.734L234.676,164.944L235.638,165.230L235.953,166.475L235.342,168.277L234.494,169.236L223.559,173.436L223.317,172.928L226.033,171.480L226.928,169.655L223.326,15