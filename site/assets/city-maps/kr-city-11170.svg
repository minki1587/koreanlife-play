<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 구로구 2025 통계지역과 주변 경계"><title>서울특별시 구로구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11150" d="M151.865,66.825L145.714,64.456L129.428,70.703L124.049,73.949L121.867,79.039L115.554,84.528L110.675,87.676L106.006,91.534L104.263,96.605L104.179,101.355L100.003,99.585L98.656,99.504L98.983,98.368L98.712,93.064L98.028,90.988L96.686,89.739L92.840,88.354L88.058,83.817L82.427,77.349L82.537,74.719L70.785,70.457L65.535,71.905L63.529,69.289L63.250,62.521L65.064,55.125L64.366,50.450L61.854,48.496L61.645,43.891L65.243,38.432L68.326,30.879L68.468,23.292L67.536,19.100L70.977,12.668L75.844,9.717L76.070,8.237L77.710,7.191L76.737,6.501L75.059,1.225L75.397,0.000L107.385,0.000L110.862,7.332L134.766,2.646L152.311,0.000L243.237,0.000L240.972,2.803L227.925,8.896L224.432,12.776L222.410,23.565L221.290,42.886L218.350,51.740L204.079,72.169L197.712,82.452L193.099,83.227L175.743,84.644L174.728,83.632L172.752,78.505L166.069,78.456L160.612,66.808L154.724,68.467Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11160" d="M107.385,0.000L152.311,0.000L134.766,2.646L110.862,7.332Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11180" d="M247.296,239.919L246.083,236.559L221.457,199.660L217.425,192.789L212.3