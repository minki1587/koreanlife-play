<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 예산군 2025 통계지역 경계 실루엣"><title>충청남도 예산군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M202.470,195.809L201.470,198.497L198.832,200.509L198.349,203.825L197.295,206.480L194.956,207.837L192.832,211.943L192.533,214.603L192.923,215.481L190.303,222.377L189.562,225.921L189.000,226.663L185.171,225.833L183.341,226.152L182.264,224.843L180.951,224.486L177.420,225.574L176.549,228.000L172.189,224.911L168.254,223.588L164.212,221.629L162.734,221.687L161.959,223.172L161.322,223.585L158.917,223.275L154.723,220.682L153.743,219.527L151.179,222.098L150.458,223.802L148.143,226.747L144.454,226.465L141.333,224.522L139.780,224.075L136.487,219.251L136.610,216.580L136.180,215.143L134.558,213.306L134.256,212.406L133.865,209.524L134.079,208.420L137.118,205.183L139.757,205.306L140.805,204.529L141.145,203.715L141.100,199.728L142.073,197.927L140.408,189.530L141.401,185.932L142.410,186.117L144.316,185.306L145.952,184.046L146.066,183.240L151.162,180.783L152.267,179.581L152.311,177.711L156.050,176.485L156.339,175.640L155.348,173.593L154.713,168.749L155.706,168.034L156.459,165.632L155.403,163.473L155.142,161.960L155.586,157.931L152.508,156.384L151.781,156.393L150.589,157.366L149.626,157.080L146.609,152.502L146.667,151.634L147.815,150.876L148.212,150.123L147.331,145.861L145.091,145.188L143.931,144.485L143.554,143.690L142.545,143.473L143.122,139.848L142.713,139.121L143.248,137.673L144.245,136.492L143.934,135.278L141.618,133.658L136.948,132.669L135.066,133.057L134.284,132.106L133.993,130.765L134.660,124.989L135.920,122.540L137.340,122.057L138.958,119.533L139.983,115.657L138.257,115.607L136.568,114.046L129.773,116.241