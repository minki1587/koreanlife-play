<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 군포시 2025 통계지역과 주변 경계"><title>경기도 군포시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31010" d="M204.559,237.670L196.528,234.735L190.596,227.604L190.994,221.873L195.110,221.638L209.284,227.033L231.509,228.132L232.806,224.281L235.718,221.676L249.765,224.808L255.822,218.600L259.547,211.810L260.809,208.657L261.529,196.072L263.736,188.575L268.522,186.038L265.929,180.497L262.217,169.589L262.274,167.401L270.156,151.911L271.211,147.414L276.067,151.619L282.596,155.976L291.361,161.029L295.186,160.652L304.209,153.678L310.968,144.054L313.085,141.978L320.000,137.704L320.000,240.000L204.782,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31040" d="M207.299,32.505L201.704,30.641L192.158,28.206L180.091,27.696L174.257,28.507L168.603,30.537L165.453,30.399L163.964,29.430L160.543,29.805L158.760,32.136L154.913,33.328L152.688,39.985L148.336,49.729L148.529,51.850L148.172,52.980L145.778,57.690L141.196,64.497L140.514,69.049L139.326,73.049L135.376,76.516L132.863,80.810L125.857,81.349L118.137,78.186L114.951,73.192L105.684,33.384L96.146,29.929L86.645,30.792L83.069,15.252L78.189,0.000L278.321,0.000L275.334,4.518L274.073,18.842L264.757,34.514L260.469,40.949L259.705,42.876L259.611,54.905L257.476,60.616L257.804,61.953L259.679,63.561L261.245,65.580L261.137,68.336L257.483,69.405L252.850,69.932L242.300,58.238L239.468,57.707L234.224,57.508L228.469,54.667L