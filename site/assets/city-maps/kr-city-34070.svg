<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 계룡시 2025 통계지역과 주변 경계"><title>충청남도 계룡시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-25030" d="M314.402,163.639L313.527,165.896L314.386,166.866L315.774,180.771L319.253,183.935L320.000,189.243L320.000,195.914L316.514,212.745L317.948,215.762L313.965,224.594L314.305,226.508L318.193,230.023L319.129,232.022L320.000,236.126L319.491,237.451L318.502,237.857L315.704,238.357L314.574,238.166L313.853,240.000L258.610,240.000L253.504,231.651L247.734,228.498L245.905,227.932L242.452,224.488L240.696,221.177L239.406,220.898L238.605,221.395L238.128,224.180L239.130,231.237L238.477,232.771L236.740,233.514L234.993,233.591L226.082,230.443L224.868,223.392L222.619,218.745L218.730,214.386L211.854,208.319L211.741,205.017L207.905,196.114L205.367,196.126L207.415,195.056L209.277,193.260L209.574,190.413L207.982,182.596L209.193,180.412L210.439,179.975L211.345,176.130L210.501,174.141L211.181,172.922L213.490,170.481L215.868,168.855L222.403,165.280L223.589,163.246L224.482,163.612L225.537,162.957L226.584,160.855L228.813,157.926L235.146,153.761L238.244,152.896L244.133,149.609L243.944,146.652L244.504,144.595L247.120,142.721L248.419,140.511L249.033,134.162L253.374,129.467L255.297,128.105L256.850,128.021L258.230,127.430L260.627,125.032L260.997,123.812L261.181,117.433L263.879,109.378L264.960,107.807L267.388,105.002L273.923,102.386L278.046,102.204L277.698,91.805L278.864,89.284L280.260,87.776L284.312,83.859L286.139,83.169L287.393,75.611L284.794,75.546L284.489,74.456L282.373,58.475L282.383,55.397L285.239,55.373L285.300,52.112L