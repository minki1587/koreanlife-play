<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 강화군 2025 통계지역과 주변 경계"><title>인천광역시 강화군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23010" d="M310.802,238.774L311.315,238.997L312.068,239.604L312.435,240.000L309.036,240.000L308.859,239.736L309.219,239.353L310.053,238.975L310.407,238.815Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23080" d="M320.000,234.771L314.716,235.496L314.528,231.651L307.506,222.469L304.019,213.411L302.278,210.095L314.402,206.298L320.000,202.818Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23520" d="M119.721,239.945L117.504,239.651L117.101,239.708L117.187,238.978L118.995,237.352L120.520,237.453L122.160,238.096L122.393,238.203L122.648,238.361L123.924,239.463L124.074,239.563L124.163,239.656L124.211,239.771L124.255,240.000L119.858,240.000ZM113.283,231.168L113.484,230.955L113.889,230.735L113.987,230.782L114.085,230.920L116.398,233.753L116.431,233.769L116.512,233.789L117.533,234.180L117.939,234.462L118.027,234.609L118.089,234.831L118.031,234.965L117.235,235.562L117.058,235.685L116.894,235.737L116.669,235.767L115.329,235.907L115.127,235.915L114.910,235.874L114.799,235.827L114.736,235.716L113.336,231.930L113.260,231.547L113.264,231.279ZM213.432,239.451L214.057,238.902L214.306,238.738L214.688,