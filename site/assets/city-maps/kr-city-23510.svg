<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 강화군 2025 통계지역 경계 실루엣"><title>인천광역시 강화군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M115.668,191.415L116.253,190.475L116.832,190.439L117.372,190.939L117.251,192.259L116.113,192.413ZM77.901,183.606L77.999,182.915L80.133,180.777L80.860,180.630L81.342,181.129L81.358,181.931L80.358,183.958L78.465,183.958ZM99.529,163.665L102.631,162.359L105.202,162.346L107.909,163.847L108.068,165.754L105.922,167.398L103.933,171.926L103.845,176.604L104.285,178.617L105.717,181.046L109.252,182.410L111.785,185.633L112.142,186.752L110.167,189.365L109.581,189.515L109.111,188.842L109.724,187.021L109.410,185.388L100.038,182.149L91.978,176.148L88.770,171.366L86.202,166.407L84.985,164.759L83.989,164.286L84.434,161.980L85.462,161.812L87.033,163.456L87.985,163.822L89.636,162.339L89.480,161.101L90.874,160.442L91.598,160.405L94.095,162.603L95.954,163.356ZM115.031,175.645L114.090,172.249L113.713,167.606L114.352,164.202L115.229,161.887L116.489,160.740L120.047,164.500L121.071,167.256L119.515,170.417L120.406,177.594L120.089,180.238L119.231,181.551L118.524,181.726L117.593,180.438ZM95.319,155.219L96.880,154.202L97.990,154.667L97.420,156.155L96.828,156.587L84.812,159.171L83.890,154.844L83.967,152.463L85.028,151.989L86.533,152.281L89.340,154.176L92.339,155.521ZM67.514,139.777L73.127,148.864L75.407,150.841L77.088,151.276L76.841,152.786L73.553,156.543L72.891,157.810L74.725,159.926L75.091,161.043L74.812,161.733L73.410,161.358L72.599,160.343L65.431,158.429L63.297,159.619L61.639,159.147L61.311,158.607L61.588,157.849L62.921,157.363L63.626,156.605L63.328,155.113L61.420,152.917L56.949,149.538L54.501,148.811L48.772,149.554L48.3