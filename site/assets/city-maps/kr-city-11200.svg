<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 동작구 2025 통계지역과 주변 경계"><title>서울특별시 동작구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11030" d="M246.524,79.504L221.804,67.302L195.773,48.567L172.759,39.333L173.234,5.421L170.839,0.000L320.000,0.000L320.000,43.552L296.678,58.190L281.624,82.356L264.866,82.792Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11170" d="M1.600,69.958L8.122,74.966L4.228,77.495L3.638,89.107L2.756,93.959L2.433,100.108L2.995,114.482L5.993,127.401L8.509,136.103L14.940,152.973L18.053,156.280L23.626,160.348L30.598,162.885L32.000,162.976L20.529,180.508L18.937,185.772L9.586,187.601L6.399,187.366L0.000,185.964L0.000,69.274Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11180" d="M5.209,187.109L9.586,187.601L18.937,185.772L20.529,180.508L24.148,184.392L51.538,178.410L48.779,184.106L48.770,186.297L50.752,188.823L54.265,189.230L57.208,189.002L58.133,193.788L57.200,199.039L55.027,205.470L51.833,207.572L46.821,209.948L48.038,212.012L52.469,223.459L56.922,232.761L59.272,235.116L59.374,236.381L63.333,237.902L61.945,240.000L0.000,240.000L0.000,185.964Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>