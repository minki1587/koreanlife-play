<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 속초시 2025 통계지역과 주변 경계"><title>강원특별자치도 속초시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32590" d="M0.911,14.611L10.580,8.609L18.976,0.000L42.306,0.000L48.631,9.542L50.736,11.915L54.477,13.075L56.555,15.214L54.027,29.287L58.295,33.665L59.600,44.606L54.434,54.795L54.407,55.916L56.680,65.451L61.462,74.740L58.371,79.448L55.806,85.168L55.827,86.852L53.476,90.581L47.329,94.877L43.280,96.486L41.116,96.807L39.975,98.342L35.873,106.455L32.000,117.572L43.665,127.095L48.219,130.237L50.626,135.838L53.379,139.420L56.775,141.843L55.673,146.658L56.045,152.150L61.840,161.164L63.068,162.025L65.715,161.558L70.864,164.210L75.889,169.203L77.879,174.895L78.665,176.170L79.742,177.100L91.950,182.889L92.644,184.365L91.698,190.337L92.158,194.555L91.725,198.097L91.087,199.630L92.518,209.528L92.719,213.399L91.305,213.065L86.449,210.569L82.328,210.128L78.051,213.864L76.614,216.947L73.716,219.395L68.021,219.149L60.468,220.982L55.623,225.906L51.387,228.350L44.359,230.310L43.276,230.446L36.376,229.380L31.142,227.535L22.648,226.800L22.102,227.329L20.896,231.100L22.245,236.955L23.282,238.676L22.948,240.000L0.000,240.000L0.000,14.731Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-32600" d="M253.700,7.695L253.118,20.437L250.715,22.068L247.294,25.516L247.355,29.024L246.856,30.347L246.302,30.150L241.669,32.562L239.854,35.472L239.057,37.581L233.526,41.673L231