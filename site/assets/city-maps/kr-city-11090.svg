<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 강북구 2025 통계지역과 주변 경계"><title>서울특별시 강북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M35.221,237.164L35.360,231.397L36.295,230.122L36.859,226.871L36.670,225.157L31.302,217.196L30.574,218.305L29.812,213.697L31.135,210.532L31.762,207.019L30.735,197.516L30.638,191.886L32.526,180.730L33.502,176.866L34.421,175.625L36.444,174.771L43.612,174.311L49.248,166.489L54.864,165.594L68.734,162.213L73.842,157.045L80.420,159.348L83.230,162.633L82.956,164.691L83.586,165.770L86.670,166.818L89.307,164.902L90.447,164.731L91.278,165.285L91.249,166.316L89.576,167.996L88.610,176.568L91.915,181.171L92.910,183.743L94.310,188.314L93.732,189.867L95.711,196.460L96.583,197.408L100.778,199.382L103.484,201.568L104.212,204.424L103.954,211.926L102.565,213.521L101.783,220.580L105.392,235.520L102.636,238.368L99.688,239.966L36.531,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11060" d="M230.768,236.440L232.888,235.137L234.276,239.361L250.373,234.026L251.850,230.330L255.000,226.031L260.297,224.560L262.849,224.708L267.849,222.083L267.585,215.905L269.122,215.889L273.830,222.260L275.790,233.280L275.261,236.632L273.467,240.000L229.059,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-ci