<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 수성구 2025 통계지역과 주변 경계"><title>대구광역시 수성구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22010" d="M10.707,65.632L9.198,54.129L17.498,46.475L19.547,43.231L18.946,42.900L19.171,37.883L16.340,39.506L14.365,39.698L12.239,37.266L12.164,35.194L14.357,30.419L17.213,32.284L18.699,32.332L17.058,30.367L16.189,23.294L46.306,29.889L46.384,32.089L53.804,31.644L63.241,34.914L66.291,35.055L68.750,34.541L73.611,32.656L76.621,35.039L81.601,47.177L78.888,53.068L71.581,62.239L70.555,65.634L70.198,70.364L70.817,76.075L53.226,75.075L50.612,73.485L46.356,72.805L34.158,72.577L25.447,73.582Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22020" d="M67.277,29.021L67.988,27.074L72.771,23.895L75.758,20.454L76.569,17.628L80.554,10.462L83.004,7.119L85.139,2.302L87.363,0.000L104.242,0.000L104.634,0.260L104.890,0.000L320.000,0.000L320.000,68.398L316.372,69.250L314.541,70.122L307.664,75.766L305.775,77.920L305.064,80.265L300.777,82.435L298.223,82.545L296.320,82.163L292.618,79.426L292.108,78.184L279.072,68.870L275.233,62.358L267.706,58.812L263.237,57.702L257.944,57.740L243.612,66.837L239.934,68.130L218.412,67.347L209.110,65.409L201.287,62.539L199.162,60.716L197.777,58.720L197.163,47.958L192.590,38.539L189.999,34.678L185.152,33.522L176.526,34.212L167.640,36.068L166.335,35.200L161.876,27.401L154.513,29.094L151.165,27.397L148.132,24.892L145.386,24.000L142.896,24.