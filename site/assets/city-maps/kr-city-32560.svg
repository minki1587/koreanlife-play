<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 철원군 2025 통계지역과 주변 경계"><title>강원특별자치도 철원군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31270" d="M44.571,239.298L45.590,237.704L46.108,235.936L45.739,234.763L44.608,233.930L40.982,235.500L39.886,235.592L39.076,235.239L38.110,233.936L35.908,234.205L33.913,233.328L35.730,231.598L35.773,230.788L34.048,228.625L32.884,225.911L34.187,222.003L35.413,219.928L36.342,219.426L38.187,219.312L38.776,219.439L39.777,220.568L41.635,219.772L44.523,216.750L46.244,216.203L46.289,214.488L46.974,213.017L47.738,212.135L49.033,211.573L51.080,214.135L50.331,218.639L50.630,220.967L51.594,221.903L53.409,221.216L55.825,218.231L57.123,218.229L59.771,219.546L60.634,219.573L62.988,216.878L64.443,216.294L66.133,216.534L69.483,217.973L71.036,217.605L70.600,212.534L70.866,211.199L73.170,208.917L73.962,205.903L73.319,203.998L71.893,202.660L70.014,199.576L68.867,189.789L69.763,187.829L69.946,185.188L69.117,183.735L66.004,181.664L64.089,181.518L63.445,180.527L64.809,178.989L65.618,175.834L65.464,171.805L64.739,168.439L64.180,167.559L64.519,166.498L66.149,164.349L66.392,161.114L65.845,159.625L65.598,156.286L64.750,154.879L65.103,150.488L64.599,149.612L64.694,148.383L64.952,147.342L66.623,145.217L67.590,139.621L68.966,139.242L71.959,137.303L73.242,136.915L72.094,139.721L70.972,147.221L72.972,155.180L75.792,157.661L77.400,158.310L79.559,159.927L82.267,164.002L84.098,164.175L84.933,166.449L89.263,170.190L90.195,167.728L89.985,164.206L91.342,163.336L94.477,164.108L95.426,163.920L96.040,163.475L98.376,159.246L102.191,156