<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 동구 2025 통계지역과 주변 경계"><title>인천광역시 동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23010" d="M10.018,211.251L8.112,217.488L0.945,230.400L3.634,234.317L40.514,222.703L75.343,240.000L0.000,240.000L0.000,208.849ZM92.525,240.000L71.345,229.417L71.175,228.921L72.791,225.729L49.263,214.044L48.970,199.561L49.392,194.669L51.126,192.954L58.164,183.502L55.039,181.788L42.128,146.028L32.183,149.350L36.822,162.261L30.057,164.373L25.418,151.258L19.881,153.171L31.629,187.252L23.421,197.492L13.216,202.439L3.525,206.096L0.000,205.318L0.000,114.076L5.143,108.494L17.027,96.926L24.740,94.311L31.964,114.772L9.739,123.172L11.907,129.137L40.923,119.033L46.701,135.640L47.706,136.195L49.819,135.291L44.045,117.859L61.006,111.616L75.871,127.165L84.541,124.442L88.201,124.197L91.894,124.666L95.322,125.841L98.356,127.552L107.738,134.993L107.956,133.939L122.084,147.899L143.845,174.480L154.337,182.447L169.317,192.052L166.336,196.784L166.465,210.161L153.882,218.108L148.138,231.202L147.071,236.830L145.077,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23080" d="M288.000,144.214L257.195,115.112L214.635,83.047L183.675,62.035L162.139,47.948L163.320,30.687L162.267,30.686L158.874,12.751L159.025,5.970L164.042,0.085L158.417,1.747L151.038,1.599L137.674,2.920L134.451,8.528L126.227,11.373L116.138,13.317L115.938,28.108L103.674,40.345L9.767,41.590L9.468,0.000L