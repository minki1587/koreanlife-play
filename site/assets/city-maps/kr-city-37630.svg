<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상북도 울릉군 2025 통계지역과 주변 경계"><title>경상북도 울릉군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="selected" data-city-id="kr-city-37630" d="M287.743,159.841L288.000,160.337L287.634,160.889L287.319,160.263ZM286.093,160.224L286.128,159.627L286.582,159.177L286.939,159.892L286.586,160.376ZM52.032,107.473L50.744,105.840L50.071,105.532L49.336,105.287L47.772,105.649L46.285,104.530L44.029,104.803L43.537,104.109L42.410,103.712L41.860,103.889L40.724,102.148L37.644,101.793L36.928,101.345L36.259,99.410L34.855,98.639L34.606,97.015L35.234,94.326L34.544,93.807L35.302,92.723L34.196,92.123L33.127,90.195L32.391,89.871L32.012,88.516L32.567,87.693L32.118,87.117L34.139,87.053L34.392,88.267L35.019,88.360L35.417,87.754L37.337,87.343L39.810,85.017L40.768,85.170L39.901,85.194L39.574,85.747L40.760,86.016L44.768,83.347L47.314,83.556L49.928,82.909L51.908,80.974L52.810,80.904L55.584,81.644L56.301,81.154L56.862,79.804L58.819,79.112L59.581,79.779L59.547,80.534L60.043,81.285L61.824,81.060L62.163,81.435L60.398,82.379L60.220,82.710L60.475,82.975L59.420,85.124L60.299,87.351L61.518,87.888L61.987,89.402L61.717,91.083L61.214,91.553L61.425,92.499L60.953,97.178L62.563,97.146L62.748,97.826L61.471,98.620L60.470,98.492L59.874,99.100L60.092,99.470L59.468,100.360L58.376,100.893L56.973,100.708L54.121,102.209L52.614,104.364L53.240,105.148L52.421,104.775ZM66.465,85.952L65.837,84.950L66.399,83.969L67.074,84.422L66.937,85.689ZM62.456,81.035L61.979,80.561L62.933,79.964L63.120,80.627Z" fill="#c8d8b8" fill-rule="evenodd" stroke="#000" stroke-width="1.8" stroke-linejoin="round" s