<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 동대문구 2025 통계지역과 주변 경계"><title>서울특별시 동대문구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M0.000,88.799L4.982,88.719L7.369,90.781L8.446,93.396L7.637,97.859L9.723,101.563L13.060,104.692L15.454,106.280L15.345,108.852L15.761,109.646L20.821,110.361L22.647,113.416L25.082,124.821L29.703,135.559L33.182,136.528L34.780,136.042L39.996,131.513L41.995,132.254L45.185,130.749L47.855,128.744L52.129,130.271L53.130,130.267L54.352,131.465L56.851,138.675L58.061,145.032L60.364,147.113L72.021,144.954L74.063,145.178L74.560,169.726L60.441,172.596L56.380,175.276L51.697,177.072L7.101,177.743L0.000,179.449Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11020" d="M7.101,177.743L51.697,177.072L56.380,175.276L60.441,172.596L74.560,169.726L75.196,195.323L84.773,196.069L84.758,200.382L83.369,203.836L74.844,212.609L74.239,212.551L72.701,223.745L61.884,225.128L62.169,225.751L57.630,228.392L55.778,231.003L53.063,240.000L0.000,240.000L0.000,179.449Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11040" d="M55.778,231.003L57.630,228.392L62.169,225.751L61.884,225.128L72.701,223.745L74.239,212.551L74.844,212.609L83.369,203.836L84.758,200.382L84.773,196.069L75.196,195.323L74.560,169.726L96.189,17