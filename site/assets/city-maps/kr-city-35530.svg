<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 무주군 2025 통계지역과 주변 경계"><title>전북특별자치도 무주군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-33540" d="M231.062,44.054L229.129,45.568L223.624,46.511L219.857,48.174L215.932,51.419L205.621,52.663L204.176,53.552L198.756,60.915L196.453,59.639L195.155,59.616L191.895,60.411L188.344,62.293L186.761,62.520L184.103,61.761L182.553,60.450L184.927,56.123L185.043,54.835L184.555,53.719L183.837,53.272L182.883,53.192L180.643,54.185L179.113,53.808L176.476,50.622L174.019,51.380L173.724,53.592L173.262,53.891L172.356,53.705L171.791,53.289L170.239,49.604L168.914,48.765L167.864,48.667L166.468,48.911L165.478,49.910L165.161,50.991L165.295,52.879L163.785,51.914L162.765,49.464L160.846,49.913L159.239,47.205L156.403,46.516L152.575,47.729L150.965,46.666L149.957,45.749L149.588,44.240L147.817,42.565L147.020,39.012L147.269,34.459L147.940,32.269L147.102,31.198L147.107,30.590L144.899,30.588L143.399,27.750L141.328,28.592L139.236,30.914L133.519,35.243L134.018,37.633L133.722,40.953L134.539,42.512L132.639,44.583L131.079,45.571L128.047,44.859L127.248,43.812L127.462,41.944L124.178,32.177L121.439,31.086L121.149,27.886L118.974,25.221L115.100,24.000L113.287,19.327L112.292,14.895L107.330,9.047L105.311,8.694L104.445,7.311L104.068,5.850L103.989,0.000L297.680,0.000L296.070,2.389L296.300,3.423L296.001,4.322L293.178,5.266L293.684,10.138L295.393,13.540L295.239,23.425L292.301,23.882L290.450,25.215L289.222,28.647L287.068,31.528L284.257,33.063L281.086,35.643L278.753,35.956L275.665,33.889L270.608,33.126L268.057,35.724L266.668,36.115L264.55