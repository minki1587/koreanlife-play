<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상남도 밀양시 2025 통계지역과 주변 경계"><title>경상남도 밀양시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21110" d="M312.585,239.986L312.644,239.957L313.310,239.722L313.380,239.706L313.441,239.701L313.490,239.708L313.550,239.737L315.136,239.752L316.004,239.670L316.668,239.669L317.144,239.338L317.250,239.264L320.000,237.972L320.000,240.000L312.561,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22510" d="M21.258,0.565L21.459,3.582L22.314,4.391L18.666,4.237L16.918,4.756L14.808,6.103L13.906,7.987L13.248,8.492L9.806,9.255L8.989,10.071L8.907,10.856L9.912,12.811L8.771,24.706L10.753,26.946L10.402,29.202L7.953,31.756L4.194,31.800L0.000,33.440L0.000,0.000L21.533,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-26510" d="M319.945,122.297L319.517,120.749L319.705,118.562L318.313,117.201L317.381,116.990L316.008,117.746L314.575,116.716L313.595,116.750L313.318,117.192L311.468,116.709L309.189,114.468L301.180,112.137L296.304,109.860L291.254,105.973L291.750,99.884L293.482,98.795L293.532,96.221L293.037,95.577L284.085,98.699L276.249,100.338L275.660,100.131L273.111,101.187L270.869,101.604L268.829,101.114L269.212,98.570L263.402,98.544L261.426,98.056L261.360,96.905L262.373,92.703L263.195,91.478L262