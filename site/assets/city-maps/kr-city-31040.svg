<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 안양시 2025 통계지역과 주변 경계"><title>경기도 안양시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11180" d="M140.128,45.069L137.217,47.731L135.542,49.875L133.931,54.260L131.833,57.166L128.746,57.967L124.205,56.982L120.052,52.193L115.908,48.515L115.093,47.148L114.837,46.107L115.458,45.511L115.506,42.545L114.549,36.720L114.091,35.094L110.654,32.616L108.994,27.295L108.591,22.301L107.379,18.605L104.997,20.074L100.067,19.153L96.083,12.493L94.793,11.194L93.031,3.225L95.341,1.356L96.894,1.051L98.585,1.671L99.271,0.814L99.221,0.000L139.089,0.000L140.413,7.583L141.529,8.465L147.395,9.542L154.057,9.407L154.315,12.920L155.197,15.222L161.545,20.900L164.281,24.000L163.602,25.033L158.670,29.474L155.996,31.256L153.339,34.277L151.634,36.419L149.686,42.146L148.859,43.301L146.590,45.104L141.250,44.654Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11210" d="M161.545,20.900L155.197,15.222L154.315,12.920L154.057,9.407L147.395,9.542L141.529,8.465L140.413,7.583L139.089,0.000L261.509,0.000L260.806,3.514L261.077,5.590L262.673,8.207L252.355,14.282L238.522,29.773L233.313,30.028L223.029,33.618L221.806,36.637L222.253,40.241L221.726,43.748L220.436,44.675L215.434,44.756L214.224,46.934L207.650,48.144L203.294,46.853L200.713,48.466L196.115,48.224L190.670,51.249L184.903,50.443L182.926,53.911L180.345,53.226L178.127,48.265L179.095,44.716L175.061,39.190L167.116,34.108L166.712