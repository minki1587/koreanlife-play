<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 횡성군 2025 통계지역 경계 실루엣"><title>강원특별자치도 횡성군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M228.259,184.329L227.404,185.306L227.340,186.306L227.671,188.042L228.834,189.801L230.146,195.639L231.301,205.390L230.085,206.556L228.750,206.496L226.179,207.596L223.746,206.828L222.893,208.060L225.204,212.845L225.412,215.174L224.915,216.116L222.950,216.700L219.338,215.720L217.734,214.881L216.527,213.393L214.631,213.879L213.003,216.303L210.956,214.636L208.657,214.264L206.453,212.435L205.820,212.583L201.040,215.607L200.762,217.353L198.675,219.858L198.702,223.491L200.285,226.846L198.736,227.540L198.622,228.000L196.732,227.030L193.601,226.914L192.188,227.440L189.132,227.182L186.135,225.976L182.717,225.347L180.993,223.412L179.404,222.992L174.585,222.694L172.639,223.109L168.349,218.251L167.003,217.292L166.033,215.355L165.538,212.934L164.629,212.253L164.429,210.607L164.097,210.697L163.577,209.593L165.416,206.543L166.179,203.175L165.082,201.199L165.349,197.623L167.931,193.220L169.224,191.739L172.122,191.828L174.061,191.108L178.092,191.278L179.377,190.765L181.284,185.908L180.659,181.217L179.140,178.339L179.013,176.299L181.529,172.830L184.775,170.368L187.330,170.029L190.821,168.324L189.234,165.351L187.426,164.714L185.803,162.516L182.863,156.128L177.929,151.669L175.577,151.353L175.116,150.349L175.328,147.865L173.829,145.490L169.763,146.754L165.260,146.464L164.276,145.482L161.501,144.150L159.313,143.667L157.888,144.012L156.395,144.979L153.074,145.883L152.568,145.006L149.194,144.480L148.744,141.397L147.942,140.138L142.850,140.441L140.724,138.960L138.734,140.004L135.636,139.147L133.300,141.698L130.032,1