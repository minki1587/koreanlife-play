<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 종로구 2025 통계지역과 주변 경계"><title>서울특별시 종로구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11020" d="M105.105,237.938L101.545,235.979L102.896,234.811L106.785,234.576L114.044,228.966L120.244,226.958L113.823,216.000L116.690,212.006L119.093,209.097L131.259,206.082L135.037,205.888L150.475,207.261L159.448,209.266L164.732,209.598L182.672,207.958L194.010,205.471L227.084,204.973L230.558,203.642L233.569,201.654L244.040,199.525L244.512,218.509L251.615,219.062L251.604,222.261L250.574,224.823L244.251,231.329L243.803,231.286L242.662,239.588L240.471,240.000L105.379,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11040" d="M242.662,239.588L243.803,231.286L244.251,231.329L250.574,224.823L251.723,221.087L251.615,219.062L244.512,218.509L244.040,199.525L260.081,205.154L264.578,204.238L271.020,199.031L277.531,196.346L287.311,196.040L302.158,205.224L320.000,222.100L320.000,240.000L240.471,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11060" d="M287.311,196.040L277.531,196.346L271.020,199.031L264.578,204.238L260.081,205.154L244.040,199.525L243.672,181.320L246.688,177.997L258.295,167.865L274.236,147.151L274.484,143.332L280.401,143.291L284.352,130.224L290.720,127.060L300.203,12