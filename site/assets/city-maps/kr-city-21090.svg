<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 해운대구 2025 통계지역과 주변 경계"><title>부산광역시 해운대구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21030" d="M2.652,228.645L5.249,228.313L8.895,229.336L17.386,229.387L19.978,237.562L19.800,240.000L0.000,240.000L0.000,228.450Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21050" d="M0.067,149.763L4.146,149.439L11.131,150.394L11.931,157.154L12.501,157.534L13.613,160.022L13.845,161.973L14.668,162.541L20.712,163.254L21.389,163.868L25.214,165.170L27.712,161.218L27.609,158.147L33.221,162.305L36.974,165.787L43.142,172.494L43.258,173.422L41.559,179.969L39.274,182.004L38.630,183.754L38.216,189.932L41.910,194.909L43.672,195.313L45.079,197.599L44.079,198.994L40.744,206.792L40.571,207.984L37.436,209.437L27.653,215.481L20.694,217.438L15.416,215.831L15.111,216.782L15.357,225.388L17.386,229.387L8.895,229.336L5.249,228.313L2.652,228.645L0.000,228.450Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M8.901,136.638L2.583,134.743L0.000,135.151L0.000,89.073L2.579,85.042L4.791,78.226L5.206,77.295L6.987,75.751L8.362,71.663L9.035,71.132L11.436,70.490L17.370,70.311L17.956,71.030L18.056,73.233L21.557,73.575L25.695,71.300L34.766,71.007L39.723,75.617L41.567,74.326L46.483,79.047L49.811,79.503L46