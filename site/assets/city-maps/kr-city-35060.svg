<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 김제시 2025 통계지역과 주변 경계"><title>전북특별자치도 김제시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-35010" d="M320.000,141.720L319.083,144.440L319.572,145.894L315.514,144.676L313.627,144.745L311.969,146.734L309.482,148.791L306.693,149.181L305.755,151.337L304.409,151.847L303.592,151.712L304.183,150.696L302.295,150.665L301.263,153.314L294.209,151.296L292.570,151.258L288.683,156.446L288.174,162.479L287.603,163.104L285.750,163.274L282.261,167.708L281.865,169.140L279.749,168.221L279.365,165.247L277.730,162.960L274.769,160.752L273.695,160.643L273.172,159.914L272.738,154.710L269.438,152.562L267.641,149.875L266.745,147.054L266.245,146.514L262.182,146.303L261.299,145.560L262.208,144.820L263.092,142.728L265.321,141.695L267.290,141.392L269.168,140.262L270.686,137.530L272.884,135.711L274.964,135.130L275.376,134.157L273.454,128.703L271.353,126.308L269.600,125.664L269.337,124.000L270.352,122.798L269.490,117.390L269.883,113.334L271.248,112.407L271.362,111.874L271.385,104.544L270.160,101.374L268.748,99.672L267.757,99.983L264.785,97.898L264.016,95.671L261.206,93.635L261.737,90.153L265.890,90.439L265.948,86.437L264.557,85.773L263.827,84.285L260.625,76.235L260.648,74.682L255.205,75.844L253.898,76.238L253.242,76.898L250.964,77.000L248.073,74.673L247.059,74.728L245.747,72.161L246.808,71.667L247.560,69.104L245.714,66.422L241.948,67.875L240.548,69.267L240.041,70.555L233.521,68.408L234.246,62.083L234.200,57.377L228.723,51.823L231.244,47.762L230.450,45.127L239.383,43.089L241.915,44.248L243.104,44.191L247.668,41.552L2