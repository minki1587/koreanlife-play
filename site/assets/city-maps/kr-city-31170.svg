<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 의왕시 2025 통계지역과 주변 경계"><title>경기도 의왕시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11220" d="M270.472,0.006L270.457,0.000L270.473,0.000ZM264.533,0.765L264.222,1.308L264.112,1.499L264.102,1.563L264.075,1.741L263.885,1.719L263.680,1.696L262.732,1.509L262.221,1.409L260.716,0.559L259.017,0.338L255.661,0.000L265.373,0.000ZM249.273,0.995L244.332,0.569L243.628,0.000L252.968,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31010" d="M80.814,239.997L83.244,236.324L85.401,230.967L93.888,225.402L94.229,224.826L93.973,222.148L88.797,220.256L84.973,215.660L85.230,211.966L87.883,211.815L97.018,215.292L111.343,216.000L112.178,213.518L114.055,211.839L123.109,213.858L127.012,209.856L130.227,203.448L130.691,195.337L132.113,190.505L135.198,188.870L133.526,185.299L131.134,178.269L131.171,176.858L136.251,166.875L136.931,163.976L140.060,166.687L149.918,172.752L152.383,172.508L158.198,168.014L162.554,161.811L164.000,160.399L176.150,152.956L183.707,153.706L184.261,152.786L187.702,152.514L187.743,151.106L188.788,150.036L190.200,145.119L192.462,141.917L192.581,138.993L193.405,137.411L195.162,135.201L196.878,134.183L199.389,133.655L200.388,133.062L200.796,131.188L209.164,136.291L210.806,136.177L214.098,137.934L218.329,141.591L220.311,142.772L218.455,146.654L217.702,151.948L217.697,155.665L222.122,160.231L223.658,163.425L223.550,165.752L224.752,168