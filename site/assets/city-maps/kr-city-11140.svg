<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 마포구 2025 통계지역과 주변 경계"><title>서울특별시 마포구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M300.164,103.710L294.841,110.684L264.364,72.338L268.775,72.088L269.458,71.118L269.594,66.959L272.411,64.484L275.355,64.168L276.534,64.406L280.924,66.825L274.524,57.994L272.226,53.287L274.686,43.457L273.789,32.135L271.078,24.889L271.027,23.393L273.005,15.454L272.071,14.639L271.188,14.645L270.677,15.234L265.945,14.935L264.597,13.271L262.856,9.504L263.017,2.827L263.949,1.906L264.359,0.000L320.000,0.000L320.000,100.769L312.453,100.665Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11020" d="M318.777,142.368L317.800,142.233L317.437,142.707L317.204,147.750L317.588,148.996L307.635,144.030L299.985,145.429L298.654,141.083L292.201,144.758L284.414,152.323L282.860,148.047L282.889,141.112L283.696,141.165L286.148,137.979L286.434,135.859L286.035,132.844L282.438,130.865L283.803,129.685L287.731,129.448L295.064,123.781L301.326,121.752L294.841,110.684L300.164,103.710L312.453,100.665L320.000,100.769L320.000,143.243Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11030" d="M254.411,224.363L252.095,219.121L242.951,203.881L243.927,200.435L246.994,198.098L250.280,198.466L258.423,196.553L261.962,