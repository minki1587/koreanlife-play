<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 연천군 2025 통계지역과 주변 경계"><title>경기도 연천군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31080" d="M181.703,239.513L180.900,233.726L176.714,232.608L173.607,231.010L171.792,231.549L170.324,230.114L166.817,228.730L166.083,228.052L166.033,224.962L164.941,221.895L166.987,220.636L166.917,219.530L166.263,219.235L165.441,217.205L165.868,215.878L166.386,216.000L166.935,215.555L168.694,211.125L170.286,209.326L172.124,209.141L173.226,207.704L173.729,203.000L173.408,202.270L173.739,201.379L178.121,199.997L179.206,198.854L180.539,193.590L180.336,192.399L180.909,191.410L182.217,190.566L182.184,188.936L184.042,187.634L188.682,188.574L188.273,190.456L189.383,190.853L195.261,190.143L197.091,190.707L200.402,193.231L201.066,194.736L200.451,196.932L200.386,199.361L201.184,200.436L203.161,201.823L203.104,202.940L201.620,204.747L201.804,207.579L206.785,210.002L207.391,211.884L209.782,215.698L212.117,221.650L214.713,222.381L215.554,222.024L217.101,222.253L218.049,223.628L219.569,223.261L222.570,224.412L223.351,227.175L222.873,229.189L224.349,230.368L224.088,231.767L226.585,232.959L223.697,240.000L182.225,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31200" d="M28.661,239.980L27.361,239.176L27.984,237.844L27.790,237.552L26.434,237.539L26.067,239.101L24.774,238.818L24.688,238.358L25.588,237.509L25.598,236.853L23.806,235.747L24.661,235.370L26.863