<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 영도구 2025 통계지역과 주변 경계"><title>부산광역시 영도구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M73.621,43.182L71.261,42.135L66.557,41.102L51.062,43.510L44.148,45.660L43.574,46.192L37.276,29.916L28.969,23.222L27.902,18.051L31.815,0.000L88.724,0.000L99.071,7.654L96.631,10.972L86.202,3.296L84.595,7.744L96.529,16.606L92.225,22.241L85.314,18.782L81.825,16.297L84.236,13.141L79.812,13.377L79.088,15.083L79.780,36.972L80.265,38.875L84.245,47.255L83.634,47.729L80.204,40.681L74.425,42.950L76.387,49.243L75.610,49.475Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21020" d="M11.701,227.466L8.069,224.564L7.941,223.525L8.306,219.118L8.551,216.878L10.007,215.375L12.296,216.149L14.177,219.040L14.777,223.010L14.604,224.123L13.432,225.210L14.893,225.792L15.365,226.436L15.237,227.433L14.523,228.419L13.337,228.141ZM33.680,123.171L32.322,123.606L31.394,122.728L31.925,120.581L30.207,115.181L28.641,113.417L26.884,113.469L24.185,114.000L20.632,115.768L19.051,117.001L14.875,122.277L13.462,125.264L17.263,134.188L23.278,139.817L28.922,146.001L33.441,170.400L31.815,176.170L22.728,182.512L14.241,190.833L13.060,198.811L14.883,199.352L15.511,200.460L15.480,201.712L14.322,205.128L12.715,206.945L0.000,211.897L0.000,167.972L0.366,167.909L1.798,161.493L0.000,160.206L0.000,98.133L2.642,81.873L4.143,75.030L6.653,70.903L7.762,62.327L7.298,56.022L6.809,54.247L2.