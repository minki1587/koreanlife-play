<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 성동구 2025 통계지역과 주변 경계"><title>서울특별시 성동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M80.633,1.586L83.214,3.919L96.282,1.499L98.571,1.750L99.127,29.268L83.300,32.486L78.748,35.490L73.498,37.503L51.184,37.562L41.097,38.104L23.506,38.256L11.935,41.036L0.000,42.620L0.000,0.000L80.331,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11020" d="M26.735,125.559L18.281,125.918L14.297,124.226L12.272,124.039L1.081,135.742L0.000,134.568L0.000,42.620L11.935,41.036L23.506,38.256L41.097,38.104L51.184,37.562L73.498,37.503L78.748,35.490L83.300,32.486L99.127,29.268L99.841,57.963L110.577,58.799L110.740,61.859L110.560,63.635L109.003,67.506L99.446,77.342L98.768,77.276L97.044,89.825L84.918,91.375L85.238,92.073L82.188,93.578L79.716,95.404L78.073,97.961L74.164,110.914L57.904,130.478L54.502,132.352L47.192,150.209L42.502,150.923L34.159,140.524L35.833,133.410L37.862,131.713L33.767,131.068L32.646,127.399L32.708,125.312L32.109,122.204Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11030" d="M1.081,135.742L12.272,124.039L14.297,124.226L18.281,125.918L26.735,125.559L32.109,122.204L32.708,125.312L32.646,127.399L33.767,131.068L37.862,131.713L35.833,133.410L34.159,140.524L42.502,150