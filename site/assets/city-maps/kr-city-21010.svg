<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 중구 2025 통계지역과 주변 경계"><title>부산광역시 중구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21020" d="M31.509,230.972L30.390,226.913L28.187,222.648L21.021,212.222L13.047,197.057L4.204,181.983L1.819,178.964L0.000,178.758L0.000,130.116L3.430,125.827L0.000,120.627L0.000,0.000L102.487,0.000L100.169,12.262L100.544,13.832L103.570,19.448L105.449,22.062L116.858,35.998L125.614,38.182L128.045,62.292L123.514,76.946L118.384,82.355L114.066,77.334L89.819,95.755L85.898,108.168L78.626,144.140L81.067,155.964L97.704,168.889L100.062,171.272L102.322,175.711L106.661,188.291L114.465,208.492L108.066,227.161L109.626,240.000L32.174,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21030" d="M196.169,68.317L160.637,39.128L156.827,35.033L125.710,24.041L122.876,24.000L111.170,29.007L103.570,19.448L100.152,12.759L102.487,0.000L273.255,0.000L279.323,5.302L297.593,19.007L297.702,33.596L262.748,7.536L255.054,28.087L284.462,49.621L277.322,58.775L249.482,38.504L243.887,36.288L227.983,78.736L208.920,73.053ZM299.783,0.000L320.000,0.000L320.000,15.451Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21040" d="M151.020,237.171L150.532,234.620L150.447,228.488L152.464,221.895L163.021,218.886L165.137,220.490L1