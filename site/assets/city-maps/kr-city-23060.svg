<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 부평구 2025 통계지역과 주변 경계"><title>인천광역시 부평구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-23020" d="M2.716,157.016L15.943,169.551L18.705,172.314L17.332,175.341L2.330,165.698L0.000,164.181L0.000,154.624Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23050" d="M78.882,240.000L79.360,234.391L80.886,229.479L86.087,226.416L75.058,215.192L74.681,212.601L59.209,210.210L60.444,201.271L53.013,199.387L57.447,191.359L63.227,195.459L69.438,195.959L71.034,196.476L74.480,199.076L76.353,198.258L87.206,204.363L101.892,205.040L105.169,203.608L105.291,203.048L110.572,200.445L114.054,200.554L114.320,195.113L121.983,167.233L124.439,174.617L126.332,177.727L130.726,177.327L134.653,177.777L135.777,178.379L138.907,180.983L144.424,186.881L152.156,196.728L152.539,197.824L154.166,198.555L163.265,197.800L164.718,196.361L166.615,192.811L170.408,191.079L172.467,190.667L174.116,190.966L176.954,193.741L185.700,196.290L188.155,195.695L192.921,196.130L201.864,201.857L209.362,211.211L209.971,212.290L210.012,214.197L212.353,216.000L216.312,213.128L219.264,212.693L221.858,212.912L226.147,214.763L229.650,214.946L234.289,213.211L238.874,206.208L240.614,202.093L244.404,200.864L255.370,198.755L261.049,199.188L265.208,199.943L268.615,193.921L278.496,193.721L279.322,192.070L282.116,192.261L286.244,195.182L287.903,194.277L290.205,194.483L292.808,192.657L294.523,193.904L2