<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경상남도 의령군 2025 통계지역과 주변 경계"><title>경상남도 의령군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-38030" d="M0.000,192.819L3.587,193.221L5.503,192.913L7.514,190.732L9.104,190.010L10.507,187.992L11.288,185.027L15.451,183.701L16.760,180.734L19.258,180.655L21.793,179.381L28.243,177.436L28.950,178.291L32.257,180.365L34.792,178.647L38.818,173.759L39.012,172.160L38.615,169.593L37.492,167.977L38.624,165.517L41.449,162.146L42.464,158.840L46.769,159.033L47.624,159.569L49.029,159.588L51.347,158.893L51.794,158.106L51.755,157.059L55.040,156.446L63.480,157.606L67.809,157.459L71.212,159.914L74.218,159.945L76.146,161.046L80.976,158.959L84.480,156.573L86.287,154.784L86.623,153.024L89.319,152.062L90.613,150.131L93.425,148.174L97.719,146.778L98.851,145.887L100.152,146.829L101.226,149.717L101.988,150.652L104.372,152.310L104.675,156.604L109.456,162.391L110.560,162.755L113.091,166.391L113.384,168.251L112.621,170.337L110.656,171.970L109.852,176.756L111.159,181.347L112.551,183.074L112.602,184.198L110.767,186.571L110.951,188.244L112.252,190.764L114.151,192.816L114.032,194.556L113.411,195.723L114.408,197.511L117.066,200.280L118.491,200.226L119.084,200.624L120.122,202.461L120.693,205.901L123.229,206.947L123.488,210.779L122.462,213.276L122.691,213.993L125.773,215.915L126.730,215.988L129.472,209.167L131.549,207.895L133.260,207.680L134.006,208.019L134.904,209.288L137.138,207.757L139.628,209.055L141.226,210.570L143.441,214.094L146.544,215.451L149.525,215.770L154.443,215.615L161.171,213.018L168.696,213.802L169.287,213.745L170.