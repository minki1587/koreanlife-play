<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전라남도 구례군 2025 통계지역과 주변 경계"><title>전라남도 구례군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-35050" d="M117.463,36.039L115.992,38.990L113.673,41.868L113.361,44.467L110.091,47.332L109.139,48.703L109.314,49.980L108.634,50.783L105.250,53.092L104.407,55.128L104.984,56.757L103.949,61.739L103.463,62.562L102.267,63.430L100.877,63.446L98.786,65.294L96.869,67.738L95.300,68.553L92.881,67.659L91.100,63.216L89.570,62.002L87.572,60.550L85.225,60.574L82.463,58.714L80.636,56.339L78.927,55.782L75.794,56.317L74.070,57.524L65.924,59.945L64.199,60.143L63.647,61.156L63.929,62.265L63.331,62.999L59.975,64.446L60.241,66.244L51.199,68.590L49.513,68.606L49.050,68.230L48.749,66.851L47.211,64.879L41.735,61.501L39.511,60.736L29.475,61.535L26.010,61.030L23.388,62.504L21.189,61.860L18.476,59.979L17.415,57.579L8.521,49.633L7.954,47.430L6.997,45.934L2.424,44.723L1.345,44.671L0.000,45.224L0.000,9.489L1.434,4.680L3.083,0.993L3.843,0.452L6.559,1.266L11.224,0.339L14.465,0.912L15.382,0.000L241.147,0.000L238.687,5.739L235.336,10.270L234.795,16.599L233.508,18.981L232.015,20.236L227.746,22.097L226.512,23.884L227.257,27.146L227.040,28.714L227.558,31.220L229.742,35.318L232.445,37.222L233.805,39.717L233.754,43.653L232.733,46.001L232.395,47.957L229.160,49.211L225.263,52.935L223.745,57.440L216.599,62.433L212.223,64.412L208.512,64.089L207.448,64.547L204.658,62.361L201.654,57.579L197.404,55.809L194.619,55.324L192.694,53.080L187.906,51.307L186.917,50.264L186.507,47.056L186.062,46.516L182.232,45.712L180.183,44.484L176.817,39.087L175.410,38