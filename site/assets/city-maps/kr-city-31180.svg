<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 하남시 2025 통계지역과 주변 경계"><title>경기도 하남시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11050" d="M0.000,56.242L3.915,56.537L4.203,57.700L5.063,57.539L6.197,58.297L7.705,58.517L9.077,58.041L9.478,57.199L10.326,57.356L11.895,56.909L19.830,52.318L20.703,53.888L22.601,54.311L23.633,55.233L23.863,56.346L22.806,58.447L19.948,72.103L20.009,73.490L29.736,73.843L31.049,75.983L32.849,75.318L35.717,75.335L35.831,84.023L32.897,94.679L22.401,113.160L17.069,123.633L16.021,124.247L8.708,125.424L6.445,126.639L0.000,128.705Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11070" d="M19.830,52.318L11.417,57.122L9.478,57.199L9.077,58.041L7.654,58.523L6.197,58.297L5.063,57.539L4.203,57.700L3.915,56.537L0.000,56.242L0.000,0.000L41.723,0.000L41.289,3.896L36.059,11.091L36.219,11.941L41.670,18.853L40.989,20.430L36.109,21.446L34.225,23.752L31.388,30.696L30.356,34.995L26.253,35.134L22.060,35.836L18.425,37.467L22.172,39.499L22.029,44.908Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11220" d="M0.798,213.632L3.965,217.226L9.669,223.003L10.508,223.646L11.729,224.167L12.942,225.984L13.053,226.407L13.262,227.325L13.336,227.654L12.771,228.231L12.192,229.436L11.211,231.790L11.605,232.350L11.824,232.546L