<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 삼척시 2025 통계지역 경계 실루엣"><title>강원특별자치도 삼척시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M152.644,169.178L149.375,169.238L148.325,168.426L148.390,166.067L147.338,164.368L142.096,163.857L139.136,164.381L137.418,162.539L129.686,162.140L128.977,160.866L125.559,159.105L123.655,157.145L122.142,153.343L122.015,150.650L121.489,149.856L119.678,148.976L118.539,149.232L116.984,145.904L117.883,141.355L122.802,139.310L120.974,137.149L121.099,136.222L121.739,135.374L121.504,134.866L119.064,134.299L118.213,134.451L116.644,133.597L114.188,129.332L114.462,128.587L115.883,127.701L117.153,128.503L118.432,128.585L119.192,127.704L118.744,127.193L118.843,124.192L120.463,124.468L121.198,123.032L122.190,123.341L121.942,122.184L120.137,119.732L119.987,118.782L121.195,115.078L123.623,113.454L122.996,110.575L121.381,108.916L120.651,108.743L119.492,106.213L120.122,104.258L125.175,98.748L124.982,97.916L124.037,97.485L121.912,94.689L121.024,94.440L119.611,93.243L118.755,91.655L116.879,90.823L117.050,87.753L120.836,83.704L122.127,83.339L123.350,81.555L121.606,80.652L121.394,79.850L121.722,79.224L121.096,78.190L120.156,77.765L119.067,78.226L117.665,80.522L114.399,79.183L112.383,79.679L108.122,82.995L106.131,85.347L104.487,85.341L103.277,86.080L101.016,89.979L100.602,91.918L99.738,93.109L98.515,96.502L95.606,97.830L95.060,102.219L96.650,105.727L94.844,106.446L93.862,109.050L94.790,110.154L94.634,111.175L93.002,113.667L92.102,114.042L90.513,113.316L88.817,113.684L88.173,114.357L90.099,116.963L91.109,120.669L92.209,122.683L92.611,127.653L90.526,130.190L88.152,129.240L85.834,130.657L86.009,132.416L85.549,133.95