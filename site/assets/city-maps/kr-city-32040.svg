<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 동해시 2025 통계지역과 주변 경계"><title>강원특별자치도 동해시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32030" d="M5.759,43.733L4.488,45.503L2.433,43.830L1.055,44.166L0.000,46.387L0.000,0.000L149.695,0.000L151.376,2.647L156.032,2.706L161.841,6.060L161.495,6.551L155.675,3.218L152.885,3.418L153.183,7.901L157.620,8.889L158.173,9.388L160.743,14.684L169.322,24.000L167.336,25.981L166.209,26.172L161.648,28.795L160.107,30.628L159.191,32.962L156.437,33.632L154.377,33.419L153.889,36.152L154.844,37.360L155.976,37.570L156.810,38.671L158.260,41.124L158.241,42.721L156.471,44.775L155.828,48.230L150.942,56.006L151.462,59.069L150.971,65.902L150.364,67.418L149.308,68.668L148.899,75.281L150.279,79.459L148.761,84.577L148.974,86.793L148.111,87.881L147.398,88.387L142.808,87.413L141.785,85.867L139.732,85.789L134.973,87.097L130.448,89.000L127.658,94.606L124.487,96.917L122.369,95.453L119.826,94.341L107.389,92.315L104.568,93.754L101.216,96.401L97.799,101.848L92.961,102.808L91.612,102.774L89.013,101.677L85.560,102.275L84.909,100.367L76.557,92.239L76.245,89.923L76.988,88.397L75.026,86.264L73.616,86.660L74.035,88.267L73.820,89.549L70.005,94.586L66.871,95.384L63.842,94.154L61.921,94.597L60.519,95.485L59.943,96.399L60.014,98.345L58.258,99.219L52.910,98.184L50.548,96.844L45.820,91.432L44.364,88.957L42.130,88.245L37.106,87.755L35.574,85.400L35.736,84.472L35.365,83.456L34.173,82.688L33.049,82.529L28.438,83.251L27.479,79.864L27.995,77.672L28.028,73.580L27.056,70.626L27.126,68.835L27.951,67.543L27.316,64.740L26.324,62.947L24.088,60