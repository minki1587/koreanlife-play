<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 태안군 2025 통계지역 경계 실루엣"><title>충청남도 태안군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M26.212,144.063L27.013,143.913L28.096,145.949L27.403,145.780ZM35.212,142.304L35.446,141.555L36.054,141.374L38.180,144.709L35.720,143.379ZM32.837,139.964L31.079,139.789L30.973,139.712L32.326,139.552ZM78.508,138.660L78.699,139.167L77.744,139.378L77.778,138.499ZM200.854,136.837L201.326,136.351L201.821,136.391L201.648,137.359ZM199.731,136.435L200.164,136.943L199.575,137.156L198.851,136.796ZM70.873,134.658L71.005,133.702L71.773,133.400L71.802,134.572L73.864,135.703L71.886,135.515ZM111.696,128.312L111.297,128.705L111.787,129.001L110.778,129.064L110.825,128.334ZM121.707,126.317L122.656,126.541L122.824,127.102L121.481,127.631L120.679,127.310L120.584,126.798ZM174.018,126.492L174.833,126.413L175.001,127.445L173.603,127.274ZM190.326,122.413L188.165,123.608L188.434,125.297L186.254,125.771L185.376,124.715L183.758,125.360L183.190,125.999L182.820,125.198L181.979,125.000L180.756,126.777L179.246,127.213L177.748,125.673L182.692,122.146L184.540,122.517L186.144,122.326L187.977,120.892L188.734,120.850L189.011,120.035L188.449,119.696L188.219,118.948L188.705,117.839L189.514,117.882L190.312,118.809L189.315,120.704L189.851,121.394L190.478,121.534ZM198.149,112.527L198.957,113.130L198.113,113.654L197.786,112.996ZM198.968,112.123L199.546,112.225L199.101,113.190L198.591,112.732ZM146.942,105.098L148.364,104.000L149.037,104.384L148.666,105.857L147.821,106.507L147.055,106.313ZM202.009,96.249L202.490,96.335L201.895,97.186L201.696,96.812ZM226.594,215.228L227.011,215.457L226.974,216.228L225.984,215.829ZM232.425,206.445L234.064,20