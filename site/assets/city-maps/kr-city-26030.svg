<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="울산광역시 동구 2025 통계지역과 주변 경계"><title>울산광역시 동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-26010" d="M0.000,68.999L0.000,0.000L43.867,0.000L43.758,2.264L45.767,12.066L47.508,14.833L49.393,19.757L50.679,27.923L50.235,34.673L52.590,42.326L53.321,47.562L47.897,55.446L47.621,58.705L49.132,64.336L52.168,71.505L54.230,73.206L45.265,70.341L35.020,71.438L18.794,70.228L4.746,68.378Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-26020" d="M4.746,68.378L18.794,70.228L35.020,71.438L45.265,70.341L52.654,72.461L63.472,79.463L70.598,82.027L67.598,86.241L71.420,87.638L73.994,90.725L79.287,94.548L91.417,109.546L86.271,108.663L85.609,112.450L83.404,118.772L88.770,120.536L88.256,129.726L102.739,132.667L106.709,152.810L107.076,158.545L106.856,159.721L105.900,160.456L103.841,160.750L95.313,157.442L85.242,161.265L80.095,161.044L73.626,153.546L69.601,152.700L68.467,153.124L72.975,161.110L76.778,166.662L86.671,164.653L90.351,162.774L94.710,162.635L99.818,169.102L99.356,169.559L107.308,181.543L110.507,185.300L103.239,192.996L102.792,204.397L103.493,208.798L103.021,211.092L97.805,216.644L94.268,214.789L81.950,227.408L70.698,237.295L76.612,240.000L60.506,240.000L57.881,238.880L55.669,232.155L55.032,228.280L50.791,222.812L49.812,221.625L44.807,219.295L34.220,210.166L34.630,206.952L34.512,204.195L33.609,201.040L29.689,196.952L24.666,196.482L22.614,193.524L20.