<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전라남도 목포시 2025 통계지역과 주변 경계"><title>전라남도 목포시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-36600" d="M7.055,240.000L7.264,236.929L8.118,235.193L12.279,228.905L16.387,213.213L18.796,209.148L21.975,202.174L23.995,186.144L24.501,184.357L25.402,183.317L29.446,180.503L35.918,177.773L40.528,176.380L44.188,176.280L46.190,177.116L52.185,182.100L58.448,188.380L66.033,198.327L69.440,201.647L70.033,201.060L70.046,198.347L70.644,196.699L72.650,196.827L74.414,198.133L83.353,211.777L95.134,216.317L98.181,220.696L98.407,222.703L97.338,223.995L97.327,226.236L98.358,232.492L98.232,234.261L92.410,240.000ZM177.277,234.870L178.072,234.806L180.774,236.353L179.927,240.000L175.612,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-36610" d="M308.032,240.000L306.804,233.838L307.384,229.510L304.070,225.847L301.492,224.130L299.497,224.030L289.737,227.112L286.298,232.516L284.605,236.512L281.895,240.000L275.972,240.000L269.570,235.995L266.730,231.045L266.687,230.101L268.170,228.805L271.309,228.748L272.682,227.660L273.163,226.077L273.096,225.786L268.426,224.741L259.712,230.532L257.033,233.327L256.921,234.505L258.853,236.574L258.545,237.378L256.148,240.000L229.559,240.000L234.960,230.804L236.688,229.858L241.031,230.254L247.185,235.869L248.343,235.952L248.929,231.984L250.872,231.306L253.879,231.876L254.375,231.530L255.062,230.293L255.860,224.817L256.697,223