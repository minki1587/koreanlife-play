<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전라남도 무안군 2025 통계지역 경계 실루엣"><title>전라남도 무안군 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M152.268,179.457L150.968,177.043L151.097,176.482L151.611,176.674L151.826,177.626L152.550,178.336L152.811,179.317ZM126.457,144.377L126.312,143.261L127.716,142.815L128.267,143.886L128.068,144.324ZM146.519,112.488L148.511,115.877L148.516,117.264L145.508,118.016L144.246,117.841L143.470,119.655L144.394,120.808L143.827,122.424L147.303,122.668L150.011,126.537L148.723,127.766L148.251,131.294L146.531,132.196L146.011,133.422L149.004,134.231L149.493,133.606L150.069,133.668L149.751,135.722L147.537,137.039L146.340,139.093L146.247,141.600L147.933,143.977L147.348,146.170L145.086,146.310L144.009,145.927L142.906,144.860L140.295,144.717L139.549,145.297L139.721,146.479L139.277,147.579L138.606,147.456L135.734,148.722L131.951,147.513L130.406,147.545L129.609,147.977L129.330,147.433L129.834,145.851L128.947,143.052L129.920,142.459L129.891,141.970L129.742,141.281L128.370,140.033L126.584,140.017L126.358,141.176L125.190,139.231L124.518,139.355L121.701,142.188L119.558,141.288L119.133,138.518L119.360,138.060L120.272,138.480L121.193,138.292L121.379,137.157L124.026,136.256L124.249,134.259L126.174,132.879L123.197,131.211L122.238,131.206L120.853,130.088L120.519,129.693L120.667,128.233L119.766,126.169L117.782,125.648L116.992,124.917L115.534,123.315L114.541,121.110L116.828,114.879L117.775,115.000L118.618,114.609L119.321,111.735L119.193,110.716L120.391,109.754L123.728,108.648L123.787,110.054L122.411,111.445L121.370,115.415L123.920,115.867L124.875,113.611L124.738,112.527L125.119,112.276L125.639,112.539L126.467,114.916L126.611,116.9