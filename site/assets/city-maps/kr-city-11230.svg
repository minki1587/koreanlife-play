<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 강남구 2025 통계지역과 주변 경계"><title>서울특별시 강남구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11020" d="M45.125,3.680L42.467,4.084L39.190,0.000L46.632,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11030" d="M42.467,4.084L45.125,3.680L44.568,8.925L46.774,14.586L50.830,16.080L53.508,15.272L57.246,16.312L69.290,25.735L67.578,27.104L43.625,51.666L36.581,62.340L28.586,68.021L9.258,80.104L0.000,94.966L0.000,0.000L39.190,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11040" d="M69.290,25.735L57.246,16.312L53.508,15.272L50.830,16.080L47.667,15.099L46.482,14.335L44.568,8.925L45.067,3.904L46.632,0.000L158.227,0.000L139.469,40.974L124.711,32.363L120.018,28.757L107.504,24.000L70.558,24.722Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11050" d="M156.574,49.711L139.469,40.974L158.227,0.000L247.197,0.000L231.451,27.614L223.014,44.189L221.355,45.160L209.782,47.022L206.200,48.947L194.054,52.809L180.828,54.842L171.514,54.460Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="rou