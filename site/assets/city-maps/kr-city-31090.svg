<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 안산시 2025 통계지역 경계 실루엣"><title>경기도 안산시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M57.748,215.204L57.799,214.710L58.518,214.468L59.010,214.958L59.058,215.894ZM54.979,211.678L53.336,209.807L53.592,209.354L55.471,208.380L56.392,209.489L56.987,211.116L56.561,211.746ZM48.382,205.531L48.484,204.094L49.685,202.126L50.152,202.177L51.178,203.568L51.166,204.385L53.053,206.243L53.074,206.727L52.303,207.497L50.150,207.708ZM19.941,204.446L18.400,204.115L16.898,202.680L12.851,202.106L12.066,200.848L12.000,198.591L13.262,194.441L14.144,193.921L17.292,193.817L20.025,195.582L20.898,197.923L21.457,202.838ZM144.446,148.489L146.091,146.654L149.331,146.507L149.833,146.798L146.485,147.640L144.610,148.938ZM136.267,122.703L137.375,120.434L137.948,120.484L138.564,122.902L138.417,123.609L136.642,123.761ZM135.591,120.854L135.796,119.691L136.795,119.612L136.275,120.980ZM143.304,106.550L145.077,105.766L145.499,106.476L144.024,108.210L143.323,107.229ZM119.553,78.715L120.965,76.993L122.059,77.865L119.947,80.781L117.721,80.923L116.817,81.621L116.221,83.514L114.599,84.774L113.592,86.448L113.032,91.575L113.826,91.149L114.800,88.897L117.237,89.555L119.387,90.969L120.311,90.409L122.410,91.574L122.459,92.426L121.570,93.910L121.954,94.770L124.260,96.909L127.501,98.056L133.200,97.479L133.786,97.713L133.550,98.653L133.945,99.335L137.734,100.421L138.713,101.470L137.361,103.640L136.741,106.022L140.210,107.485L139.202,108.879L141.348,110.816L142.947,110.287L141.387,113.272L140.888,115.163L144.744,116.677L146.726,118.144L151.224,119.984L154.091,122.245L155.633,122.948L156.086,125.985L155.071,127.403L153.841,132.404L153.