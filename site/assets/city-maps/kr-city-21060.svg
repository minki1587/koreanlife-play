<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 동래구 2025 통계지역과 주변 경계"><title>부산광역시 동래구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21050" d="M0.244,153.428L4.382,151.311L18.356,146.602L25.355,148.147L33.585,151.126L34.415,153.033L41.450,161.260L47.273,168.808L46.358,170.386L45.170,174.336L44.925,178.887L49.489,188.540L59.346,204.593L63.177,208.902L69.986,210.729L79.365,209.984L92.360,211.469L95.425,212.180L97.263,227.723L98.575,228.597L101.130,234.318L101.665,238.803L102.045,239.472L103.255,240.000L0.000,240.000ZM133.546,237.068L133.310,230.005L146.683,240.000L131.693,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21080" d="M37.842,1.496L39.198,10.154L40.763,11.477L49.860,11.908L58.608,16.979L66.397,17.440L74.959,16.601L81.491,14.323L87.088,14.930L89.301,18.231L90.217,21.525L88.229,28.750L89.059,31.162L85.897,40.561L81.802,44.110L80.848,46.251L77.791,54.536L75.761,61.922L70.667,70.073L59.860,85.013L58.829,87.188L59.343,95.203L57.873,107.727L55.920,113.003L54.563,115.419L37.686,135.724L32.323,134.995L32.000,138.920L32.344,147.282L33.585,151.126L25.355,148.147L18.356,146.602L4.382,151.311L0.000,153.619L0.000,0.000L38.701,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21090" d="M299.811,239.468L299