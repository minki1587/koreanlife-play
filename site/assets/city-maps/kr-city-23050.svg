<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="인천광역시 남동구 2025 통계지역과 주변 경계"><title>인천광역시 남동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11170" d="M318.087,30.949L316.620,32.082L314.219,32.686L312.706,33.751L312.009,31.898L308.902,32.064L308.782,33.342L309.325,34.099L307.705,33.964L308.014,35.998L306.714,37.898L305.892,37.848L304.893,36.398L302.929,36.208L301.946,34.916L302.141,32.748L302.810,31.450L304.057,30.943L304.027,30.155L305.567,28.222L307.348,28.186L309.499,24.046L310.079,21.157L309.358,19.304L309.364,13.929L313.874,11.494L315.666,9.542L314.979,8.894L314.560,5.176L308.069,1.886L307.005,2.003L303.894,0.000L320.000,0.000L320.000,31.006Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23010" d="M0.083,62.524L5.445,65.194L6.033,65.010L7.107,62.856L0.000,59.301L0.000,20.438L0.286,20.737L3.389,19.749L5.593,19.700L7.954,20.478L12.088,23.636L12.169,23.246L17.401,28.416L25.461,38.261L34.895,44.769L33.791,46.522L33.839,51.476L29.121,54.500L27.051,59.269L26.656,61.354L21.036,69.810L14.107,75.044L13.465,76.185L16.927,95.681L18.625,97.125L22.061,119.567L0.000,119.424Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-23020" d="M34.895,44.769L25.461,38.261L17.401,28.416L12.169,23.246L12.088,23.636L8.613,20.880L6.220,19.811L3.