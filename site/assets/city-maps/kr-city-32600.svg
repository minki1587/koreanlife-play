<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 고성군 2025 통계지역과 주변 경계"><title>강원특별자치도 고성군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32060" d="M235.898,218.001L238.005,219.259L237.808,219.763L236.248,220.152L236.418,222.633L235.325,222.854L235.949,228.183L234.558,228.200L234.586,228.715L233.464,228.816L230.635,228.496L225.666,228.736L223.657,228.046L222.338,228.365L222.020,229.867L222.347,231.288L219.022,233.439L216.047,234.090L214.767,233.779L209.538,234.208L209.692,235.402L208.425,237.026L207.892,239.386L207.521,239.617L205.773,238.794L202.983,239.970L200.782,239.556L197.489,240.000L196.284,239.320L194.404,239.003L193.602,240.000L184.952,240.000L184.885,239.187L181.286,237.367L180.533,235.479L179.172,234.126L176.727,233.301L175.156,230.859L175.354,228.066L173.688,226.439L173.036,224.921L168.642,221.490L170.802,216.280L174.461,214.177L176.359,210.266L178.262,210.554L179.273,211.907L180.313,212.188L183.450,212.566L184.450,212.123L185.558,212.206L192.278,216.000L193.402,214.671L193.810,214.967L194.861,213.009L195.979,212.821L197.265,209.672L198.782,209.443L201.903,206.996L202.599,207.826L205.089,207.423L207.468,205.716L208.305,204.136L210.442,202.944L212.496,202.979L212.728,203.281L215.524,203.024L218.952,201.545L220.464,201.682L222.862,201.141L224.744,199.816L225.452,198.456L226.857,197.856L226.975,196.753L229.043,200.706L231.243,203.603L232.851,204.346L233.162,204.086L232.997,205.131L233.582,207.339L233.414,208.341L233.087,206.077L230.507,205.921L230.670,207.831L232.539,207.748L232.505,208.025L231.090,207.922L230.840,209.45