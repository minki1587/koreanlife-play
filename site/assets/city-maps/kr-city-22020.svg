<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 동구 2025 통계지역과 주변 경계"><title>대구광역시 동구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22010" d="M59.044,206.967L58.239,200.823L62.672,196.735L63.766,195.003L63.445,194.826L63.565,192.147L62.053,193.013L60.998,193.116L59.863,191.817L59.823,190.710L60.994,188.160L62.520,189.156L63.313,189.182L62.436,188.133L61.972,184.355L78.058,187.877L78.099,189.052L82.062,188.814L87.102,190.561L90.044,190.361L92.641,189.355L94.248,190.628L96.908,197.110L95.459,200.257L91.556,205.155L90.818,209.494L91.149,212.544L81.753,212.010L80.357,211.161L78.084,210.798L71.569,210.676L66.917,211.213Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22030" d="M43.833,209.233L34.044,213.616L31.202,211.901L29.810,212.233L26.607,211.687L26.257,208.464L20.024,208.506L20.642,204.746L18.050,203.594L13.406,202.949L12.609,202.026L11.966,199.075L8.107,198.588L6.519,196.462L7.586,195.031L8.425,192.394L8.117,189.000L7.549,186.620L4.502,180.926L4.967,179.563L7.778,177.026L12.215,175.980L12.905,175.271L12.752,173.965L17.672,175.384L22.761,174.409L24.809,173.353L27.957,170.954L28.546,169.657L36.310,166.041L37.175,167.722L40.225,171.494L60.169,174.952L65.807,177.767L64.084,184.816L61.972,184.355L62.436,188.133L63.313,189.182L62.520,189.156L60.994,188.160L59.823,190.710L59.863,191.817L60.998,193.116L62.053,193.013L63.565,192.147L63.445,194.826L63.766,195.003L62.672,196.735L5