<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대전광역시 서구 2025 통계지역과 주변 경계"><title>대전광역시 서구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-25010" d="M239.605,79.708L232.445,68.141L228.053,63.681L225.935,60.619L221.648,58.334L219.903,56.378L218.989,54.146L222.947,53.158L225.467,53.382L223.528,51.605L224.558,49.500L228.074,49.377L228.939,48.940L230.823,45.242L231.369,45.178L231.082,42.715L233.630,38.656L235.151,38.650L237.514,36.947L240.174,37.976L240.986,41.099L240.959,42.687L242.440,44.203L242.374,45.405L245.444,47.003L246.181,45.409L245.728,45.560L246.046,44.149L246.941,43.761L253.076,43.283L252.512,44.475L256.372,44.784L260.749,47.038L261.748,46.244L261.459,42.616L262.518,39.683L262.383,37.223L260.608,36.390L257.284,28.603L251.647,19.612L250.482,16.599L251.971,13.909L253.679,8.730L252.643,7.360L252.857,1.509L253.258,0.000L320.000,0.000L320.000,2.044L318.054,3.718L317.201,5.882L311.216,10.148L310.799,11.278L310.870,21.347L311.925,24.235L312.150,28.334L307.625,44.576L305.304,44.276L303.183,44.780L301.813,46.273L298.200,47.362L296.690,52.117L296.886,53.930L297.828,54.779L295.800,57.260L291.971,58.147L291.246,59.213L291.218,64.670L291.896,68.832L293.096,71.330L293.153,72.277L290.370,77.554L288.820,79.152L289.622,83.213L287.306,85.775L285.945,86.488L289.777,92.953L289.154,94.205L284.754,98.259L283.704,98.439L281.237,97.440L282.171,98.059L283.120,99.860L282.875,101.374L288.014,111.731L288.803,115.573L288.643,117.206L287.492,119.006L280.889,125.293L281.529,128.543L278.985,137.205L278.931,139.430L280.025,140.349L281.113,140.301L281.897,140.78