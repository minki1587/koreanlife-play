<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 서구 2025 통계지역과 주변 경계"><title>부산광역시 서구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21010" d="M199.592,112.699L195.653,111.539L187.012,112.882L182.836,114.378L179.324,105.301L174.691,101.568L174.096,98.684L176.826,86.885L182.739,82.393L183.792,83.617L185.043,82.298L186.092,79.051L185.555,72.845L183.420,72.312L182.033,70.607L184.887,69.386L193.167,72.077L202.761,80.194L210.519,82.735L207.450,88.200L213.785,92.886L212.424,94.736L206.608,90.456L205.712,92.936L212.367,97.879L209.967,101.021L204.167,97.706L205.512,95.946L203.045,96.078L202.641,97.029L203.027,109.236L205.517,114.971L205.176,115.235L203.263,111.304L200.041,112.570L201.135,116.079L200.701,116.209Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21030" d="M202.761,80.194L193.167,72.077L185.578,69.396L182.033,70.607L179.441,66.907L180.578,59.874L181.461,44.998L180.783,41.591L178.054,34.883L182.958,32.045L185.068,29.360L191.001,27.453L193.306,28.345L195.967,27.855L201.575,22.439L202.871,20.609L203.767,16.724L203.316,13.844L205.489,10.399L206.809,9.319L213.768,9.514L223.302,14.827L224.847,16.973L226.215,17.407L230.175,17.699L234.286,17.402L237.136,18.469L246.604,18.526L249.495,27.642L248.379,42.921L247.301,44.366L247.720,47.824L232.971,67.311L227.279,62.961L226.904,61.788L231.469,57.068L231.524,52.120L230.174,51.119L227.044,51.453L222.505,55.968L220.166,62.316L227.495,68