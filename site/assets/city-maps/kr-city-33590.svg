<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청북도 증평군 2025 통계지역과 주변 경계"><title>충청북도 증평군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-33040" d="M0.648,152.651L3.099,153.497L3.947,155.031L3.860,156.424L4.461,157.272L6.829,158.552L8.232,158.788L11.677,157.218L11.437,150.754L11.954,145.664L14.109,141.919L16.249,141.085L20.266,137.052L22.022,133.271L22.003,132.540L23.444,132.056L29.025,132.531L31.771,133.641L34.400,133.015L36.615,130.937L42.652,127.246L42.077,125.828L43.475,124.910L49.383,126.094L50.053,126.931L51.865,128.014L52.526,127.675L53.899,124.953L55.851,123.033L61.400,120.767L62.818,120.437L65.791,121.379L67.109,122.213L70.073,124.991L71.303,126.966L70.203,131.757L69.684,132.879L67.956,134.293L64.124,136.473L62.222,139.656L63.414,139.501L67.034,137.815L71.985,134.731L75.616,134.870L78.332,133.540L82.269,132.557L90.518,132.159L92.314,130.141L101.297,127.219L104.304,127.816L109.698,124.554L114.282,122.692L117.213,122.406L117.693,122.730L120.102,122.321L123.886,120.522L125.949,122.630L127.123,126.323L127.278,128.552L128.304,130.106L129.744,130.580L131.903,132.056L134.793,135.586L144.076,138.839L147.948,141.484L148.258,144.355L147.638,147.967L149.439,152.463L149.435,158.298L150.433,159.580L152.023,161.101L155.244,163.225L157.402,163.517L159.380,161.914L162.387,161.662L163.114,162.008L164.728,164.194L166.878,169.016L167.315,172.894L168.748,174.216L168.744,179.017L169.992,182.164L169.890,183.750L171.526,184.948L172.093,184.857L172.618,185.520L173.084,186.750L174.194,194.743L176.058,195.886L177.371,197.535L177.466,200.934L176.502,208