<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 수영구 2025 통계지역과 주변 경계"><title>부산광역시 수영구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21030" d="M12.732,196.600L17.837,212.699L15.866,239.683L15.629,240.000L0.000,240.000L0.000,196.524Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21050" d="M0.415,41.038L1.990,54.351L3.113,55.100L5.302,60.000L6.086,64.414L8.618,65.229L19.284,66.364L20.616,67.573L28.148,70.137L33.067,62.355L32.864,56.306L43.918,64.495L51.307,71.352L63.455,84.561L63.683,86.388L62.068,93.693L60.337,99.281L57.894,101.807L55.837,103.288L54.568,106.736L53.754,118.902L61.029,128.703L64.498,129.498L67.270,134.000L65.300,136.748L58.733,152.105L58.391,154.451L52.217,157.312L34.018,168.168L32.952,169.216L19.246,173.070L8.854,169.904L8.254,171.777L8.738,188.725L9.705,191.611L12.732,196.600L0.000,196.524L0.000,40.942Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M0.000,12.925L0.000,0.000L27.734,0.000L8.875,4.959L10.212,10.272ZM159.368,0.017L159.282,4.802L162.772,17.294L163.558,24.000L162.751,41.044L159.718,37.950L154.295,29.885L153.508,26.651L148.410,17.598L141.942,14.884L123.831,13.081L114.894,10.437L101.539,8.187L88.681,4.572L77.735,2.187L72.886,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#