<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 의정부시 2025 통계지역과 주변 경계"><title>경기도 의정부시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11090" d="M26.006,240.000L24.874,232.621L23.503,231.194L26.916,229.584L33.742,222.259L43.582,219.509L46.703,219.355L50.885,220.516L51.036,227.532L54.249,231.205L56.914,231.727L58.929,236.007L60.047,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11100" d="M59.985,239.888L58.929,236.007L56.914,231.727L54.249,231.205L51.036,227.532L50.885,220.516L51.600,219.821L52.033,215.757L51.574,212.987L50.592,211.483L50.562,208.225L51.863,200.025L52.511,198.600L57.065,192.374L61.258,192.346L62.003,191.775L63.526,186.633L69.668,186.551L70.842,187.746L73.814,189.637L78.444,190.006L81.553,188.395L82.178,187.365L83.623,187.641L85.704,191.328L86.344,193.925L86.384,196.798L88.685,203.553L90.857,206.111L96.517,205.036L100.716,202.917L104.026,199.723L105.924,198.612L108.474,199.049L108.607,200.062L111.685,204.699L116.847,201.667L118.353,202.488L119.931,209.086L119.984,214.203L122.881,220.599L123.045,222.554L122.767,225.464L122.154,226.426L119.189,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11110" d="M119.189,240.000L122.154,226.426L122.767,225.464L123.045,222.554L122.881,220.599L121.022