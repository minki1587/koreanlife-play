<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 광진구 2025 통계지역과 주변 경계"><title>서울특별시 광진구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11040" d="M0.000,34.864L8.053,28.582L15.650,25.660L28.676,25.253L48.452,37.486L76.249,63.963L79.095,66.135L81.178,67.017L93.166,69.950L99.890,71.275L100.020,70.512L115.816,73.517L124.956,77.960L71.934,194.443L48.992,181.056L41.697,175.451L22.244,168.056L0.000,168.408Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11060" d="M28.676,25.253L15.650,25.660L8.053,28.582L0.000,34.864L0.000,0.000L137.128,0.000L139.406,11.295L140.334,27.268L140.111,30.238L137.633,37.083L120.077,75.607L115.816,73.517L100.020,70.512L99.890,71.275L93.166,69.950L81.178,67.017L79.095,66.135L76.249,63.963L48.452,37.486Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11070" d="M192.694,33.382L187.898,35.817L185.215,36.393L183.130,36.008L182.419,37.755L181.415,38.504L179.523,39.168L177.265,39.185L175.057,38.707L172.267,36.842L170.152,37.239L169.443,34.378L163.333,34.343L147.478,31.235L140.111,30.238L140.334,27.268L139.406,11.295L137.128,0.000L214.263,0.000L214.005,5.771L209.614,18.538L208.595,24.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="roun