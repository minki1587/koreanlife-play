<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 화천군 2025 통계지역과 주변 경계"><title>강원특별자치도 화천군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31270" d="M0.000,118.154L2.381,118.693L2.402,119.440L1.597,120.258L0.000,120.435ZM0.346,151.413L1.829,150.229L4.713,150.576L5.955,149.779L6.601,148.624L8.304,150.425L8.793,155.000L12.438,161.456L16.105,161.948L17.111,163.215L19.234,164.342L19.543,158.665L19.897,158.208L22.864,156.673L25.956,156.638L27.090,155.622L30.610,155.211L33.317,153.622L33.719,153.051L33.771,151.696L36.342,149.535L38.448,150.153L38.653,150.788L39.560,151.385L46.798,151.960L48.051,155.749L50.591,157.528L51.906,157.026L58.366,150.862L59.229,152.172L62.728,154.603L64.165,160.301L65.226,169.867L64.962,177.901L64.363,180.110L63.862,180.696L65.093,183.173L64.929,184.200L63.045,188.320L60.216,191.924L58.176,193.698L55.955,194.360L55.696,195.668L56.509,196.391L56.911,197.502L55.355,201.400L54.535,201.999L53.161,204.266L51.702,208.425L51.687,211.170L50.944,213.271L49.280,214.062L47.689,217.125L45.221,217.725L41.174,221.293L39.850,221.000L38.711,222.122L38.782,223.811L39.313,224.761L38.074,225.780L37.818,226.818L38.152,228.183L37.078,229.814L36.156,230.494L35.414,232.521L35.956,233.654L36.685,233.909L36.921,234.515L35.698,237.087L36.503,238.050L38.019,238.411L38.982,240.000L0.000,240.000L0.000,151.271Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-31570" d="M38.982,240.000