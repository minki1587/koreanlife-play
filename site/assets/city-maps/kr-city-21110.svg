<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 금정구 2025 통계지역과 주변 경계"><title>부산광역시 금정구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21050" d="M72.626,239.968L79.118,237.780L79.575,237.780L81.600,238.291L82.370,238.498L86.194,239.882L86.245,240.000L72.554,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M86.194,239.882L85.617,238.096L85.607,232.388L88.099,232.726L96.571,222.170L97.478,219.719L98.161,213.900L97.922,210.176L105.789,198.438L108.595,190.162L110.498,188.514L111.966,184.147L112.685,183.579L115.250,182.893L117.588,182.736L121.589,182.703L122.215,183.470L122.321,185.824L122.884,186.040L126.628,186.145L130.481,183.759L138.959,183.376L140.513,183.607L145.466,188.370L147.436,186.991L152.687,192.034L156.242,192.521L152.583,200.004L155.242,201.690L158.111,200.394L164.768,202.633L166.925,204.536L167.438,205.652L168.017,204.707L170.126,206.448L173.252,207.318L180.362,210.245L181.438,210.912L181.148,212.620L185.652,214.515L187.777,216.000L191.473,214.759L193.765,214.863L193.509,215.744L194.062,220.933L196.159,227.243L200.128,231.355L202.220,231.319L204.394,232.623L203.121,235.308L201.891,240.000L147.959,240.000L145.642,237.200L141.703,236.990L135.606,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-i