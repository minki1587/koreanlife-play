<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 오산시 2025 통계지역과 주변 경계"><title>경기도 오산시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-31070" d="M56.785,240.000L59.918,233.106L62.748,224.484L63.362,219.106L57.567,222.822L56.857,222.747L54.683,221.076L56.815,219.690L57.592,220.009L63.553,217.821L65.186,215.048L66.453,211.272L69.622,208.370L82.069,206.236L86.157,206.210L94.435,203.835L100.892,199.259L108.198,195.486L108.865,195.477L110.111,196.605L117.709,195.144L120.491,193.617L120.839,192.101L129.168,188.844L131.560,188.460L137.446,189.148L135.892,192.156L135.721,194.471L136.729,199.317L142.784,206.740L145.936,209.463L151.738,213.242L151.579,209.173L150.898,207.013L151.137,205.814L155.603,204.459L158.179,204.117L165.610,204.948L165.699,202.155L167.610,199.023L172.543,195.040L172.724,195.834L174.553,197.856L177.358,199.049L178.573,199.133L182.987,198.195L191.705,199.164L191.476,201.123L194.318,201.019L193.368,204.543L194.168,207.567L193.793,210.017L195.118,212.466L195.568,212.591L197.267,210.491L199.567,208.842L201.932,211.790L203.986,215.382L207.215,214.615L207.878,216.000L210.053,215.586L211.651,213.409L215.213,211.716L218.463,210.741L220.662,208.942L220.607,215.042L224.653,213.685L225.683,214.150L227.332,213.700L229.207,211.076L232.556,211.676L234.781,212.600L240.599,209.590L240.579,208.226L242.929,205.352L242.554,204.527L244.204,204.252L246.328,205.452L248.503,206.027L248.428,205.402L244.778,201.828L245.728,200.903L241.754,196.804L238.030,192.055L240.604,190.805L240.929,189.256L244.454,187.631L245.942,185.760L247.502,186.901L250.70