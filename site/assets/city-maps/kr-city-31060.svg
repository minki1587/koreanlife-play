<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 광명시 2025 통계지역과 주변 경계"><title>경기도 광명시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11150" d="M130.236,0.475L126.601,3.635L123.792,5.448L121.103,7.670L120.100,10.590L120.051,13.325L117.647,12.306L116.871,12.259L116.942,12.012L117.059,11.605L116.903,8.551L116.509,7.355L115.737,6.636L115.169,6.433L113.522,5.839L113.364,5.701L112.773,5.184L110.768,3.226L107.960,0.000L130.440,0.000ZM173.911,2.440L171.254,2.886L162.971,3.639L161.260,3.702L161.034,3.478L160.675,3.120L160.008,1.578L159.538,0.167L155.689,0.139L155.624,0.000L175.421,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11170" d="M98.075,61.144L96.529,62.339L93.999,62.975L92.406,64.097L91.670,62.145L88.398,62.320L88.271,63.666L88.844,64.463L87.136,64.322L87.462,66.464L86.092,68.466L85.226,68.413L84.174,66.886L82.105,66.685L81.069,65.324L81.274,63.040L81.979,61.672L83.292,61.138L83.261,60.308L84.883,58.272L86.760,58.233L89.027,53.872L89.638,50.828L88.878,48.875L88.885,43.212L93.636,40.647L95.524,38.591L94.801,37.908L94.359,33.991L87.519,30.525L86.398,30.648L83.270,28.888L82.707,27.562L80.756,27.292L80.618,24.348L78.489,20.933L80.176,19.085L80.779,16.795L83.331,18.197L87.087,15.670L88.292,16.071L89.618,14.987L89.015,12.375L90.381,10.165L92.663,9.191L92.551,7.192L94.118,0.965L94.019,0.000L107.960,0.000L113.522,5.839L115.737,6.636L116.509,7.355L116.903,8.551L116.871,12.259L