<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 화성시 2025 통계지역 경계 실루엣"><title>경기도 화성시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M21.394,171.241L21.553,172.145L22.271,172.844L19.583,174.854L19.217,174.291ZM103.415,167.427L104.197,164.153L106.070,161.045L105.855,155.337L106.129,155.047L106.880,155.853L107.809,158.980L108.981,160.933L109.216,164.761L108.553,165.423L105.085,166.652L104.069,167.404ZM12.000,144.842L12.443,143.770L12.239,142.778L13.501,143.158L13.961,144.835L14.157,148.519L12.918,150.702ZM49.277,138.900L48.444,140.302L47.952,139.946L48.768,138.860ZM59.789,126.932L59.701,124.886L59.913,124.830L60.586,125.584L60.391,127.230ZM110.434,116.916L109.245,119.752L107.200,121.567L105.374,121.479L104.171,121.916L104.606,123.508L102.668,128.025L99.739,129.287L98.446,131.992L97.529,132.718L95.855,133.491L94.686,132.494L92.363,132.508L91.704,133.834L91.587,137.177L88.445,139.132L87.100,139.040L85.663,139.476L83.801,141.266L83.432,141.863L83.742,142.543L82.666,143.736L80.969,143.806L78.788,141.865L78.816,141.500L80.201,141.541L81.295,140.729L81.933,139.196L80.760,133.948L78.667,130.063L78.093,129.673L76.892,130.210L76.820,128.261L79.442,126.662L81.163,121.873L81.713,121.354L86.836,119.843L85.076,116.976L81.979,115.474L84.431,110.663L81.729,113.360L81.246,115.060L75.308,117.767L72.378,117.230L70.047,118.834L68.062,119.320L66.081,118.918L65.457,118.367L65.516,117.168L69.516,115.624L70.856,113.937L70.834,113.128L69.977,112.326L69.463,110.811L68.647,107.182L68.523,104.716L67.681,103.790L67.463,102.778L68.104,102.514L68.757,102.785L69.924,104.277L71.038,104.521L71.520,103.290L73.047,101.410L73.354,99.709L72.837,98.978L73.601,98.030L