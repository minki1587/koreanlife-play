<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 강릉시 2025 통계지역 경계 실루엣"><title>강원특별자치도 강릉시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M183.968,181.362L182.052,183.342L181.047,182.524L180.373,182.688L178.495,188.032L175.800,189.513L175.621,191.714L176.393,193.250L175.598,196.060L174.222,197.975L174.600,200.262L175.337,201.736L175.086,206.615L172.921,211.231L172.243,214.253L172.457,216.548L170.634,218.594L170.127,221.669L166.917,223.345L164.109,222.761L162.698,223.611L161.813,224.769L159.176,225.605L156.075,228.000L156.246,226.373L154.966,224.862L152.470,222.564L149.667,220.879L149.123,220.067L152.001,216.634L151.675,214.121L151.026,213.256L148.998,212.858L147.581,210.744L146.388,209.745L143.784,208.597L142.135,207.295L140.305,207.005L138.773,207.633L136.304,207.508L133.706,208.464L129.117,206.016L127.465,205.800L122.713,208.896L121.560,210.389L118.862,210.684L118.379,210.201L118.571,208.820L117.163,208.457L116.410,209.523L115.051,210.439L111.514,210.903L110.062,211.915L107.886,210.764L103.980,205.876L98.950,203.900L97.763,201.337L97.553,199.564L97.102,199.121L96.109,199.240L95.516,198.826L95.411,195.649L99.711,195.553L100.763,190.571L101.705,183.442L101.559,181.957L102.466,181.568L106.485,182.267L107.892,181.604L110.337,183.570L112.017,184.191L113.270,184.116L113.351,182.765L114.973,181.477L115.489,176.250L116.240,175.018L118.444,173.038L121.994,173.404L123.301,172.872L123.587,170.880L122.897,163.193L119.807,159.297L121.766,153.789L121.196,152.367L121.691,150.004L125.484,147.768L127.292,143.606L129.331,143.282L130.033,141.802L134.485,140.549L134.762,138.967L134.234,138.126L134.140,136.238L132.982,134.579L133.109,133.539L1