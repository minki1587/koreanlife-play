<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="강원특별자치도 강릉시 2025 통계지역과 주변 경계"><title>강원특별자치도 강릉시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-32040" d="M282.416,227.628L282.386,228.257L280.254,231.769L279.474,231.225L277.938,231.022L276.651,231.983L276.388,234.004L275.217,237.272L274.475,237.300L272.624,235.677L270.909,235.538L268.887,234.064L267.903,234.274L266.759,235.726L265.059,236.213L263.600,234.823L262.388,234.416L261.640,233.198L260.707,232.799L256.177,234.230L255.597,235.088L253.803,236.236L250.793,235.408L249.467,234.500L247.330,234.964L246.597,235.717L244.096,236.480L243.427,236.214L241.758,236.632L239.058,238.195L238.754,239.530L238.264,240.000L210.452,240.000L212.168,237.878L212.400,235.699L212.823,235.087L214.515,234.488L217.128,230.873L219.390,230.225L220.845,227.985L220.924,226.122L220.350,223.895L221.521,224.001L221.782,223.654L220.263,219.771L217.448,219.468L215.448,219.984L214.088,218.911L215.814,214.927L214.790,213.785L212.554,213.793L211.330,212.030L211.084,210.618L213.007,207.519L213.339,206.274L213.028,204.803L213.255,202.956L214.994,200.881L216.335,200.693L217.731,201.222L220.153,200.767L221.638,198.400L224.320,196.625L229.724,197.505L231.749,198.625L233.127,197.620L234.340,195.184L236.306,194.357L239.266,193.823L239.710,194.494L242.015,194.698L242.957,191.039L242.357,189.223L242.535,186.349L243.258,185.148L243.245,180.847L246.416,175.075L245.794,173.315L244.525,172.220L244.737,171.033L246.829,170.834L247.897,169.024L250.369,167.801L251.232,166.940L265.028,178.016L266.373,178.133L266.619,179.032L267.192,179.02