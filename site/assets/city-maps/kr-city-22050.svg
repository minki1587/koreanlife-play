<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 북구 2025 통계지역과 주변 경계"><title>대구광역시 북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22010" d="M169.077,239.540L167.916,230.684L174.306,224.792L175.883,222.295L175.420,222.040L175.594,218.177L173.414,219.427L171.893,219.574L170.257,217.703L170.199,216.107L171.887,212.431L174.086,213.867L175.230,213.903L173.967,212.391L173.297,206.946L196.484,212.023L196.544,213.717L202.257,213.374L209.522,215.891L211.870,216.000L213.763,215.604L217.505,214.153L219.823,215.988L223.657,225.332L221.568,229.868L215.943,236.928L215.118,240.000L169.930,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22020" d="M212.629,211.355L213.176,209.856L216.858,207.408L219.158,204.759L219.783,202.583L222.850,197.066L224.737,194.493L226.900,190.008L233.400,184.551L241.389,189.213L244.347,186.192L244.720,184.762L246.576,182.769L243.575,177.033L241.932,172.621L239.999,163.826L241.393,159.237L245.178,154.012L247.448,145.557L246.433,138.363L246.013,127.431L244.018,123.892L242.271,122.664L240.857,121.040L236.055,110.604L236.345,108.250L238.273,106.452L238.885,95.344L237.738,94.405L233.929,92.715L233.562,88.770L234.022,83.985L234.850,80.245L237.108,77.410L237.580,74.027L229.678,57.857L227.772,55.104L225.996,53.390L226.236,50.927L228.115,47.749L227.508,44.308L225.494,42.250L224.145,41.977L220.499,36.270L220.321,34.910L219.572,33.488L216.198,29.659L210.232,25.1