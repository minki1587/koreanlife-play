<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 홍성군 2025 통계지역과 주변 경계"><title>충청남도 홍성군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-34030" d="M78.974,240.000L78.054,238.711L77.812,236.599L78.099,234.038L77.265,230.919L75.964,228.294L69.431,221.598L70.502,216.900L70.243,213.741L69.384,210.298L66.663,207.146L64.992,193.206L65.202,188.014L63.284,175.805L65.013,171.462L67.991,167.788L78.482,160.373L82.681,154.257L85.649,151.987L86.500,152.081L88.188,154.912L88.046,156.301L89.917,158.371L91.155,158.970L97.712,159.489L103.309,161.698L105.110,163.086L109.535,168.731L114.433,172.410L120.297,173.992L123.185,174.175L126.488,173.148L127.524,171.178L129.274,173.251L130.275,174.959L130.951,177.420L131.746,178.130L134.402,177.916L137.118,176.620L138.935,174.957L142.013,174.722L146.384,172.978L147.699,171.549L148.623,171.577L150.697,173.527L150.298,176.068L151.182,177.878L153.299,180.569L153.439,182.859L154.799,187.033L155.830,188.578L155.437,196.801L156.114,199.143L156.963,200.105L158.162,199.813L162.441,197.481L166.262,192.995L166.189,193.498L167.289,194.752L167.948,196.579L172.348,200.221L174.569,201.212L177.033,201.152L178.810,201.741L180.012,205.466L180.116,208.695L181.406,210.897L183.452,211.405L186.889,210.791L190.397,211.033L194.181,209.910L195.175,210.840L195.872,213.906L197.223,215.674L198.333,216.000L202.360,214.664L203.129,213.775L206.862,214.427L208.854,214.368L209.924,216.328L209.633,219.040L211.853,224.905L214.969,226.989L219.591,227.636L220.185,229.409L217.869,235.065L216.659,236.219L216.589,238.056L219.136,240.000Z" fill="#e5e7