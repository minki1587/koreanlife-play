<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="울산광역시 남구 2025 통계지역과 주변 경계"><title>울산광역시 남구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-26010" d="M163.581,35.538L150.309,31.850L148.514,31.427L146.780,31.533L145.133,32.501L143.113,37.269L143.496,42.841L142.135,44.821L135.150,47.439L126.498,45.639L121.491,40.110L117.723,37.079L108.521,33.035L104.805,31.741L99.147,31.076L93.328,31.675L91.730,31.350L86.796,28.551L82.553,24.000L75.966,14.087L75.450,8.223L77.034,1.445L76.973,0.000L219.672,0.000L221.971,7.468L222.725,12.873L217.126,21.012L216.841,24.375L218.400,30.188L221.535,37.588L223.663,39.344L214.409,36.386L203.834,37.519L187.085,36.270L172.583,34.360Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-26030" d="M317.729,185.669L315.866,186.534L314.006,186.743L308.982,185.734L308.111,184.965L309.981,182.680L305.430,174.679L304.975,156.693L311.164,143.837L303.028,131.454L291.337,128.872L294.525,115.819L292.476,102.159L277.308,78.568L280.154,79.972L282.089,82.097L284.441,86.688L286.452,88.168L288.577,89.002L291.385,88.889L293.662,89.685L293.813,90.824L295.748,91.772L302.540,91.924L306.297,94.808L306.373,96.933L308.175,98.612L310.860,99.731L311.865,98.612L312.856,93.133L312.249,89.339L313.783,83.727L311.707,81.902L307.044,79.399L304.977,77.124L301.248,71.644L301.131,69.947L306.248,62.968L307.347,58.476L307.118,56.463L305.835,54.334L305.403,51.833L305.627,49.905L308.627,47.181L309.879,