<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 부천시 2025 통계지역과 주변 경계"><title>경기도 부천시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11140" d="M320.000,28.243L295.471,13.410L281.283,3.394L277.191,0.000L320.000,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11150" d="M269.427,114.251L264.376,112.003L255.248,115.505L252.233,117.324L251.010,120.177L242.120,127.181L241.143,130.023L241.096,132.685L238.000,131.648L238.032,128.038L237.648,126.875L236.896,126.175L234.740,125.398L232.060,122.855L228.903,119.229L228.965,117.755L222.378,115.367L219.435,116.178L218.311,114.712L218.155,110.918L219.172,106.773L218.780,104.153L217.373,103.058L217.255,100.476L219.272,97.416L221.000,93.183L221.079,88.930L220.557,86.581L222.486,82.975L225.214,81.321L225.341,80.492L226.260,79.905L225.714,79.519L224.774,76.562L225.243,74.860L223.581,73.316L221.039,73.257L217.830,67.801L217.947,65.338L216.715,65.338L216.578,64.497L215.268,63.128L216.207,59.901L216.089,57.047L214.975,53.429L215.872,51.529L221.071,49.626L220.836,48.628L222.244,47.318L221.618,45.050L221.952,43.535L224.551,38.851L224.649,37.600L228.052,37.659L228.990,41.452L227.993,44.835L228.736,47.631L228.510,49.542L233.373,49.332L234.361,53.275L236.525,59.201L235.815,60.950L244.842,79.985L258.240,77.358L282.312,73.726L281.569,62.136L281.902,54.779L280.778,48.398L279.561,45.067L283.039,30.603L293.195,38.138L295.922,39.241L298.460,39.621L302