<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="부산광역시 부산진구 2025 통계지역과 주변 경계"><title>부산광역시 부산진구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-21020" d="M50.982,240.000L53.842,238.814L55.354,236.076L56.713,214.121L60.273,200.665L65.219,200.936L76.673,204.288L80.253,206.545L90.617,210.415L93.693,210.289L99.525,207.857L107.595,216.000L110.067,221.411L112.150,228.341L112.396,230.254L111.866,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21030" d="M111.866,240.000L112.396,230.254L111.441,225.453L110.067,221.411L107.595,216.000L112.704,212.713L114.506,212.002L116.453,209.055L117.480,208.217L125.840,205.531L129.088,206.787L132.838,206.097L140.741,198.464L142.567,195.886L143.830,190.411L143.049,187.616L143.194,186.353L143.823,184.863L147.334,180.178L149.398,179.769L157.923,180.251L161.314,181.821L171.359,187.738L173.536,190.763L175.464,191.374L181.044,191.786L186.837,191.367L190.853,192.871L204.196,192.950L208.269,205.797L206.696,227.328L205.177,229.364L205.768,234.237L201.416,240.000L182.554,240.000L181.043,238.880L176.632,239.352L175.980,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-21060" d="M190.863,47.205L180.934,44.226L174.448,45.190L161.457,39.177L152.670,28.396L151.254,24.465L151.240,16.068L154.905,16