<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 노원구 2025 통계지역과 주변 경계"><title>서울특별시 노원구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11060" d="M130.220,240.000L132.552,236.883L137.466,235.518L139.834,235.655L144.474,233.220L144.228,227.488L145.655,227.473L150.023,233.385L151.364,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11070" d="M151.335,239.816L150.023,233.385L149.531,212.769L157.816,209.415L168.604,204.384L173.282,203.512L176.221,202.274L180.394,202.948L183.311,203.530L189.811,207.305L195.570,209.526L197.231,209.655L203.679,205.401L205.564,203.254L213.391,200.877L214.184,201.431L219.044,201.773L222.567,201.020L224.115,201.454L228.692,204.226L231.907,204.552L234.295,208.920L233.726,212.804L235.391,222.307L233.904,226.515L233.556,229.046L235.942,230.648L236.816,232.439L236.113,238.980L235.470,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11080" d="M1.735,173.030L4.277,173.699L5.938,178.639L6.769,178.855L14.890,185.796L22.239,189.355L25.209,191.557L28.805,191.800L31.478,192.827L31.374,194.205L30.528,196.254L30.755,199.587L32.562,205.306L34.315,206.267L38.071,210.374L44.166,212.339L45.088,214.178L47.057,213.830L49.529,214.755L52.525,216.683L54.781,219.512L57.661,220.137L58.031,222.518L67.32