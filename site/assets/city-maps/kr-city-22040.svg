<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="대구광역시 남구 2025 통계지역과 주변 경계"><title>대구광역시 남구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-22010" d="M137.313,24.000L134.767,4.593L139.371,0.000L253.591,0.000L252.343,2.804L240.016,18.276L238.285,24.004L237.682,31.983L238.727,41.619L209.049,39.931L204.638,37.250L197.458,36.103L176.877,35.718L162.181,37.413Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22030" d="M62.099,43.636L58.338,45.004L49.361,39.587L44.965,40.636L34.847,38.912L33.739,28.731L14.050,28.862L16.002,16.985L7.815,13.347L0.000,11.952L0.000,0.000L139.371,0.000L134.767,4.593L136.074,14.377L116.748,20.478L89.261,31.160L74.643,38.158L74.497,37.881Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-22060" d="M314.119,218.393L308.548,219.319L295.544,216.592L289.695,214.318L286.063,217.638L284.964,219.467L284.778,220.791L282.239,223.675L263.106,227.509L240.864,224.671L219.646,219.362L199.050,215.601L187.540,207.980L191.603,201.326L196.715,195.787L206.670,191.551L211.617,190.733L216.946,188.861L218.320,187.445L224.224,172.466L229.951,153.110L230.011,143.420L231.233,135.092L236.854,142.337L238.415,141.527L236.587,132.783L234.206,126.692L232.305,113.521L234.528,99.839L235.773,97.139L237.061,88.268L236.854,82.221L233.834,