<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="서울특별시 성북구 2025 통계지역과 주변 경계"><title>서울특별시 성북구 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11010" d="M2.303,240.000L0.000,237.034L0.000,49.120L16.266,45.672L20.460,44.352L22.927,42.298L27.036,37.700L35.505,40.664L39.122,44.893L38.769,47.543L39.581,48.932L43.550,50.281L46.946,47.814L48.413,47.594L49.482,48.307L49.446,49.634L47.291,51.798L46.049,62.833L50.303,68.758L51.584,72.069L53.386,77.954L52.642,79.954L55.190,88.441L56.312,89.662L61.713,92.202L65.196,95.017L66.134,98.694L65.801,108.351L64.014,110.405L63.290,114.100L63.007,119.492L67.652,138.726L64.105,142.392L60.309,144.450L54.669,144.581L51.677,145.360L51.643,151.778L52.767,156.073L57.524,162.565L58.566,163.442L64.242,166.962L70.123,168.300L71.964,169.312L70.922,170.606L71.078,170.892L95.355,167.130L97.521,167.595L101.575,167.532L103.161,169.078L104.058,171.257L103.384,174.974L105.122,178.059L109.895,181.988L109.804,184.130L110.151,184.792L114.366,185.388L115.886,187.932L117.915,197.432L121.764,206.376L124.662,207.184L125.993,206.778L130.337,203.006L132.002,203.623L134.659,202.370L136.884,200.699L141.277,201.968L142.295,202.966L144.377,208.971L145.385,214.267L147.303,216.000L157.013,214.202L158.714,214.388L159.127,234.835L147.367,237.226L142.804,240.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11020" d="M143.012,239.912L143.377,239.743L143.985,239.458L147.367,237.226L1