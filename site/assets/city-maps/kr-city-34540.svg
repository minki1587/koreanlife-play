<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="충청남도 서천군 2025 통계지역과 주변 경계"><title>충청남도 서천군 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-34030" d="M42.423,17.706L42.650,18.252L41.826,20.209L40.726,20.558L39.896,19.461L40.116,18.070L40.658,17.595ZM52.459,15.671L52.437,16.046L50.180,17.702L49.225,17.488L48.682,16.713L48.629,15.908L49.362,15.075ZM134.291,49.017L132.761,50.487L129.651,50.355L126.775,50.717L125.100,52.102L124.954,52.672L123.411,53.094L120.710,52.991L119.998,52.127L117.911,51.452L114.963,53.692L113.834,52.749L113.209,52.784L111.217,53.981L105.099,50.740L100.679,51.563L94.604,50.517L90.236,48.110L88.661,46.305L87.156,43.684L81.945,40.133L82.632,38.384L82.997,34.538L81.090,31.933L80.197,31.709L77.604,32.206L76.530,31.599L73.994,33.902L72.331,34.385L71.784,34.310L71.350,33.523L69.496,32.147L65.669,32.280L63.164,30.978L62.041,29.332L63.289,28.025L63.103,21.487L59.306,14.219L57.941,13.500L56.168,14.275L54.985,13.631L55.024,13.066L55.795,12.242L57.499,11.721L58.211,8.691L58.356,6.018L57.632,1.717L57.789,0.000L188.751,0.000L185.697,2.067L185.583,4.684L183.420,6.714L184.119,9.432L184.043,13.573L183.818,15.405L182.629,15.658L182.382,18.867L177.558,22.420L176.994,23.500L174.381,25.809L172.243,26.372L172.040,26.940L172.572,28.681L167.860,38.923L164.513,40.209L163.267,40.218L161.595,41.278L159.729,45.459L156.730,46.544L155.359,48.850L150.334,50.653L144.857,49.023L144.217,47.725L144.513,46.804L143.318,46.361L141.002,46.657Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="ro