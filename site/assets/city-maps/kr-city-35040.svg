<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="전북특별자치도 정읍시 2025 통계지역 경계 실루엣"><title>전북특별자치도 정읍시 2025 통계지역 경계 실루엣</title><desc>경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path d="M100.571,210.072L98.675,211.066L97.742,212.312L97.166,216.693L98.397,218.876L97.507,222.355L91.852,223.255L90.632,222.743L85.166,223.480L82.226,223.150L78.817,221.136L74.875,222.597L73.071,222.521L73.066,220.085L72.138,216.386L71.605,211.932L69.768,209.872L69.020,205.340L68.261,204.529L70.349,203.426L70.860,202.559L70.848,197.440L72.225,195.146L72.173,194.133L71.186,193.111L67.351,192.576L66.404,191.856L65.859,191.402L65.647,189.096L65.613,188.236L66.737,186.991L69.746,184.941L72.106,184.021L74.092,182.390L73.393,181.036L70.070,177.979L68.695,177.793L66.686,175.558L67.347,166.941L68.989,165.384L69.692,163.629L68.814,160.745L66.648,158.919L67.987,157.194L68.923,156.620L70.169,153.822L70.270,153.157L68.960,151.048L68.585,148.182L64.529,145.918L63.593,145.837L62.329,146.049L61.707,146.924L60.043,147.688L57.508,148.134L56.282,149.647L53.829,150.298L48.732,147.814L46.187,147.847L44.654,147.100L43.321,146.045L41.820,142.874L41.561,140.567L42.238,138.390L44.607,135.178L45.755,131.160L43.547,130.408L42.676,127.547L43.316,123.968L43.859,123.181L42.640,118.817L43.250,115.386L44.598,113.582L43.940,110.409L44.066,106.085L43.330,105.916L42.913,104.545L43.563,103.588L44.391,103.366L45.498,98.872L45.933,94.569L46.451,93.535L48.570,90.720L50.108,90.429L50.907,89.682L57.175,78.084L59.615,79.935L60.353,79.613L61.508,75.535L62.386,74.451L63.075,74.240L63.634,76.301L65.189,79.341L67.196,82.190L68.038,82.487L69.714,79.648L69.515,76.062L69.951,73.041L73.817,65.029L75.131,63.304L76.075,63.748L76.468,65.123L76.20