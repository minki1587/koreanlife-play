<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="경기도 과천시 2025 통계지역과 주변 경계"><title>경기도 과천시 2025 통계지역과 주변 경계</title><desc>초록색·검은 선은 선택 지역 전체, 회색은 같은 지도 범위 안의 실제 다른 시군구 일부입니다. 경계자료 2025-12-31, 출생률 기준 2025-12-31. 통계청 통계지리정보서비스 SGIS에서 공공누리 제1유형으로 개방한 행정동 경계를 가공한 vuski/admdongkor 자료(CC BY 4.0). 본 게임은 2025-12-31 버전의 읍면동을 2025 출생률 통계지역으로 합치고 EPSG:5179로 투영·간소화하여 SVG로 변환했습니다. https://sgis.kostat.go.kr / https://github.com/vuski/admdongkor / https://creativecommons.org/licenses/by/4.0/</desc><path data-map-layer="context" data-city-id="kr-city-11200" d="M83.166,0.173L83.134,0.000L83.757,0.000Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11210" d="M0.000,0.000L109.184,0.000L109.320,2.254L110.848,7.828L112.434,11.302L115.380,16.589L120.725,22.090L122.387,24.735L123.682,28.822L123.819,33.591L121.998,43.582L122.379,46.493L124.617,50.163L120.499,52.242L110.150,58.680L90.755,80.399L83.453,80.757L78.573,82.667L71.354,84.629L69.035,85.790L67.711,88.207L67.320,90.023L67.946,95.075L67.208,99.992L65.398,101.292L58.386,101.406L56.690,104.459L47.473,106.156L41.365,104.346L37.746,106.608L31.300,106.269L28.246,107.626L23.666,110.510L15.580,109.379L12.809,114.242L9.190,113.281L6.080,106.325L7.437,101.349L1.782,93.602L0.000,92.533Z" fill="#e5e7e2" fill-rule="evenodd" stroke="#92998e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path data-map-layer="context" data-city-id="kr-city-11220" d="M143.581,38.572L124.617,50.163L122.379,46.493L121.998,43.582L123.819,33.591L123.682,28.822L122.387,24.735L120.725,22.090L115.380,16.589L112.434,11.302L110.848,7.828L109.320,2.254L109.184,0.000L258.391,0.000L268.517,12.331L265.104,15.213L266.225,16.339L276.462,20.929L280.325,21.355L292.772,19.758L294.051,17.777L294.942,8.554L310.402,5.612L311.597,3.046L318.